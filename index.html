steps:["MANIVELLE : tournez régulièrement, environ 2 tours par seconde. Une minute donne généralement quelques minutes de radio ou de lumière.","Utilisez la manivelle pour les besoins essentiels : écouter les consignes officielles, éclairer brièvement, envoyer un SMS.","VÉLO : une dynamo dans le moyeu de la roue avant, associée à un chargeur USB spécial dynamo, recharge un téléphone en roulant.","À vitesse modérée (15 à 20 km/h), une dynamo de moyeu fournit environ 3 W, de quoi charger un téléphone en quelques heures de route.","Pour produire à l'arrêt, posez la roue arrière sur un home-trainer équipé d'un générateur, ou faites tourner la roue avant surélevée.","Stockez de préférence l'énergie dans une batterie externe intermédiaire, plus stable pour le téléphone."],
tips:["Un humain entraîné produit environ 50 à 100 W en pédalant longtemps : ça suffit pour des lampes et des recharges, pas pour un frigo.","Les radios à manivelle récentes ont souvent un petit panneau solaire et une sortie USB : le meilleur achat pour un sac d'urgence."],
warn:["Ne branchez jamais un téléphone directement sur une dynamo sans chargeur adapté : la tension variable peut l'endommager."],
why:"La dynamo transforme la rotation en courant grâce à un aimant qui tourne dans une bobine. Le chargeur stabilise ce courant à 5 V pour l'USB.",err:["Tourner la manivelle trop vite et par à-coups.","Compter sur ses muscles pour des appareils gourmands."],ok:"La lampe ou la radio fonctionne quelques minutes après une minute de manivelle.",alt:[],req:[["dynamo","velo"]]},
{id:"piles-batteries",cat:"energie",art:"e_piles",t:"Piles et accus : stocker, choisir, recharger",diff:1,time:"15 min",
s:"Lampes, radio, détecteurs : bien gérer ses piles fait la différence quand la coupure dure.",
mat:["Piles AA et AAA (alcalines ou lithium)","Accus rechargeables NiMH et chargeur","Adaptateur USB pour piles (facultatif)","Boîte de rangement"],
steps:["Standardisez : choisissez des lampes, radios et appareils qui utilisent le même format (AA de préférence).","Stockez des piles neuves dans leur emballage, au frais et au sec. Les piles lithium se gardent 10 à 20 ans et résistent au froid ; les alcalines 5 à 10 ans.","Gardez des accus NiMH « à faible autodécharge » chargés : ils se rechargent avec un panneau USB ou une batterie externe.","Ne mélangez jamais piles neuves et usagées, ni marques différentes, dans un même appareil.","Ne rechargez jamais des piles alcalines : risque de fuite et d'explosion.","Au froid, gardez les piles contre vous : une pile glacée semble vide mais retrouve sa charge en se réchauffant.","Un adaptateur USB à piles AA permet de recharger un téléphone en urgence avec des piles de rechange."],
tips:["Notez la date d'achat au marqueur sur l'emballage et faites tourner le stock.","Retirez les piles des appareils rangés longtemps : elles finissent par couler."],
warn:["Ne laissez jamais de piles boutons à portée des enfants : avalées, elles provoquent des brûlures internes graves en quelques heures. Appelez immédiatement le 112 ou le centre antipoisons."],
why:"Les piles stockent une petite quantité d'énergie très longtemps, sans entretien : idéal pour les appareils d'urgence qui servent rarement.",err:["Avoir dix formats de piles différents.","Découvrir que toutes les piles de la lampe ont coulé."],ok:"Chaque appareil d'urgence a un jeu de piles de rechange au bon format, daté.",alt:[],req:[["piles"]]},
{id:"eclairage-coupure",cat:"energie",art:"e_lampe",t:"S'éclairer pendant une coupure",diff:1,time:"10 min",
s:"La nuit tombe tôt en hiver : s'éclairer longtemps, sans danger et avec peu d'énergie.",
mat:["Lampes frontales et lanternes LED","Piles de rechange","Bouteille d'eau transparente","Lampes solaires de jardin (facultatif)","Bougies et bougeoirs stables (en dernier recours)"],
steps:["Donnez une lampe frontale à chaque membre du foyer : les mains restent libres et on ne cherche pas la lampe dans le noir.","Pour éclairer une pièce : posez la frontale allumée contre une bouteille d'eau transparente ou un bidon de lait vide, lumière vers la bouteille. Elle diffuse comme une lanterne.","Utilisez le mode faible : il suffit pour se déplacer et multiplie l'autonomie.","Rentrez le soir les lampes solaires du jardin et rechargez-les dehors le jour : chacune éclaire faiblement toute la soirée.","Regroupez la famille dans une seule pièce éclairée.","Si vous utilisez des bougies : bougeoir stable, dans un récipient non inflammable, loin des rideaux, jamais près d'un lit, jamais sans surveillance."],
tips:["Placez une lampe à côté de chaque lit et près de la porte d'entrée.","Un miroir derrière une source de lumière double l'éclairage de la pièce."],
warn:["Les bougies sont une cause majeure d'incendie pendant les coupures de courant : préférez toujours les lampes.","Pas de lampe à pétrole ou à gaz dans une pièce fermée : monoxyde de carbone."],
why:"Une LED donne autant de lumière qu'une bougie pour une fraction de l'énergie, sans flamme. L'eau diffuse la lumière dans toutes les directions.",err:["Allumer toutes les lampes à pleine puissance dès le premier soir.","Laisser des bougies allumées dans les chambres."],ok:"Chaque personne a une lampe, la pièce commune est éclairée et vous avez de quoi tenir plusieurs soirs.",alt:["Pas de lampe : lampe à huile (voir fiche Outils) dans un récipient stable.","Pas de piles : lampe à manivelle ou lampe solaire."],req:[["lampe","bougie","dynamo"]]},
/* ----- CARBURANT ----- */
{id:"siphonner",cat:"energie",art:"e_siphon",t:"Siphonner du carburant en sécurité",diff:2,time:"15 min",
s:"Transvaser du carburant d'un réservoir vers un jerrican, sans jamais l'aspirer avec la bouche.",
mat:["Pompe de transvasement manuelle (poire) ou siphon auto-amorçant (« shaker »)","Tuyau souple de 1,5 à 2 m (si pas de pompe)","Jerrican homologué","Entonnoir, chiffons","Gants"],
steps:["Ne siphonnez que votre propre véhicule ou machine, ou avec l'accord du propriétaire : prendre le carburant d'autrui est un vol.","Travaillez dehors, loin de toute flamme, cigarette ou étincelle ; coupez le moteur.","Posez le jerrican AU SOL, plus bas que le réservoir (pas dans un coffre ni sur une moquette) : le liquide s'écoule par gravité et l'électricité statique s'évacue.","Touchez une partie métallique de la voiture à mains nues avant de commencer, pour décharger l'électricité statique.","Introduisez le tuyau de la pompe dans le réservoir jusqu'à ce qu'il trempe dans le carburant.","Actionnez la poire ou secouez le siphon auto-amorçant jusqu'à ce que le carburant coule seul vers le jerrican.","Surveillez le niveau du jerrican ; pour arrêter, soulevez l'extrémité du tuyau au-dessus du niveau du réservoir.","Fermez le jerrican, essuyez les coulures, laissez sécher les chiffons dehors avant de les jeter."],
tips:["Beaucoup de voitures récentes ont un clapet anti-siphon dans le goulot : si le tuyau bloque, n'insistez pas. Les tondeuses, groupes et vieux véhicules se siphonnent plus facilement.","Étiquetez chaque jerrican : ESSENCE ou DIESEL. Un mélange peut détruire un moteur."],
warn:["N'aspirez JAMAIS le carburant avec la bouche : une seule gorgée inhalée peut provoquer une pneumonie chimique grave. En cas d'ingestion ou de vapeurs dans les poumons : centre antipoisons ou 112, ne faites pas vomir.","Ne percez jamais un réservoir et ne démontez pas les conduites de carburant : risque d'incendie.","Les vapeurs d'essence sont plus lourdes que l'air et s'enflamment à distance : pas de travail dans une fosse ou un garage fermé."],
why:"Un siphon fonctionne par gravité : une fois le tuyau rempli de liquide, celui-ci continue à couler tant que la sortie est plus basse que la surface du réservoir.",err:["Poser le jerrican plus haut que le réservoir : rien ne coule.","Amorcer à la bouche."],ok:"Le carburant coule régulièrement dans le jerrican posé au sol, sans que vous l'ayez touché avec la bouche.",alt:["Pas de pompe : remplissez entièrement le tuyau en le plongeant dans le réservoir, bouchez une extrémité avec le pouce ganté et descendez-la dans le jerrican.","Clapet anti-siphon : utilisez plutôt le carburant d'une tondeuse, d'un groupe ou d'un ancien véhicule."],req:["jerrican",["pompe","tuyau"]]},
{id:"stocker-carburant",cat:"energie",art:"e_jerrican",t:"Stocker une réserve de carburant",diff:1,time:"30 min",
s:"Garder quelques litres d'avance pour un groupe électrogène ou un départ urgent, sans créer un danger dans la maison.",
mat:["Jerricans homologués pour hydrocarbures (marquage UN)","Stabilisant de carburant","Étiquettes et marqueur","Local ventilé, hors des pièces de vie"],
steps:["Utilisez uniquement des jerricans homologués portant le marquage UN, jamais de bouteilles ou de bidons alimentaires.","Limitez la quantité au strict nécessaire et renseignez-vous auprès de votre commune, des pompiers et de votre assureur : les règles et les conditions d'assurance varient.","Remplissez à environ 95 % pour laisser de la place à la dilatation.","Ajoutez un stabilisant dès le remplissage : sans lui, l'essence ne se garde que quelques mois, et le sans-plomb E10 encore moins.","Étiquetez : type de carburant, date de remplissage, stabilisant oui/non.","Stockez dans un local ventilé, frais, à l'ombre, loin de la chaudière, des appareils électriques et des pièces habitées (abri de jardin plutôt que cave).","Faites tourner : versez la réserve dans le réservoir de la voiture avant 6 mois (essence) ou 6 à 12 mois (diesel) et remplissez à nouveau."],
tips:["Le meilleur stock de carburant est souvent un réservoir de voiture gardé au-dessus de la moitié.","Un jerrican en plastique a une durée d'usage limitée (souvent 5 ans) : vérifiez sa date de fabrication."],
warn:["Pour le transport, chaque récipient ne doit pas dépasser 60 litres et doit être bien calé, bouchon vissé.","Jamais de carburant dans la maison, sous un escalier ou près d'une source de chaleur."],
why:"L'essence s'évapore et s'oxyde avec le temps ; le stabilisant ralentit cette dégradation et un récipient étanche limite l'évaporation et les vapeurs.",err:["Oublier la réserve trois ans au fond du garage.","Utiliser une vieille bouteille d'eau."],ok:"Vos jerricans sont homologués, étiquetés, datés, rangés hors de la maison et utilisés avant leur date limite.",alt:[],req:["jerrican"]},
{id:"economiser-carburant",cat:"energie",art:"e_route",t:"Économiser son carburant",diff:1,time:"Réflexes",
s:"En pénurie, chaque litre compte. Les gestes qui réduisent la consommation de 20 à 30 %.",
mat:["Votre véhicule","Gonfleur ou manomètre"],
steps:["Regroupez tous vos trajets et renoncez à ceux qui ne sont pas indispensables.","Roulez plus lentement : sur autoroute, passer de 130 à 110 km/h réduit nettement la consommation.","Conduisez en souplesse : anticipez, accélérez doucement, passez vite les rapports, utilisez le frein moteur.","Coupez le moteur à chaque arrêt de plus d'une minute.","Vérifiez la pression des pneus : sous-gonflés, ils font consommer davantage.","Videz le coffre et retirez barres et coffre de toit.","Limitez la climatisation ; au-dessus de 80 km/h, préférez-la aux vitres grandes ouvertes."],
tips:["Notez votre consommation réelle (litres aux 100 km) : vous saurez exactement jusqu'où va votre réservoir.","Gardez en permanence au moins la moitié du réservoir quand une crise menace."],
warn:["Ne roulez pas sur la réserve en hiver ou sur un trajet isolé : une panne sèche peut devenir dangereuse."],
why:"La résistance de l'air augmente très vite avec la vitesse, et chaque accélération brusque gaspille de l'énergie dissipée ensuite en freinant.",err:["Faire chauffer le moteur longtemps à l'arrêt.","Rouler avec des pneus sous-gonflés."],ok:"Votre consommation baisse sur le même trajet.",alt:[],req:["vehicule"]},
{id:"rechaud-alcool",cat:"energie",art:"e_canette",t:"Réchaud à alcool en canette",diff:2,time:"20 min",
s:"Deux canettes, un couteau et de l'alcool à brûler : un réchaud léger pour chauffer de l'eau quand il n'y a plus de gaz.",
mat:["2 canettes en aluminium vides","Couteau ou cutter, punaise","Alcool à brûler (bioéthanol)","Petite casserole et supports (3 pierres ou un grillage)","Briquet"],
steps:["Coupez le fond de chaque canette à environ 3 cm de hauteur.","Avec une punaise, percez 16 à 24 petits trous régulièrement espacés autour du bord supérieur de l'un des fonds (la partie bombée).","Percez aussi un trou un peu plus grand au centre du fond bombé pour verser l'alcool.","Fendez légèrement le bord de l'autre fond et emboîtez les deux fonds l'un dans l'autre pour former un petit réservoir fermé.","Posez le réchaud sur une surface plane et non inflammable, à l'abri du vent.","Versez environ 2 cuillères à soupe d'alcool par le trou central, allumez au centre : après quelques secondes, des petites flammes sortent par les trous du bord.","Posez la casserole sur des supports à 2-3 cm au-dessus. 30 ml d'alcool chauffent environ un demi-litre d'eau."],
tips:["Une simple boîte de thon vide remplie de papier toilette roulé et imbibé d'alcool fait un réchaud encore plus simple.","Un pare-vent en papier d'aluminium autour améliore beaucoup le rendement."],
warn:["La flamme d'alcool est presque invisible en plein jour : ne rajoutez JAMAIS d'alcool sur un réchaud allumé ou encore chaud.","Utilisez-le dehors ou dans une pièce très bien ventilée, jamais dans une tente fermée.","Les bords d'aluminium coupés sont tranchants."],
why:"L'alcool chauffé dans le réservoir s'évapore et sort par les petits trous, où il brûle en jets réguliers comme un brûleur à gaz.",err:["Trous trop gros : flamme irrégulière.","Casserole posée directement sur le réchaud : elle étouffe les flammes."],ok:"Une couronne régulière de petites flammes sort des trous et l'eau bout en quelques minutes.",alt:["Pas de canettes : boîte de conserve ou de thon remplie de papier imbibé.","Pas d'alcool : réchaud à bois (poêle fusée) ou trou de Dakota."],req:[["canettes","alcool"]]},
{id:"bois-chauffage",cat:"energie",art:"e_bois",t:"Bois de chauffage : trouver, sécher, stocker",diff:1,time:"Variable",
s:"Le bois chauffe et permet de cuisiner sans électricité ni gaz, à condition qu'il soit sec.",
mat:["Scie ou hache","Lieu de stockage abrité et aéré","Gants"],
steps:["Préférez les bois durs (chêne, hêtre, frêne, charme, fruitiers) : ils brûlent longtemps. Les résineux s'allument vite mais encrassent les conduits.","Coupez les bûches à la longueur de votre poêle et fendez-les : le bois fendu sèche beaucoup plus vite.","Empilez-les sur des palettes ou des rondins, à l'abri de la pluie par le dessus, mais ouvertes sur les côtés pour que l'air circule.","Laissez sécher : il faut souvent 1 à 2 ans pour un bois dur coupé frais.","Un bois sec est léger, sonne clair quand on frappe deux bûches, présente des fentes aux extrémités et sa sève ne mousse pas en brûlant.","Gardez quelques jours de bois à l'intérieur, près du poêle (mais pas contre), pour qu'il soit chaud et sec à l'emploi."],
tips:["En urgence, le bois mort sur pied (debout) est souvent plus sec que celui tombé au sol.","Gardez aussi du petit bois d'allumage et du papier journal au sec."],
warn:["Ne brûlez jamais de bois traité, peint, aggloméré ou de palettes marquées « MB » : fumées toxiques.","Faites ramoner le conduit avant l'hiver et installez un détecteur de monoxyde de carbone.","Ramasser du bois en forêt est réglementé : renseignez-vous auprès du propriétaire ou de la commune."],
why:"Un bois humide gaspille sa chaleur à faire évaporer son eau, fume beaucoup et encrasse le conduit. Sec, il brûle proprement et chauffe deux fois plus.",err:["Brûler du bois fraîchement coupé.","Bâcher le tas entièrement : l'humidité reste prisonnière."],ok:"Vos bûches sont légères, fendues aux extrémités et brûlent avec une flamme vive sans siffler.",alt:["Pas de scie : branches mortes cassées au pied ou entre deux arbres, bâtonnage avec un couteau."],req:[]},
{id:"charbon-bois",cat:"energie",art:"e_charbon",t:"Fabriquer du charbon de bois",diff:2,time:"2 à 4 h",
s:"Le charbon brûle sans flamme ni fumée, chauffe fort et sert aussi à filtrer l'eau. Méthode en boîte métallique.",
mat:["Boîte métallique avec couvercle (pot de peinture vide et propre, boîte à biscuits)","Clou pour percer","Bois sec en petits morceaux","Feu de bois"],
steps:["Percez un petit trou (3 à 5 mm) au centre du couvercle.","Remplissez la boîte de morceaux de bois sec bien serrés, sans écorce si possible.","Fermez le couvercle et posez la boîte au milieu d'un feu vif.","Des fumées et des gaz sortent du trou et s'enflamment : c'est normal, le bois se transforme sans brûler car l'air ne peut pas entrer.","Quand plus aucune fumée ni flamme ne sort du trou (souvent 1 à 2 h), retirez la boîte du feu.","Bouchez le trou avec un peu de terre ou un clou et laissez refroidir COMPLÈTEMENT avant d'ouvrir, plusieurs heures.","Le charbon réussi est noir, léger, sonne clair et casse net."],
tips:["Le même procédé avec des carrés de tissu de coton donne du « char cloth », qui s'enflamme à la moindre étincelle.","Écrasé, le charbon sert de couche filtrante dans un filtre à eau improvisé."],
warn:["Ouvrir la boîte encore chaude fait s'enflammer le charbon au contact de l'air.","Le charbon de bois dégage beaucoup de monoxyde de carbone : jamais de barbecue ou de brasero à l'intérieur, même porte ouverte."],
why:"Chauffé sans air, le bois perd son eau et ses gaz sans pouvoir brûler : il reste du carbone presque pur, qui brûle ensuite lentement et sans fumée.",err:["Ouvrir trop tôt.","Trou trop grand : l'air entre et le bois se consume en cendres."],ok:"Les morceaux sont entièrement noirs à cœur, légers et cassants.",alt:[],req:["recipient"]}
);

/* ============ NOUVELLES FICHES ============ */
CRAFTS.push(
/* ----- PRIORITÉS ----- */
{id:"rester-ou-partir",cat:"priorites",art:"stop",t:"Rester ou partir ? Confinement ou évacuation",diff:1,time:"5 min",
s:"Face à une crise, la première décision est souvent la plus importante : rester à l'abri ou quitter les lieux.",
mat:["Radio ou téléphone pour les consignes officielles","Sac d'urgence prêt"],
steps:["Écoutez d'abord les autorités (radio, BE-Alert, site du Centre de crise) : si elles donnent une consigne, suivez-la.","RESTEZ si le danger est dehors et passager : nuage toxique, tempête, alerte nucléaire, émeute, froid extrême. Rentrez, fermez portes et fenêtres, coupez la ventilation.","PARTEZ si votre lieu devient dangereux : incendie, inondation qui monte, bâtiment endommagé, gaz qui fuit, ordre d'évacuation.","Si vous partez : coupez gaz, eau et électricité si on vous le demande, prenez le sac d'urgence, fermez à clé, laissez un mot indiquant où vous allez.","Partez tôt : les routes se bloquent vite. Suivez les itinéraires indiqués, pas les raccourcis.","Si vous restez : regroupez le foyer dans une pièce, avec eau, nourriture, radio, lampes et trousse.","Réévaluez toutes les heures : une situation sûre peut devenir dangereuse."],
tips:["Décidez à l'avance avec votre famille d'un point de rendez-vous près de chez vous et d'un autre hors de la ville.","En cas de doute pour un incendie ou une inondation, partir tôt est presque toujours plus sûr."],
warn:["Ne partez jamais à travers une zone inondée, un nuage de fumée ou de produits chimiques : rester à l'abri est alors plus sûr."],
why:"Rester protège des dangers extérieurs (air, vent, froid) ; partir protège des dangers qui menacent le lieu lui-même. La bonne décision dépend de l'endroit où se trouve le danger.",err:["Partir sur un coup de panique sans destination.","Attendre le dernier moment pour évacuer."],ok:"Vous savez en une phrase pourquoi vous restez ou pourquoi vous partez, et où vous allez.",alt:[],req:[]},
/* ----- ABRIS ----- */
{id:"abri-sac-poubelle",cat:"abris",art:"bache",t:"Abri d'urgence avec des sacs poubelle",diff:1,time:"5 min",
s:"Deux grands sacs poubelle suffisent à se protéger du vent et de la pluie en quelques minutes. Le premier réflexe quand on n'a rien d'autre.",
mat:["2 grands sacs poubelle solides (100 litres ou plus)","Feuilles mortes ou herbes sèches (facultatif)"],
steps:["Faites un trou de la taille du visage près du fond d'un premier sac, à l'opposé de l'ouverture.","Enfilez-le par la tête comme un poncho, le visage dans le trou : le corps est protégé de la pluie et du vent.","Glissez les jambes dans le second sac, jusqu'à la taille.","Asseyez-vous sur votre sac à dos, des branches ou des feuilles : jamais directement sur le sol.","Pour plus de chaleur, bourrez l'espace entre les vêtements et le sac de feuilles mortes sèches.","Mettez-vous à l'abri du vent derrière un rocher, un arbre ou dans un creux."],
tips:["Un sac orange ou de couleur vive vous rend aussi plus visible pour les secours.","Gardez deux sacs poubelle pliés dans chaque sac à dos et dans la voiture : quelques grammes qui sauvent."],
warn:["Ne mettez jamais un sac plastique sur la tête : risque d'étouffement. Le visage doit toujours être à l'air libre.","Le plastique retient la transpiration : aérez de temps en temps pour ne pas être mouillé de l'intérieur."],
why:"Le plastique arrête la pluie et le vent, qui sont les deux plus grandes causes de refroidissement. Les feuilles ajoutées emprisonnent de l'air chaud.",err:["Rester debout face au vent.","S'asseoir sur le sol mouillé."],ok:"Vous ne sentez plus le vent sur le corps et vous restez sec.",alt:["Pas de sacs : couverture de survie, bâche, ou se blottir dans un abri naturel."],req:["plastique"]},
{id:"maison-sans-chauffage",cat:"abris",art:"m_urbain",t:"Garder une pièce chaude sans chauffage",diff:1,time:"1 h",
s:"Coupure de courant ou de gaz en hiver : concentrer la chaleur dans une seule pièce pour tenir des jours.",
mat:["Couvertures, couettes, sacs de couchage","Rideaux épais, cartons, couvertures de survie","Ruban adhésif","Tente (facultatif)"],
steps:["Choisissez une petite pièce, de préférence au centre de la maison ou exposée au sud, avec peu de fenêtres.","Regroupez-y tout le foyer et les animaux : chaque personne dégage de la chaleur.","Fermez toutes les portes des autres pièces. Bouchez le bas de la porte avec une couverture roulée.","Couvrez les fenêtres de couvertures, cartons ou couvertures de survie (côté brillant vers l'intérieur) ; ouvrez-les en journée s'il y a du soleil.","Isolez le sol avec des tapis, matelas, cartons.","Montez une tente dans la pièce ou faites une cabane avec une table et des couvertures : un petit volume se réchauffe très vite.","Habillez-vous en couches, bonnet compris, même à l'intérieur ; mangez et buvez chaud.","Aérez quelques minutes deux fois par jour pour renouveler l'air, surtout si plusieurs personnes dorment dans la pièce."],
tips:["Une bouillotte ou une bouteille d'eau chaude dans le lit vaut mieux qu'un chauffage d'appoint dangereux.","Les personnes âgées et les bébés se refroidissent vite : surveillez-les en priorité."],
warn:["N'utilisez jamais de barbecue, brasero, réchaud de camping, four à gaz ouvert ou groupe électrogène à l'intérieur pour se chauffer : monoxyde de carbone mortel.","Poêle à pétrole : uniquement s'il est prévu pour l'intérieur, avec une pièce aérée et un détecteur de CO."],
why:"Chauffer une petite pièce bien isolée demande beaucoup moins d'énergie qu'une maison entière ; les corps rassemblés suffisent parfois à garder plusieurs degrés de plus.",err:["Disperser la famille dans plusieurs chambres froides.","Chauffer avec un appareil à combustion non prévu pour l'intérieur."],ok:"La pièce reste nettement plus chaude que le reste de la maison et personne ne frissonne.",alt:["Pas de tente : table recouverte de couvertures, ou matelas posés contre les murs."],req:[]},
{id:"quinzee",cat:"abris",art:"neige",t:"Quinzhee : dôme de neige tassée",diff:3,time:"2 à 3 h",
s:"Un igloo simplifié creusé dans un tas de neige : l'abri le plus chaud en hiver quand la neige n'est pas assez épaisse pour creuser une tranchée.",
mat:["Beaucoup de neige","Pelle, casserole ou planche","Une vingtaine de bâtons de 30 cm"],
steps:["Entassez la neige en un dôme d'environ 2 m de haut et 3 m de diamètre, en mélangeant les couches pour casser la structure.","Plantez des bâtons de 30 cm de long tout autour du tas, vers le centre : ils serviront de repère d'épaisseur.","Laissez reposer au moins 1 à 2 heures : la neige se tasse et durcit (le « frittage »).","Creusez une entrée basse côté opposé au vent, puis évidez l'intérieur en creusant vers le haut.","Arrêtez de creuser dès que vous touchez la base d'un bâton : les parois font alors 30 cm.","Lissez le plafond en voûte pour que l'eau de fonte coule le long des murs au lieu de goutter.","Percez un trou d'aération dans le toit avec un bâton, et installez le couchage plus haut que l'entrée.","Isolez le sol avec des branches de conifères ou votre sac."],
tips:["Travaillez à deux : un qui creuse, un qui évacue la neige.","Une bougie suffit à élever la température intérieure de plusieurs degrés."],
warn:["Ne construisez pas en pente ni sous des arbres chargés de neige ; ne dormez jamais seul dans un abri de neige sans prévenir.","Gardez toujours le trou d'aération ouvert, et pas de réchaud à l'intérieur."],
why:"La neige tassée devient un matériau solide qui isole comme une paroi pleine d'air. Le corps et une bougie maintiennent l'intérieur autour de 0 °C même par grand froid.",err:["Creuser sans attendre le tassement : effondrement.","Parois trop fines : le toit s'affaisse."],ok:"Le dôme tient sans fléchir, l'intérieur reste sec et vous voyez une lueur bleutée à travers les parois.",alt:["Neige épaisse disponible : la tranchée-abri est plus rapide."],req:["neige"]},
{id:"tipi-branches",cat:"abris",art:"appentis",t:"Abri tipi en branches (wickiup)",diff:2,time:"2 à 3 h",
s:"Un cône de perches recouvert de branchages, assez haut pour s'asseoir et faire un petit feu au centre.",
mat:["3 perches maîtresses de 2,5 à 3 m","15 à 25 perches plus fines","Branches de conifères, écorce, fougères ou bâche","Cordage (facultatif)"],
steps:["Liez trois perches maîtresses près de leur sommet (brêlage en trépied) et dressez-les en les écartant.","Appuyez les autres perches tout autour, en laissant une ouverture côté opposé au vent.","Recouvrez du bas vers le haut, comme des tuiles, avec des branches de conifères pointes vers le bas, des fougères ou de l'écorce.","Laissez un trou de fumée au sommet si vous comptez faire un feu.","Installez une litière épaisse sur le sol.","Si vous faites un feu : petit, au centre, sur sol dégagé, et surveillez-le en permanence."],
tips:["Une bâche enroulée autour des perches rend le tipi étanche en quelques minutes.","Plus la pente est raide, mieux la pluie s'écoule."],
warn:["Un feu dans un abri en branchages peut tout enflammer en quelques secondes : gardez-le minuscule ou faites-le à l'extérieur.","Fumée et monoxyde de carbone : le trou du sommet doit rester ouvert."],
why:"La forme conique est stable dans toutes les directions et évacue bien la pluie ; l'air chaud monte vers le trou de fumée qui crée un tirage.",err:["Couverture trop fine.","Trépied trop peu écarté : il bascule."],ok:"Le tipi tient au vent, la pluie ne passe pas et vous pouvez vous asseoir dedans.",alt:["Pas de cordage : choisissez des perches à fourche qui s'emboîtent au sommet."],req:[]},
/* ----- FEU ----- */
{id:"feu-rondins",cat:"feu",art:"m_etoile",t:"Feu en carré (log cabin) pour cuisiner",diff:1,time:"20 min",
s:"Une structure en rondins croisés qui brûle régulièrement, donne beaucoup de braises et supporte une casserole.",
mat:["Amadou et petit bois","Bûches de la grosseur du poignet","Briquet, allumettes ou ferro"],
steps:["Préparez un petit tipi d'allumage au centre, non allumé.","Posez deux bûches parallèles de chaque côté du tipi.","Posez deux autres bûches en travers, par-dessus, pour former un carré.","Continuez sur 4 à 6 étages, en rapprochant légèrement les bûches vers le haut.","Allumez le tipi central : il enflamme progressivement la structure.","Une fois les braises formées, posez la casserole sur les bûches du haut ou sur deux pierres de chaque côté."],
tips:["Variante « feu inversé » : posez les grosses bûches en bas et le petit bois au sommet, allumez par le haut. Il brûle longtemps sans surveillance.","Le carré laisse passer l'air et produit un lit de braises régulier, idéal pour cuisiner."],
warn:["Dégagez le sol sur 1 m autour et gardez de l'eau à portée."],
why:"Les bûches croisées laissent l'air circuler de tous les côtés et forment une cheminée : le feu brûle uniformément et longtemps.",err:["Serrer les bûches : l'air ne passe plus.","Allumer sans tipi central."],ok:"La structure brûle de façon régulière et forme un lit de braises plat.",alt:[],req:[["briquet","ferro","loupe","pile"]]},
{id:"allume-feux",cat:"feu",art:"ferro",t:"Préparer ses allume-feux (coton vaseliné, char cloth)",diff:1,time:"30 min",
s:"Des allume-feux maison, légers et fiables, qui transforment une simple étincelle en flamme durable.",
mat:["Boules de coton (coton à démaquiller)","Vaseline","Petite boîte métallique avec couvercle percé","Carrés de tissu 100 % coton (vieux t-shirt)","Sachets zip ou tube étanche"],
steps:["COTON VASELINÉ : malaxez une boule de coton avec une noix de vaseline jusqu'à ce qu'elle soit imprégnée mais encore duveteuse.","Rangez une dizaine de boules dans un tube ou un sachet étanche.","Pour l'utiliser, effilochez une boule pour faire apparaître des fibres sèches : une étincelle suffit, elle brûle 2 à 4 minutes.","CHAR CLOTH (tissu carbonisé) : placez des carrés de coton dans la boîte métallique, couvercle percé d'un petit trou.","Posez la boîte dans un feu : de la fumée sort du trou. Quand elle s'arrête, retirez la boîte et laissez-la refroidir fermée.","Le tissu devenu noir et souple prend la moindre étincelle et forme une braise : posez-la dans un nid d'amadou et soufflez."],
tips:["Les copeaux de bougie, le papier ciré, les chips et les bâtons à plumes font aussi de bons allume-feux.","Gardez un sachet d'allume-feux uniquement pour les urgences."],
warn:["Ne laissez pas la boîte se refroidir ouverte : le tissu s'enflammerait."],
why:"La vaseline brûle lentement comme une bougie, avec les fibres de coton comme mèche. Le tissu carbonisé est presque du carbone pur qui s'embrase à très basse température.",err:["Trop de vaseline : la boule ne s'enflamme plus.","Tissu synthétique : il fond au lieu de carboniser."],ok:"Une seule étincelle de ferro allume la boule ou fait rougir le tissu.",alt:[],req:[]},
{id:"poele-fusee",cat:"feu",art:"dakota",t:"Réchaud à bois (poêle fusée) en boîtes de conserve",diff:2,time:"30 min",
s:"Un réchaud qui cuisine avec une poignée de brindilles, presque sans fumée. Idéal en coupure de gaz.",
mat:["Une grande boîte de conserve (1 kg ou plus) et une plus petite","Pince coupante ou cisaille, gants","Sable, terre ou cendres pour isoler","Grille ou 3 boulons pour poser la casserole"],
steps:["Découpez une ouverture carrée en bas sur le côté de la grande boîte, à la taille de la petite boîte.","Retirez le fond de la petite boîte et faites-la entrer à l'horizontale par l'ouverture : c'est l'entrée du bois et de l'air.","Placez une autre petite boîte sans fond verticalement au-dessus pour faire la cheminée, en la raccordant au tube horizontal.","Remplissez l'espace autour de la cheminée avec du sable, de la terre ou des cendres : cette isolation fait monter la chaleur.","Posez une grille ou trois boulons sur le dessus pour laisser passer la flamme sous la casserole.","Allumez du papier et des brindilles dans l'entrée horizontale ; ajoutez des branches fines au fur et à mesure.","Le tirage aspire l'air par l'entrée : le feu ronfle et chauffe très fort."],
tips:["Une version encore plus simple : la bûche suédoise (voir fiche Feu longue durée).","Gardez le bois en petits morceaux secs de la grosseur d'un doigt."],
warn:["Utilisez-le uniquement dehors : même sans fumée visible, il produit du monoxyde de carbone.","Les boîtes deviennent brûlantes : posez le réchaud sur un sol minéral, loin des enfants."],
why:"Le conduit isolé crée un fort appel d'air : le bois brûle à haute température, presque complètement, donc avec peu de fumée et peu de combustible.",err:["Mettre de grosses bûches.","Oublier l'isolation autour de la cheminée."],ok:"La flamme sort de la cheminée et l'eau bout en quelques minutes avec quelques brindilles.",alt:["Pas de boîtes : trou de Dakota creusé dans le sol."],req:[]},
/* ----- EAU ----- */
{id:"eau-pluie",cat:"eau",art:"trouver",t:"Récupérer l'eau de pluie",diff:1,time:"30 min",
s:"Une averse peut remplir plusieurs bidons en une heure avec un toit, une gouttière ou une simple bâche.",
mat:["Bâche, poncho ou toit avec gouttière","Récipients propres (seaux, bidons, casseroles)","Tissu pour filtrer"],
steps:["À la maison : détachez le bas d'une gouttière et placez un seau ou un bidon propre dessous.","Laissez couler les premières minutes de pluie sans les récolter : elles lavent le toit (poussières, fientes, mousses).","En extérieur : tendez une bâche en pente légère entre des arbres, avec le point bas au-dessus d'un récipient.","Faites un petit creux dans la bâche avec une pierre au point bas pour concentrer l'écoulement.","Filtrez l'eau récoltée à travers un tissu propre pour retirer feuilles et insectes.","Purifiez-la avant de la boire (ébullition, pastilles, Javel), surtout si elle vient d'un toit.","Couvrez les récipients pleins pour éviter les moustiques et les feuilles."],
tips:["Un toit de 50 m² reçoit environ 50 litres par millimètre de pluie.","Gardez l'eau de pluie non purifiée pour la toilette, la vaisselle et les toilettes."],
warn:["Évitez l'eau ruisselant sur des toitures en amiante-ciment abîmées, en bois traité ou fraîchement peintes."],
why:"La pluie est déjà de l'eau distillée par la nature ; les impuretés viennent surtout de la surface sur laquelle elle ruisselle.",err:["Récolter les premières minutes d'eau sale.","La boire sans la purifier."],ok:"Vos récipients se remplissent d'une eau claire, que vous purifiez avant de la boire.",alt:["Pas de bâche : grandes feuilles orientées vers un récipient, sac plastique ouvert, vêtement essoré."],req:[]},
{id:"eau-vegetaux",cat:"eau",art:"plantes",t:"L'eau des plantes : sève de bouleau, vigne, lianes",diff:2,time:"Quelques heures",
s:"Au printemps, un bouleau peut donner plusieurs litres de sève potable par jour. D'autres plantes cachent aussi de l'eau.",
mat:["Couteau","Petit bâton creux ou tube","Récipient ou sac plastique","Ficelle"],
steps:["SÈVE DE BOULEAU (fin février à avril, avant les feuilles) : choisissez un bouleau d'au moins 25 cm de diamètre.","Percez ou incisez l'écorce sur 2 à 3 cm de profondeur, légèrement vers le haut, à hauteur de genou.","Insérez un petit tube ou un bâton creusé en gouttière, et suspendez un récipient dessous.","La sève goutte : elle est claire, légèrement sucrée et se boit telle quelle le jour même.","Rebouchez le trou avec un petit bout de bois ou de la résine en partant.","VIGNE SAUVAGE ET LIANES : coupez une liane épaisse en haut, puis en bas : l'eau s'écoule par l'extrémité basse. Elle doit être claire et sans goût amer.","Gardez les sèves au frais : elles fermentent en un à deux jours."],
tips:["L'érable, le noyer et le charme donnent aussi de la sève au printemps.","Un sac de transpiration sur une branche feuillue fournit aussi de l'eau en été."],
warn:["Ne buvez jamais une sève laiteuse, colorée, amère ou à l'odeur forte.","Ne saignez pas les arbres dans une forêt où c'est interdit, et limitez-vous à un trou par arbre."],
why:"Au printemps, l'arbre fait monter vers ses bourgeons une sève très riche en eau, filtrée par ses racines.",err:["Inciser trop profond ou faire plusieurs trous : l'arbre s'affaiblit.","Garder la sève plusieurs jours sans la refroidir."],ok:"La sève coule goutte à goutte, claire et légèrement sucrée.",alt:[],req:["couteau"]},
{id:"toilettes-sans-eau",cat:"eau",art:"s_hygiene",t:"Toilettes sans eau courante",diff:1,time:"15 min",
s:"Coupure d'eau ou d'égouts : des toilettes sèches propres évitent les maladies et économisent l'eau potable.",
mat:["Seau avec couvercle ou cuvette des toilettes","Sacs poubelle solides","Matière sèche : sciure, litière, terre sèche, cendres, papier journal","Gel hydroalcoolique ou savon"],
steps:["Si l'eau est coupée mais que les égouts fonctionnent : versez un seau d'eau non potable (pluie, bain) d'un coup dans la cuvette pour la chasse.","Si les égouts sont bouchés ou en cas d'inondation : ne tirez plus la chasse. Placez un sac poubelle dans la cuvette vide ou dans un seau.","Après chaque passage, couvrez d'une poignée de matière sèche : elle absorbe l'humidité et les odeurs.","Fermez le sac quand il est au tiers, doublez-le et stockez-le dehors dans un bac fermé, loin de l'eau.","Lavez-vous les mains à chaque fois : savon et eau, ou gel hydroalcoolique.","Séparez si possible l'urine (dans un bidon) des selles : le seau sent beaucoup moins."],
tips:["Prévoyez dans vos réserves un rouleau de sacs solides et un sac de litière pour chat.","L'urine diluée peut être versée dans le jardin, loin des puits et des potagers."],
warn:["Les excréments transmettent de nombreuses maladies : jamais près de l'eau de boisson ou de la nourriture."],
why:"La matière sèche absorbe l'humidité où se développent les bactéries et les odeurs ; isoler les déchets coupe la transmission des maladies.",err:["Tirer la chasse alors que les égouts débordent.","Oublier de se laver les mains."],ok:"Les toilettes ne sentent presque pas, les sacs sont fermés et stockés dehors, tout le monde se lave les mains.",alt:["Pas de seau : trou de 20 cm dans le jardin, loin des points d'eau, rebouché à chaque usage."],req:[]},
/* ----- NOURRITURE ----- */
{id:"glands",cat:"nourriture",art:"plantes",t:"Farine de glands",diff:2,time:"1 à 3 jours",
s:"Les glands sont très nutritifs mais amers et indigestes crus. Bien lessivés, ils donnent une farine pour galettes et bouillies.",
mat:["Glands de chêne mûrs (bruns, sans trou)","Pierre ou marteau","Grande casserole ou récipient","Tissu fin ou chaussette propre","Eau en quantité"],
steps:["Ramassez des glands bruns, lourds, sans petit trou (signe de ver). Jetez ceux qui flottent dans l'eau.","Écalez-les en les cassant entre deux pierres et retirez la fine peau brune.","Concassez-les en petits morceaux.","LESSIVAGE À CHAUD : faites bouillir dans l'eau, jetez l'eau devenue brune, recommencez avec de l'eau déjà chaude, jusqu'à ce qu'ils ne soient plus amers (souvent 5 à 10 fois).","LESSIVAGE À FROID : enfermez-les dans un tissu et laissez-les plusieurs jours dans un ruisseau propre, ou changez l'eau du récipient 2 fois par jour.","Goûtez : aucune amertume ne doit rester.","Faites sécher au soleil ou près du feu, puis broyez en farine.","Mélangez à de l'eau pour faire des galettes cuites sur une pierre chaude, ou une bouillie."],
tips:["Les glands de chêne rouge sont plus amers que ceux du chêne pédonculé.","La farine sèche se garde plusieurs semaines au sec."],
warn:["Ne mangez jamais de glands non lessivés : les tanins irritent l'intestin et les reins.","Ne confondez pas avec le marron d'Inde, toxique."],
why:"L'amertume vient des tanins, solubles dans l'eau. Les rinçages répétés les retirent et laissent les graisses et les glucides, très énergétiques.",err:["Arrêter le lessivage trop tôt.","Les faire bouillir dans la même eau sans la changer."],ok:"Un morceau goûté n'a plus aucune amertume.",alt:[],req:[]},
{id:"massette",cat:"nourriture",art:"plantes",t:"La massette, le supermarché des marais",diff:2,time:"30 min",
s:"La massette (quenouille) pousse dans presque tous les marais d'Europe et se mange de la racine au sommet, selon la saison.",
mat:["Couteau","Récipient","Eau pour laver"],
steps:["Identifiez-la : grandes feuilles plates en ruban, épi brun en forme de saucisse au sommet d'une tige raide, au bord des eaux calmes.","PRINTEMPS : arrachez les jeunes pousses, retirez les feuilles extérieures : le cœur blanc se mange cru ou cuit (goût de concombre).","DÉBUT D'ÉTÉ : les épis verts encore enveloppés se cuisent à l'eau et se mangent comme un épi de maïs.","ÉTÉ : le pollen jaune secoué dans un sac ajoute de la farine aux galettes.","AUTOMNE ET HIVER : les rhizomes (racines) contiennent beaucoup d'amidon : lavez, épluchez, écrasez dans l'eau et laissez déposer la farine au fond.","Cuisez toujours les parties récoltées dans une eau douteuse."],
tips:["Le duvet des épis mûrs est un excellent amadou et un isolant pour les vêtements.","Les feuilles sèches se tressent en nattes et en cordelettes."],
warn:["Ne confondez pas les jeunes pousses avec l'iris jaune (toxique) : l'iris a des feuilles disposées en éventail plat et pas d'odeur de concombre.","Évitez les mares polluées, les fossés de route et les eaux de ruissellement agricole."],
why:"La plante stocke son énergie dans ses rhizomes en amidon, et ses jeunes pousses tendres poussent toute la saison.",err:["La confondre avec l'iris.","Récolter dans une eau polluée."],ok:"Vous identifiez la massette sans hésitation et récoltez la partie de saison.",alt:[],req:[]},
{id:"germer-graines",cat:"nourriture",art:"m_comest",t:"Faire germer des graines",diff:1,time:"3 à 5 jours",
s:"Des légumes frais et riches en vitamines en quelques jours, sans jardin ni soleil, à partir de vos réserves.",
mat:["Graines à germer : lentilles, pois chiches, haricots mungo, blé, radis, alfalfa","Bocal en verre","Tissu fin ou gaze et élastique","Eau potable"],
steps:["Mettez 2 à 3 cuillères à soupe de graines dans le bocal (elles gonflent beaucoup).","Couvrez d'eau potable et laissez tremper 8 à 12 heures.","Fermez avec le tissu et l'élastique, videz l'eau.","Rincez 2 fois par jour : remplissez, secouez, videz complètement.","Laissez le bocal incliné, ouverture vers le bas, à l'abri de la lumière directe.","Après 2 à 5 jours, les germes mesurent 1 à 3 cm : mangez-les.","Gardez-les au frais et consommez-les dans les 2 jours."],
tips:["Les lentilles germées se mangent crues ; les haricots et pois chiches germés se mangent de préférence cuits.","Achetez des graines vendues pour la germination ou bio, non traitées."],
warn:["Germes qui sentent mauvais, gluants ou moisis : jetez tout.","Les germes de haricots rouges crus sont toxiques : cuisez-les toujours. Personnes fragiles et femmes enceintes : préférez-les cuits."],
why:"En germant, la graine transforme ses réserves en vitamines (dont la vitamine C) et devient plus digeste.",err:["Laisser les graines tremper dans l'eau stagnante.","Oublier les rinçages."],ok:"Les petites pousses blanches sortent toutes, sans odeur désagréable.",alt:["Pas de bocal : assiette avec un tissu humide, recouverte d'une autre assiette."],req:[]},
/* ----- CONSERVATION ----- */
{id:"lacto-fermentation",cat:"conservation",art:"m_bocal",t:"Lacto-fermentation (légumes au sel)",diff:1,time:"30 min + 1 à 3 semaines",
s:"Conserver des légumes des mois sans cuisson ni électricité, comme la choucroute. Simple et sûr si on respecte le sel.",
mat:["Légumes frais (chou, carottes, betteraves, haricots)","Sel non iodé","Bocaux en verre","Poids (petit sachet d'eau, pierre propre)"],
steps:["Lavez et coupez finement les légumes.","Pesez-les et ajoutez 2 % de sel (20 g par kilo) ; malaxez-les jusqu'à ce qu'ils rendent leur jus.","Tassez-les dans le bocal en éliminant les bulles d'air : le jus doit les recouvrir.","Si le jus ne suffit pas, complétez avec une saumure : 30 g de sel par litre d'eau.","Posez un poids pour garder tous les légumes sous le liquide et laissez 2 à 3 cm de vide en haut.","Fermez sans serrer et laissez à température ambiante 3 à 7 jours : des bulles apparaissent, c'est la fermentation.","Placez ensuite au frais (cave) : les légumes se gardent plusieurs mois."],
tips:["Ouvrez le couvercle une fois par jour les premiers jours pour laisser sortir le gaz.","Le jus acide de fermentation se boit et aide la digestion."],
warn:["Légumes à l'air libre = moisissure. Tout doit rester sous le liquide.","Odeur de pourri, couleur rose ou moisissures colorées en profondeur : jetez le bocal."],
why:"Le sel empêche les mauvaises bactéries de se développer, alors que les bonnes bactéries lactiques produisent de l'acide qui conserve les légumes.",err:["Pas assez de sel.","Laisser des légumes dépasser du liquide."],ok:"Après quelques jours, ça sent acidulé et les légumes sont croquants.",alt:["Pas de bocaux : pot en grès ou seau alimentaire avec une assiette et un poids."],req:["sel"]},
{id:"aliments-coupure",cat:"conservation",art:"m_zeer",t:"Garder ses aliments pendant une coupure de courant",diff:1,time:"Réflexes",
s:"Frigo et congélateur arrêtés : quoi garder, quoi jeter, et dans quel ordre manger.",
mat:["Glacière, sacs isothermes","Bouteilles d'eau congelées","Thermomètre de frigo (idéal)","Couvertures"],
steps:["N'ouvrez pas le frigo ni le congélateur : fermé, un frigo garde le froid environ 4 heures, un congélateur plein environ 48 heures (24 heures s'il est à moitié plein).","Si la coupure dure, regroupez les aliments du congélateur serrés les uns contre les autres et couvrez l'appareil d'une couverture.","Mangez d'abord les aliments les plus fragiles du frigo : viande, poisson, laitages, restes.","Utilisez les bouteilles congelées pour refroidir une glacière avec l'essentiel (médicaments au froid, lait pour bébé).","En hiver, une pièce non chauffée, un balcon à l'ombre ou une cave fraîche peuvent servir de frigo, à l'abri des animaux.","À la reprise du courant : jetez tout aliment fragile resté plus de 2 heures au-dessus de 4 °C, et tout produit décongelé qui ne contient plus de cristaux de glace (sauf s'il est cuisiné immédiatement)."],
tips:["Gardez en permanence quelques bouteilles d'eau au congélateur : elles prolongent le froid et deviennent de l'eau potable.","Le froid se garde mieux dans un congélateur plein : comblez les vides avec des bouteilles d'eau."],
warn:["Dans le doute, jetez : une intoxication alimentaire sans soins ni eau courante peut devenir grave.","Ne regelez jamais un aliment entièrement décongelé sans l'avoir cuit."],
why:"Les bactéries se multiplient vite au-dessus de 4 °C. Garder les portes fermées et l'appareil plein ralentit la remontée de température.",err:["Ouvrir le frigo toutes les heures pour vérifier.","Garder un plat douteux « parce que ça a l'air bon »."],ok:"Vous avez mangé les produits fragiles en premier et rien de douteux n'a été gardé.",alt:[],req:[]},
/* ----- PIÈGES ----- */
{id:"ojibwa",cat:"pieges",art:"ressort",t:"Piège à oiseaux (perchoir Ojibwa)",diff:2,time:"30 min",
s:"Un perchoir piégé décrit dans les manuels de survie militaires : l'oiseau se pose et un nœud coulant lui serre les pattes.",
mat:["Perche de 1,5 à 2 m","Petit bâton de 10 cm (perchoir)","Cordelette fine ou fil","Pierre de 0,5 à 1 kg","Couteau"],
steps:["Plantez la perche dans un endroit dégagé, là où les oiseaux se posent (lisière, clairière, près de l'eau).","Percez ou fendez un trou à travers la perche, près du sommet.","Taillez le petit perchoir pour qu'il entre juste dans le trou, sans forcer.","Attachez la pierre à une extrémité de la cordelette et faites passer la cordelette dans le trou.","Faites un nœud d'arrêt sur la cordelette juste après le trou et coincez-le avec le perchoir, qui dépasse à l'horizontale.","Formez un nœud coulant avec le reste de la cordelette, posé à plat sur le perchoir.","Quand un oiseau se pose, le perchoir tombe, la pierre descend et le nœud se resserre sur ses pattes."],
tips:["Placer des graines ou des baies au pied de la perche attire les oiseaux.","Relevez souvent : un oiseau pris attire les prédateurs."],
warn:["Presque tous les oiseaux sont protégés en Europe : uniquement en situation de survie réelle.","Démontez le piège en partant."],
why:"Le petit bâton tient en équilibre grâce à la tension de la cordelette ; le poids d'un oiseau suffit à le faire tomber et libérer la pierre.",err:["Perchoir trop serré : il ne tombe pas.","Pierre trop légère."],ok:"Une légère pression sur le perchoir le fait tomber et la boucle se resserre.",alt:[],req:["couteau",["corde","filfer"]]},
{id:"boite-piege",cat:"pieges",art:"figure4",t:"Boîte-piège (capture vivante)",diff:2,time:"1 h",
s:"Une caisse retournée qui retombe sur l'animal sans le blesser : on peut relâcher une prise non voulue.",
mat:["Caisse, cagette, panier ou cadre de branches liées","Bâtons pour un déclencheur en « figure 4 » ou une ficelle","Appât (graines, fruits, noix)","Pierre pour lester"],
steps:["Lestez la caisse retournée avec une pierre posée dessus pour qu'elle retombe franchement.","Soulevez un côté de la caisse et maintenez-le avec un déclencheur en « figure 4 » (voir l'assommoir figure 4), l'appât au bout du bâton horizontal, sous la caisse.","Variante simple : un bâton maintient la caisse, une longue ficelle attachée au bâton permet de le tirer quand l'animal est dessous.","Placez la boîte sur une coulée ou près d'une zone de nourriture.","Disposez un peu d'appât dehors, menant vers l'intérieur.","Relevez la boîte plusieurs fois par jour.","Pour récupérer l'animal, glissez une planche sous la caisse avant de la soulever."],
tips:["C'est la méthode la plus respectueuse : un animal non visé peut être relâché.","Avec la ficelle, vous choisissez quand déclencher."],
warn:["Le piégeage est réglementé : uniquement en situation de détresse.","Ne glissez jamais la main sous la caisse : morsures."],
why:"La caisse lestée tombe dès que le déclencheur bouge, et enferme l'animal vivant sans le blesser.",err:["Caisse trop légère : l'animal la soulève.","Déclencheur trop dur."],ok:"La caisse retombe dès qu'on touche l'appât et ferme bien au sol.",alt:["Pas de caisse : cadre de branches liées avec de la cordelette, recouvert de brindilles."],req:[]},
{id:"collet-perche",cat:"pieges",art:"collet",t:"Collet sur perche inclinée (écureuils)",diff:2,time:"30 min",
s:"Plusieurs collets posés sur une perche appuyée contre un arbre : les petits animaux grimpeurs l'empruntent comme raccourci.",
mat:["Perche de 2 m environ","Fil de laiton fin ou cordelette","Couteau"],
steps:["Repérez un arbre fréquenté par des écureuils (restes de cônes rongés au pied, nids dans les branches).","Appuyez une perche contre le tronc, inclinée à environ 45°.","Fixez 4 à 6 petits nœuds coulants de 6 à 8 cm de diamètre le long de la perche, sur le dessus et les côtés, à 3 cm de la perche.","Espacez-les d'environ 30 cm.","Les animaux empruntent la perche plutôt que le tronc ; la boucle se resserre à leur passage.","Relevez la perche au moins une fois par jour."],
tips:["Une seule perche peut prendre plusieurs animaux.","Placez quelques graines au pied de la perche pour attirer l'attention."],
warn:["Écureuils protégés dans de nombreux pays : uniquement en situation de survie.","Démontez tout en partant."],
why:"Les animaux choisissent toujours le chemin le plus facile ; une perche inclinée est plus simple à grimper qu'un tronc vertical.",err:["Boucles trop grandes ou trop éloignées de la perche.","Perche instable qui tombe au premier passage."],ok:"Les boucles restent ouvertes, bien en place, et la perche est stable.",alt:["Pas de fil : cordelette fine ou fil de pêche tressé."],req:[["filfer","corde"]]},
{id:"reussir-pieges",cat:"pieges",art:"m_traces",t:"Rendre un piège efficace : appât, odeur, emplacement",diff:1,time:"Méthode",
s:"Un piège mal placé ne prend jamais rien. Les règles qui comptent plus que le modèle de piège.",
mat:["Appâts locaux","Terre ou cendre pour masquer l'odeur"],
steps:["EMPLACEMENT : sur une coulée active, près de l'eau ou d'une zone de nourriture, entre le terrier et la nourriture.","CANALISER : utilisez des obstacles naturels (troncs, rochers) pour que le passage le plus facile mène au piège.","ODEUR : manipulez le piège le moins possible ; frottez vos mains et le matériel avec de la terre, de la cendre ou des feuilles du lieu.","DISCRÉTION : n'abîmez pas la végétation autour, ne laissez pas de traces de pas sur la coulée.","APPÂT : utilisez ce que l'animal mange déjà sur place (glands, baies, graines) ; pour les carnivores, viscères ou poisson.","NOMBRE : posez plusieurs pièges à des endroits différents, en notant leur emplacement.","PATIENCE : laissez 1 à 2 jours aux animaux pour s'habituer à la présence du piège."],
tips:["Laissez un appât sans piège quelques jours : quand il est mangé, posez le piège au même endroit.","Le sel attire de nombreux herbivores."],
warn:["Piégeage réglementé : uniquement en situation de détresse. Retirez tous les pièges en partant."],
why:"Les animaux sont méfiants et suivent des habitudes. Un piège sans odeur humaine, sur leur chemin et avec leur nourriture habituelle, ne leur paraît pas suspect.",err:["Poser un piège au hasard dans la forêt.","Utiliser un appât que l'animal ne connaît pas."],ok:"Vos pièges sont sur des coulées actives, discrets, et vous savez où chacun se trouve.",alt:[],req:[]},
/* ----- PÊCHE ----- */
{id:"peche-canette",cat:"peche",art:"hamecon",t:"Pêcher avec une canette ou une bouteille (moulinet hobo)",diff:1,time:"10 min",
s:"Sans canne à pêche : enrouler le fil autour d'une canette ou d'une bouteille et lancer comme un vrai moulinet.",
mat:["Canette, bouteille plastique ou bâton","Fil de pêche (10 à 20 m)","Hameçon et plomb ou petite pierre","Appât"],
steps:["Attachez le fil autour de la canette et enroulez-le régulièrement, sans le croiser.","Montez l'hameçon, l'appât et un petit lest au bout du fil.","Tenez la canette par le fond, ouverture tournée vers l'eau, dans l'axe du lancer.","Faites tourner le lest au bout de 50 cm de fil et lâchez-le vers la zone visée : le fil se déroule tout seul de la canette, comme un moulinet.","Pour ramener, enroulez le fil autour de la canette en tournant.","Quand un poisson mord, ferrez d'un coup sec et ramenez régulièrement, sans à-coups."],
tips:["Un flotteur fait avec un bout de bois ou un bouchon montre les touches.","Pêchez à l'aube et au crépuscule près des obstacles (voir Lire la rivière)."],
warn:["Pêche réglementée en temps normal : permis et périodes à respecter."],
why:"Le fil enroulé autour d'un cylindre se déroule sans frottement quand on le lance dans l'axe, exactement comme un moulinet fixe.",err:["Lancer avec la canette de travers : le fil s'emmêle.","Enrouler le fil en vrac."],ok:"Le fil se déroule proprement et vous ramenez la ligne sans nœuds.",alt:["Pas de fil de pêche : fil dentaire ou brins internes de paracorde."],req:[["peche"]]},
{id:"peche-main",cat:"peche",art:"m_poisson",t:"Pêche à la main et à l'épuisette improvisée",diff:2,time:"Variable",
s:"Dans les petits ruisseaux, on peut attraper poissons et écrevisses à la main ou avec un filet fait d'un vêtement.",
mat:["T-shirt, moustiquaire ou sac","Branche fourchue ou cercle de branche souple","Cordelette"],
steps:["ÉPUISETTE : courbez une branche souple en cercle, attachez-la sur un manche, et cousez ou nouez un t-shirt ou une moustiquaire en poche.","Placez-vous en aval d'une zone où les poissons se cachent (sous les pierres, les racines).","Tenez l'épuisette au fond, ouverture vers l'amont, et remuez pierres et racines en avançant depuis l'amont avec les pieds : les poissons fuient dans le filet.","À LA MAIN : approchez très lentement un poisson immobile sous une berge, mains par en dessous, depuis l'arrière.","Effleurez doucement son ventre en remontant vers les ouïes, puis refermez les mains d'un coup et jetez-le sur la berge.","Les petits ruisseaux peu profonds peuvent aussi être barrés de pierres pour isoler une poche d'eau à vider."],
tips:["Les eaux peu profondes et calmes, à l'aube, sont les plus faciles.","Gardez les mains dans l'eau froide quelques minutes avant pour qu'elles ne surprennent pas le poisson."],
warn:["Méthodes interdites hors survie dans la plupart des cours d'eau.","Ne marchez pas dans un courant fort au-dessus des genoux."],
why:"Un poisson effrayé fuit vers l'aval et vers les abris : l'épuisette l'y attend. Un poisson immobile ne réagit pas à un contact lent et doux.",err:["Gestes brusques et ombre sur l'eau.","Avancer depuis l'aval : on chasse les poissons dans le mauvais sens."],ok:"Vous attrapez de petits poissons ou des écrevisses en quelques passages.",alt:[],req:[]},
/* ----- OUTILS ----- */
{id:"couteau-securite",cat:"outils",art:"m_aiguiser",t:"Bien utiliser un couteau : les coupes de base",diff:1,time:"Entraînement",
s:"La plupart des blessures en camp viennent du couteau. Les gestes sûrs pour tailler, fendre et tailler en pointe.",
mat:["Couteau à lame fixe ou à cran d'arrêt","Bois sec et bois vert"],
steps:["CERCLE DE SÉCURITÉ : avant de couper, tendez le bras couteau fermé et tournez sur vous-même : personne dans ce rayon.","Coupez toujours en éloignant la lame de vous, jamais vers la main, la cuisse ou l'artère de l'aine.","Asseyez-vous, coudes sur les genoux, et travaillez devant les genoux, pas entre les cuisses.","COUPE AVANT : lame à plat sur le bois, poussez vers l'extérieur par petits copeaux.","COUPE DE LEVIER : main tenant le bois contre la poitrine, le pouce de l'autre main pousse le dos de la lame pour des coupes précises.","ENCOCHES : faites d'abord une coupe droite, puis venez la rejoindre en biais : le copeau sort net.","Rangez le couteau dans son étui dès que vous ne vous en servez plus ; ne le plantez jamais dans le sol."],
tips:["Un couteau bien affûté est plus sûr qu'un couteau émoussé : on force moins.","Passez le couteau à quelqu'un manche en avant."],
warn:["Une coupure profonde loin des secours est grave : arrêtez-vous si vous êtes fatigué ou si vos mains sont froides.","Vérifiez la législation sur le port d'arme blanche."],
why:"La plupart des accidents surviennent quand la lame glisse de façon imprévue. Couper vers l'extérieur et loin du corps garantit que la lame finit sa course dans le vide.",err:["Couper vers soi pour aller plus vite.","Travailler debout et penché."],ok:"Vos copeaux sont réguliers, vous gardez le contrôle et aucune partie du corps n'est sur la trajectoire de la lame.",alt:[],req:["couteau"]},
{id:"reparer-materiel",cat:"outils",art:"cordage",t:"Réparer vêtements et matériel",diff:1,time:"15 à 30 min",
s:"Une veste déchirée, une chaussure qui bâille ou une bâche percée peuvent mettre en danger. Réparer avec peu de moyens.",
mat:["Aiguille et fil solide (ou fil dentaire)","Ruban adhésif renforcé (duct tape)","Épingles de sûreté","Cordelette"],
steps:["ACCROC dans un vêtement : retournez-le et posez un morceau de ruban à l'intérieur et à l'extérieur, bords arrondis pour qu'ils ne se décollent pas.","COUTURE : faites un point simple solide (point arrière) avec du fil dentaire, très résistant.","CHAUSSURE qui se décolle : entourez la semelle et le dessus de plusieurs tours de ruban adhésif ou de cordelette fine, puis protégez avec du ruban.","BÂCHE PERCÉE : ruban adhésif des deux côtés ; pour un œillet arraché, enroulez un petit caillou dans le coin de la bâche et attachez la cordelette derrière (nœud de « bouton »).","FERMETURE ÉCLAIR cassée : remplacez par des épingles de sûreté ou des boucles de cordelette.","LUNETTES cassées : ruban ou fil de fer fin enroulé à la charnière."],
tips:["Enroulez quelques mètres de duct tape autour d'une gourde ou d'un briquet : on en a toujours sur soi.","Une aiguille sans fil peut aussi servir à percer une ampoule (stérilisée)."],
warn:["Une chaussure qui laisse entrer l'eau en hiver expose au pied d'immersion : réparez-la vite."],
why:"La plupart des pannes de matériel sont petites au début ; une réparation rapide évite qu'un détail devienne un vrai problème.",err:["Attendre que la déchirure s'agrandisse.","Ruban posé sur un tissu mouillé ou sale : il ne colle pas."],ok:"La réparation tient sous l'effort et l'objet est à nouveau utilisable.",alt:["Pas de fil : fibres de paracorde, fil dentaire, tendons séchés.","Pas de ruban : couture et colle de résine."],req:[]},
{id:"lessive-cendre",cat:"outils",art:"m_lampe",t:"Laver sans savon : lessive de cendres",diff:1,time:"24 h",
s:"La cendre de bois produit un liquide lavant utilisé pendant des siècles pour le linge et la vaisselle.",
mat:["Cendres de bois blanches et fines (pas de charbon, ni de bois traité)","Seau","Eau chaude","Tissu fin pour filtrer","Gants"],
steps:["Tamisez la cendre pour retirer les morceaux de charbon.","Versez environ 1 volume de cendre pour 5 volumes d'eau chaude dans un seau.","Mélangez et laissez reposer 24 heures en remuant de temps en temps.","Filtrez le liquide à travers un tissu fin : on obtient un liquide clair et légèrement glissant au toucher, la « lessive ».","Utilisez-le pour laver le linge ou la vaisselle grasse, puis rincez abondamment à l'eau claire.","Pour se laver les mains, frotter un peu de cendre fine mouillée puis rincer fonctionne aussi."],
tips:["Les cendres de bois de feuillus (hêtre, chêne) donnent une lessive plus efficace que les résineux.","Gardez la lessive dans un bidon fermé et étiqueté, hors de portée des enfants."],
warn:["La lessive de cendres est caustique : portez des gants pour une utilisation prolongée, évitez le contact avec les yeux.","Ne la mélangez jamais avec de la Javel ou d'autres produits ménagers."],
why:"La cendre de bois contient de la potasse : dissoute dans l'eau, elle forme une solution basique qui transforme les graisses en savon.",err:["Utiliser des cendres de charbon de barbecue ou de bois peint.","Ne pas rincer le linge."],ok:"Le liquide est clair, légèrement glissant, et dégraisse la vaisselle.",alt:[],req:[]},
/* ----- ORIENTATION ----- */
{id:"orientation-lune",cat:"orientation",art:"polaire",t:"S'orienter avec la lune",diff:1,time:"2 min",
s:"Quand on ne voit pas l'Étoile polaire, le croissant de lune donne une indication rapide du sud.",
mat:["Lune visible en croissant ou en quartier"],
steps:["Repérez les deux pointes (cornes) du croissant de lune.","Tracez mentalement une ligne qui relie les deux pointes.","Prolongez cette ligne jusqu'à l'horizon.","Dans l'hémisphère nord, le point où elle touche l'horizon indique approximativement le sud.","Pleine lune : à minuit, elle est à peu près plein sud.","Confirmez avec d'autres méthodes (étoiles, bâton et ombre le jour suivant)."],
tips:["La lune se lève à l'est et se couche à l'ouest, comme le soleil.","Si le côté éclairé de la lune est à droite, elle est croissante : visible surtout le soir."],
warn:["Méthode approximative : utilisez-la pour une direction générale, pas pour une navigation précise."],
why:"Le croissant est éclairé par le soleil, qui se trouve sous l'horizon. La ligne entre les pointes pointe donc vers le côté opposé à la direction du soleil, au sud.",err:["Utiliser la méthode avec une lune presque pleine où les pointes sont difficiles à voir."],ok:"La direction trouvée est cohérente avec celle de l'Étoile polaire ou du soleil.",alt:[],req:[]},
{id:"retrouver-civilisation",cat:"orientation",art:"m_carte",t:"Retrouver la civilisation sans carte",diff:1,time:"Variable",
s:"Perdu sans carte ni GPS : suivre les bons repères pour rejoindre une route ou un village, et savoir quand rester sur place.",
mat:["Observation","Marques pour baliser votre chemin"],
steps:["D'abord : si quelqu'un sait où vous êtes et qu'il fait encore jour, rester sur place reste souvent la meilleure option.","Montez sur un point haut pour observer : routes, lignes électriques, clochers, fumées, lumières la nuit, bruits de circulation.","LIGNES DE MAIN COURANTE : suivez des repères longs et continus : une route, un chemin, une ligne électrique, une clôture, une voie ferrée.","EAU : en Europe, suivre un ruisseau vers l'aval mène presque toujours à un village, mais longez-le sur les rives, pas dans le lit.","Méfiez-vous des gorges et des cascades : contournez par le haut.","Balisez votre chemin (branches cassées, cairns, flèches au sol) pour pouvoir revenir et être suivi.","Arrêtez-vous au moins 2 heures avant la nuit pour monter un abri."],
tips:["Les pylônes électriques sont reliés par des pistes d'entretien.","Un chemin qui s'élargit et porte des traces de pneus mène vers une route."],
warn:["Ne descendez jamais dans le lit d'un torrent ou une pente raide de nuit ou par brouillard.","Si vous êtes blessé ou épuisé, restez sur place et signalez-vous."],
why:"Les humains construisent leurs villages le long des rivières et des routes. Suivre une ligne continue évite de tourner en rond.",err:["Marcher au hasard en descendant n'importe quelle pente.","Quitter un chemin pour couper à travers bois."],ok:"Vous suivez un repère continu dans une direction choisie et vous balisez votre trajet.",alt:[],req:[]},
/* ----- PREMIERS SECOURS ----- */
{id:"noyade",cat:"secours",art:"m_rcp",t:"Noyade : sortir de l'eau et réanimer",diff:2,time:"Immédiat",
s:"Une personne qui se noie ne crie presque jamais. Secourir sans devenir soi-même une victime.",
mat:["Objet flottant (bouée, bidon vide, glacière)","Bâton, corde, vêtement"],
steps:["Appelez ou faites appeler le 112 immédiatement.","Ne vous jetez pas à l'eau en premier : TENDEZ un bâton, une branche, un vêtement depuis la rive, en restant allongé ou bien calé.","Sinon LANCEZ un objet flottant (bidon vide fermé, glacière, ballon) attaché à une corde si possible.","N'allez à l'eau qu'en dernier recours, avec un objet flottant à tendre à la victime pour garder la distance.","Une fois sortie : si elle ne respire pas normalement, commencez par 5 insufflations si vous êtes formé, puis la RCP (30 compressions, 2 insufflations).","Si elle respire : mettez-la en PLS, séchez-la et couvrez-la (hypothermie).","Toute personne ayant inhalé de l'eau doit être vue par un médecin, même si elle semble aller bien."],
tips:["Signes d'une noyade : tête en arrière, bouche au ras de l'eau, regard vide, mouvements comme pour monter une échelle, aucun cri.","En eau froide, le choc thermique fait perdre le souffle : restez sur le dos, calme, les premières minutes."],
warn:["La plupart des sauveteurs qui meurent se sont jetés à l'eau sans flotteur.","Courant, eau glacée ou crue : n'entrez jamais dans l'eau."],
why:"La noyade prive le cerveau d'oxygène : les insufflations sont prioritaires. Le secouriste ne doit pas s'exposer au même danger.",err:["Sauter à l'eau sans flotteur.","Croire qu'une personne qui se noie va crier ou faire des signes."],ok:"La victime est sortie sans que personne d'autre ne soit mis en danger, les secours sont prévenus et vous surveillez sa respiration.",alt:[],req:[]},
{id:"intoxication-co",cat:"secours",art:"m_urbain",t:"Intoxication au monoxyde de carbone",diff:1,time:"Immédiat",
s:"Chauffage d'appoint, groupe électrogène, barbecue à l'intérieur : la première cause d'intoxication mortelle pendant les coupures.",
mat:["Détecteur de monoxyde de carbone (prévention)"],
steps:["Pensez au monoxyde de carbone si plusieurs personnes ou animaux d'un même lieu ont mal à la tête, des nausées, des vertiges, une fatigue anormale ou une somnolence.","Aérez immédiatement : ouvrez portes et fenêtres en grand.","Arrêtez l'appareil à combustion si c'est possible sans rester longtemps dans la pièce.","Sortez tout le monde à l'air libre.","Appelez le 112 depuis l'extérieur.","Si une victime est inconsciente : sortez-la si vous pouvez le faire sans danger, vérifiez sa respiration, PLS ou réanimation.","Ne retournez pas dans le logement avant l'avis des secours."],
tips:["Installez un détecteur de CO à piles dans chaque pièce où se trouve un appareil à combustion et près des chambres.","Faites entretenir chaudières, poêles et conduits chaque année."],
warn:["Gaz invisible, sans odeur et sans goût : on ne le sent pas venir, et il endort avant de tuer.","Jamais de groupe électrogène, barbecue, brasero ou réchaud de camping à l'intérieur, même porte ouverte."],
why:"Le monoxyde de carbone se fixe sur le sang à la place de l'oxygène : les organes s'asphyxient alors que la personne respire normalement.",err:["Croire qu'une fenêtre entrouverte suffit avec un appareil à combustion.","Penser à une grippe ou à une indigestion collective."],ok:"Tout le monde est dehors, à l'air libre, et les secours sont prévenus.",alt:[],req:[]},
{id:"brancard",cat:"secours",art:"attelle",t:"Brancard improvisé et transport d'un blessé",diff:2,time:"20 min",
s:"Déplacer un blessé qui ne peut pas marcher, sur une courte distance, avec ce qu'on a sous la main.",
mat:["2 perches solides de 2 m","2 ou 3 vestes ou une couverture, une bâche","Cordelette"],
steps:["Ne déplacez un blessé que si c'est nécessaire : danger sur place, ou évacuation impossible autrement. En cas de suspicion d'atteinte du dos ou du cou, attendez les secours sauf danger immédiat.","BRANCARD À VESTES : fermez 2 ou 3 vestes, retournez les manches à l'intérieur et enfilez les deux perches dans les manches.","BRANCARD À COUVERTURE : posez une perche au tiers de la couverture, rabattez, posez la seconde perche, rabattez le reste par-dessus : le poids du blessé bloque le tissu.","Testez le brancard avec une personne valide avant d'y installer le blessé.","Installez le blessé couvert, isolé du froid, attaché si le terrain est accidenté.","Portez à 4 si possible, en marchant au pas, pieds du blessé vers l'avant (sauf en montée).","Faites des pauses régulières et vérifiez son état à chaque arrêt."],
tips:["Sur courte distance, deux personnes peuvent faire une « chaise à quatre mains » en se tenant les poignets.","Un traîneau improvisé (bâche tirée au sol) épargne les porteurs sur neige ou herbe."],
warn:["Un brancard improvisé peut céder : testez-le toujours et gardez-le près du sol.","Transporter un blessé épuise vite : sur une longue distance, mieux vaut souvent l'installer au chaud et envoyer chercher de l'aide."],
why:"Le poids du blessé tend le tissu entre les perches et le bloque, comme dans un vrai brancard.",err:["Brancard non testé.","Transporter un blessé du dos sans nécessité."],ok:"Le brancard supporte le poids d'un adulte sans glisser et les porteurs avancent au même pas.",alt:["Pas de perches : couverture tirée au sol ou portage dans les bras pour un enfant."],req:[]},
/* ----- SOINS ----- */
{id:"piqure-marine",cat:"soins",art:"s_animal",t:"Piqûres de vive, méduse et oursin",diff:1,time:"30 à 90 min",
s:"À la plage ou en pêchant : les blessures par animaux marins les plus fréquentes en Europe et les bons gestes.",
mat:["Eau très chaude (42 à 45 °C)","Eau de mer","Pince à épiler","Carte rigide","Désinfectant"],
steps:["VIVE ou RASCASSE : retirez les fragments d'épine visibles, puis plongez le membre dans une eau aussi chaude que supportable (42 à 45 °C, testée sur une peau saine) pendant 30 à 90 minutes : la chaleur détruit le venin.","MÉDUSE : sortez de l'eau, rincez à l'eau de mer (pas à l'eau douce), retirez délicatement les filaments avec une carte rigide ou une pince, puis appliquez de l'eau chaude 20 à 30 minutes.","OURSIN : retirez les épines visibles à la pince après avoir ramolli la peau dans l'eau chaude ; les petits fragments profonds sont souvent éliminés par le corps.","Désinfectez ensuite et surveillez l'infection les jours suivants.","Rassurez la victime : la douleur d'une piqûre de vive est très intense la première heure."],
tips:["Portez des chaussures d'eau sur les plages de sable et marchez en traînant les pieds.","Un sèche-cheveux ou une source de chaleur tenue à distance peut remplacer l'eau chaude."],
warn:["Ni sable, ni urine, ni garrot.","Malaise, difficulté à respirer, gonflement du visage, piqûre au visage ou chez un jeune enfant : appelez le 112."],
why:"Les venins de vive et de méduse sont des protéines détruites par la chaleur ; l'eau douce fait au contraire éclater les cellules urticantes des méduses.",err:["Rincer une piqûre de méduse à l'eau douce.","Eau trop chaude sur une zone insensible : brûlure."],ok:"La douleur diminue nettement pendant le bain chaud et la zone est propre.",alt:[],req:[]},
/* ----- SIGNALISATION ----- */
{id:"consignes-officielles",cat:"signal",art:"m_sifflet",t:"Recevoir les alertes et consignes officielles",diff:1,time:"10 min de préparation",
s:"En crise, l'information officielle dit s'il faut rester, partir ou se protéger. Savoir où l'écouter, même sans internet.",
mat:["Radio à piles ou à manivelle (FM, DAB+)","Téléphone","Liste des fréquences locales"],
steps:["Inscrivez-vous à l'avance aux alertes de votre pays : BE-Alert en Belgique (par SMS, appel ou e-mail selon votre adresse).","Activez les alertes d'urgence dans les réglages du téléphone (diffusion cellulaire).","Notez sur papier les fréquences de la radio publique et de la radio locale de votre région.","Pendant une crise, écoutez la radio publique aux heures pleines et notez les consignes.","Les sirènes d'alerte signifient souvent : rentrez, fermez portes et fenêtres, écoutez la radio.","Méfiez-vous des rumeurs sur les réseaux sociaux : vérifiez auprès des sources officielles.","Gardez la radio dans votre sac d'urgence avec des piles de rechange."],
tips:["Une radio fonctionne même quand internet et le réseau mobile sont coupés.","Testez votre radio une fois par mois, le jour du test des sirènes si votre région en fait."],
warn:["Ne bloquez pas le 112 pour demander des informations : utilisez les numéros d'information mis en place par les autorités."],
why:"Les autorités voient l'ensemble de la situation (vent, nuage, inondation) ; leurs consignes vous protègent mieux que votre perception locale.",err:["Se fier uniquement aux réseaux sociaux.","Découvrir que la radio n'a plus de piles."],ok:"Vous êtes inscrit aux alertes et votre radio fonctionne, avec les fréquences notées.",alt:["Pas de radio : autoradio de la voiture, moteur tournant à l'extérieur."],req:[["radio","vehicule"]]},
{id:"messages-piste",cat:"signal",art:"signaux",t:"Laisser un message et baliser sa piste",diff:1,time:"5 min",
s:"Si vous devez quitter un abri ou un véhicule, dites aux secours où vous allez.",
mat:["Papier, crayon, ruban coloré ou bandes de tissu","Pierres et branches"],
steps:["Avant de partir, écrivez un message daté : qui vous êtes, combien vous êtes, votre état, votre direction, l'heure de départ.","Placez-le bien en vue et à l'abri de la pluie : sous le pare-brise, dans un sac plastique accroché à la porte de l'abri.","Au sol, faites une grande flèche en pierres ou en branches dans la direction prise.","Balisez votre itinéraire tous les 50 à 100 m : branche cassée pointant la direction, cairn de 3 pierres, ruban coloré à hauteur des yeux.","Signes de piste classiques : trois pierres empilées = « je suis passé par ici » ; flèche = direction ; croix = « pas par là ».","À chaque arrêt important, laissez une nouvelle marque avec l'heure."],
tips:["Utilisez la couleur la plus vive disponible et placez les marques côté arrivée pour qu'elles soient vues de loin.","Vos marques vous permettent aussi de revenir en arrière."],
warn:["Quitter un véhicule ou un abri est rarement la meilleure décision : faites-le seulement si rester est plus dangereux."],

const pad=n=>String(n).padStart(2,"0");
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())};
const dmy=ts=>{const d=new Date(ts);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()};
const dur=ms=>{const m=Math.floor(ms/60000),h=Math.floor(m/60);return h?`${h} h ${pad(m%60)}`:`${m} min`};
const today=()=>new Date().toISOString().slice(0,10);
const daysUntil=d=>Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);

/* ---------- Suivi de crise ---------- */
const getActive=()=>store.get("hts-active",null);
function startCrisis(id){
  const s=SCEN.find(x=>x.id===id);
  store.set("hts-active",{id,start:Date.now()});store.set("hts-journal",[{ts:Date.now(),txt:"Début du suivi : "+(s?s.t:"situation d'urgence")}]);
  renderCrisisBar();toast("Suivi de crise démarré");
}
function logEntry(txt){if(!txt)return;const j=store.get("hts-journal",[]);j.push({ts:Date.now(),txt});store.set("hts-journal",j)}
function endCrisis(){
  const a=getActive();if(!a)return;const j=store.get("hts-journal",[]);j.push({ts:Date.now(),txt:"Fin du suivi"});
  const h=store.get("hts-history",[]);h.unshift({id:a.id,start:a.start,end:Date.now(),entries:j});store.set("hts-history",h.slice(0,20));
  store.del("hts-active");store.del("hts-journal");renderCrisisBar();toast("Crise terminée et archivée");go("journal");
}
let cbT=null;
function renderCrisisBar(){
  const el=$("#crisisbar"),a=getActive();clearInterval(cbT);
  if(!a){el.classList.remove("on");el.innerHTML="";document.body.classList.remove("incrisis");return}
  document.body.classList.add("incrisis");
  const s=SCEN.find(x=>x.id===a.id)||{ic:ic("alert"),t:"Situation d'urgence"};
  const draw=()=>{el.innerHTML=`<button class="cb-main" data-go="${s.id||"journal"}"><span class="cb-ic">${s.ic}</span><span><b>${esc(s.t)}</b><small>En cours depuis ${dur(Date.now()-a.start)}</small></span></button><button class="cb-btn" data-go="journal">${ic("edit")}<span>Journal</span></button>`};
  draw();el.classList.add("on");cbT=setInterval(draw,30000);
}

/* ---------- Position GPS ---------- */
function getPos(cb){
  if(!navigator.geolocation){toast("Localisation indisponible sur cet appareil");return}
  toast("Recherche de la position…");
  navigator.geolocation.getCurrentPosition(p=>cb({lat:p.coords.latitude.toFixed(5),lon:p.coords.longitude.toFixed(5),acc:Math.round(p.coords.accuracy),ts:Date.now()}),
   ()=>toast("Position indisponible : autorisez la localisation ou réessayez à l'extérieur"),{enableHighAccuracy:true,timeout:20000,maximumAge:60000});
}
const dms=(v,pos,neg)=>{const a=Math.abs(v),d=Math.floor(a),m=Math.floor((a-d)*60),s=((a-d-m/60)*3600).toFixed(1);return `${d}° ${m}′ ${s}″ ${v>=0?pos:neg}`};
function showPosition(){
  getPos(p=>{openSheet(`<div class="eyebrow">Ma position</div><h2 class="h2" style="margin:4px 0 14px">À dicter aux secours</h2>
   <div class="bigcoord">${p.lat}<br>${p.lon}</div>
   <ul class="kv"><li><span>Latitude</span><b>${dms(+p.lat,"N","S")}</b></li><li><span>Longitude</span><b>${dms(+p.lon,"E","O")}</b></li><li><span>Précision</span><b>± ${p.acc} m</b></li><li><span>Relevée à</span><b>${hm(p.ts)}</b></li></ul>
   <p class="hint">Le GPS fonctionne sans réseau mobile ; la précision est meilleure à ciel ouvert.</p>
   <div class="row2" style="margin-top:14px"><button class="btn sec" style="flex:1" id="posCopy">${ic("copy")}Copier</button><button class="btn pri" style="flex:1" id="posClose">Fermer</button></div>`);
   $("#posCopy").onclick=()=>copyTxt(`${p.lat}, ${p.lon} (± ${p.acc} m)`);$("#posClose").onclick=closeSheet;
   if(getActive())logEntry(`Position relevée : ${p.lat}, ${p.lon}`)});
}

/* =====================================================================
   OUTIL MORSE : émettre (flash, écran, son) et recevoir (caméra, tapotage)
