{id:"regle-des-3",cat:"priorites",art:"regle3",t:"La règle des 3",diff:1,time:"Mémoriser",
s:"L'ordre de survie : air, abri, eau, nourriture. Ce que l'on doit régler en premier.",
mat:["Rien : c'est un réflexe mental"],
steps:["3 minutes sans air : dégager les voies respiratoires, sortir d'un lieu enfumé, de l'eau ou d'une avalanche est la priorité absolue.","3 heures sans abri en conditions hostiles (froid, pluie, vent, chaleur extrême) : l'hypothermie ou le coup de chaleur tuent bien avant la soif ou la faim.","3 jours sans eau : dès que l'abri est assuré, organiser la recherche et la purification de l'eau.","3 semaines sans nourriture : la faim affaiblit mais tue lentement. Chercher à manger n'est pas une urgence des premières heures.","Ajouter la signalisation dès que possible : être retrouvé vite résout tous les autres problèmes.","Réévaluer les priorités à chaque changement de situation (nuit qui tombe, météo, blessure)."],
tips:["Les secours retrouvent la majorité des personnes égarées en moins de 72 h : rester visible et en bonne santé prime sur l'autonomie à long terme.","En milieu chaud, l'abri (l'ombre) et l'eau deviennent quasi simultanés."],
warn:["Ces durées sont des ordres de grandeur, pas des garanties : froid humide, blessure ou effort les raccourcissent fortement."]},
{id:"stop",cat:"priorites",art:"stop",t:"Méthode S.T.O.P. & S.U.R.V.I.V.A.L.",diff:1,time:"5 min",
s:"La méthode des armées pour reprendre le contrôle quand on est perdu ou en difficulté.",
mat:["Calme","Ce que vous avez sur vous"],
steps:["S – Stop : arrêtez-vous. Ne marchez pas au hasard, c'est ainsi qu'on s'enfonce.","T – Think (réfléchir) : d'où venez-vous ? Qui sait où vous êtes ? Combien de temps avant la nuit ?","O – Observe : météo, terrain, ressources (eau, bois, abri naturel), dangers, état physique de chacun.","P – Plan : fixez un plan simple selon la règle des 3, puis exécutez-le étape par étape.","Le moyen mnémotechnique militaire S.U.R.V.I.V.A.L. complète : Situation à évaluer, Une précipitation coûte cher, Repérez-vous, Vainquez la peur et la panique, Improvisez, Valorisez la vie, Agissez comme les locaux, Lucidité et apprentissage des bases.","Faites l'inventaire de tout ce que vous portez : chaque objet peut devenir un outil (lacets = cordage, sac plastique = récipient, emballage = signal)."],
tips:["Boire, manger un peu et s'asseoir aide réellement à calmer la panique.","Donner une mission à chaque membre d'un groupe réduit la peur."],
warn:["Ne quittez pas un véhicule ou un lieu d'accident sauf danger : ils sont plus faciles à repérer qu'une personne seule."]},
{id:"kit-survie",cat:"priorites",art:"kit",t:"Kit de survie de poche",diff:1,time:"1 h de préparation",
s:"Un petit kit qui tient dans une boîte métallique et change tout le reste de ce guide.",
mat:["Boîte métallique (servira aussi de récipient)","Briquet + ferrocérium + coton vaseliné","Couteau ou lame fixe","Couverture de survie","Sifflet","Petit miroir de signalisation","Boussole","Pastilles de purification d'eau","5 m de fil de laiton (collets)","Hameçons, fil de pêche, plombs","Paracorde 10 m","Pansements, bande, compresses","Sac plastique solide (eau, alambic)","Lampe frontale + piles"],
steps:["Choisissez un contenant étanche (boîte en métal type boîte à pastilles) pour pouvoir y faire bouillir de l'eau.","Doublez systématiquement le feu : au moins deux moyens (briquet + ferro).","Ajoutez la couverture de survie et le sifflet : ce sont les objets qui sauvent le plus de vies.","Placez les éléments fragiles (pastilles, coton) dans des sachets zip.","Collez au fond de la boîte une fiche avec les signaux au sol et les numéros d'urgence (112).","Vérifiez le kit tous les 6 mois : piles, dates de péremption, état du briquet."],
tips:["Le meilleur kit est celui qu'on a sur soi : il doit rester assez petit pour ne jamais être laissé à la maison.","Prévenez toujours quelqu'un de votre itinéraire et de l'heure de retour prévue."],
warn:["Vérifiez la législation sur le port de couteau dans votre pays."]},

/* --- ABRIS --- */
{id:"appentis",cat:"abris",art:"appentis",t:"Abri en appentis (lean-to)",diff:1,time:"1 à 2 h",
s:"Abri rapide à un seul pan incliné, idéal avec un feu réflecteur devant l'ouverture.",
mat:["2 arbres ou 2 piquets fourchus","1 perche faîtière (≈ 2,5 m)","10 à 20 perches de toit","Branchages, fougères, écorce ou bâche","Cordage (facultatif)"],
steps:["Choisissez un terrain plat, sec, légèrement surélevé, à l'abri des branches mortes (« widow-makers ») et loin des fonds de vallée où l'air froid s'accumule.","Repérez la direction du vent : le dos de l'abri devra faire face au vent.","Fixez la perche faîtière entre deux arbres ou deux fourches à hauteur de poitrine (environ 1,2 m).","Appuyez les perches de toit sur la faîtière, inclinées vers l'arrière à 45–60°, espacées de 20–30 cm.","Tressez quelques branches souples en travers pour créer une grille.","Recouvrez du bas vers le haut, comme des tuiles, avec des branches de conifères pointes vers le bas, des fougères ou de l'écorce : au moins 30 cm d'épaisseur pour être étanche.","Construisez une litière isolante d'au moins 15–20 cm de feuilles sèches ou de branchages : le sol vole plus de chaleur que l'air.","Allumez un feu à environ 1 m de l'ouverture et dressez derrière lui un mur réflecteur (rondins empilés) pour renvoyer la chaleur dans l'abri."],
tips:["Un toit plus pentu évacue mieux la pluie ; un toit moins pentu offre plus d'espace.","Ajoutez des parois latérales si le vent tourne."],
warn:["Ne construisez jamais sous des arbres morts ou des branches cassées.","Gardez le feu à distance raisonnable des matériaux secs de l'abri."]},
{id:"hutte-debris",cat:"abris",art:"debris",t:"Hutte de débris",diff:2,time:"2 à 3 h",
s:"L'abri le plus chaud sans feu : un « sac de couchage » en feuilles mortes.",
mat:["1 perche faîtière solide (votre taille + 30 cm)","1 support fourchu ou une souche","Nombreuses branches « côtes »","Énormément de feuilles mortes, aiguilles, herbe sèche"],
steps:["Appuyez une extrémité de la perche faîtière sur une souche ou une fourche à hauteur de hanche ; l'autre extrémité repose au sol.","Allongez-vous dessous pour vérifier : l'espace doit être juste assez grand pour vous, pas plus (moins d'air à chauffer).","Disposez des branches « côtes » des deux côtés de la faîtière, serrées, formant une carcasse en A.","Ajoutez quelques branchages fins en travers pour retenir les débris.","Empilez les feuilles mortes et débris sur toute la structure : visez une épaisseur d'un bras tendu (60 cm à 1 m). C'est l'épaisseur qui isole.","Ajoutez des branches par-dessus pour que le vent n'emporte pas la couche.","Remplissez l'intérieur d'une épaisse litière de feuilles sèches (30 cm comprimés au moins).","Entrez pieds en premier et bouchez l'entrée avec un gros tas de feuilles ou un sac rempli de débris."],
tips:["Si vous pouvez voir le jour à travers la paroi, ajoutez des débris.","Construisez-la avant la tombée de la nuit : il faut beaucoup plus de matière qu'on ne le pense."],
warn:["Vérifiez l'absence de fourmilières, nids de guêpes ou de serpents dans les feuilles collectées."]},
{id:"abri-bache",cat:"abris",art:"bache",t:"Abri en A avec bâche ou poncho",diff:1,time:"20 à 30 min",
s:"Avec une bâche, un poncho ou une couverture de survie, l'abri le plus rapide et le plus étanche.",
mat:["Bâche, poncho ou couverture de survie","Cordage ou paracorde (5–10 m)","4 à 6 sardines ou piquets taillés","2 arbres espacés de 3–4 m"],
steps:["Tendez une ligne de faîtage entre deux arbres à environ 1 à 1,2 m du sol (plus bas = plus chaud, plus haut = plus confortable).","Utilisez un nœud tendeur ou un nœud de cabestan pour pouvoir retendre la ligne.","Posez la bâche à cheval sur la ligne, centrée.","Taillez des piquets dans du bois vert : pointe à 45° et encoche pour la cordelette.","Tendez les coins au sol avec les piquets, côté vent le plus près du sol.","Ajoutez des pierres ou des branches sur les bords pour fermer les courants d'air.","Placez une litière isolante (branches, feuilles, sac à dos) sous vous."],
tips:["Côté brillant de la couverture de survie vers l'intérieur pour renvoyer la chaleur.","Une couleur vive tournée vers l'extérieur aide à être repéré."],
warn:["Ne vous installez pas dans un lit de ruisseau à sec : risque de crue soudaine."]},
{id:"abri-neige",cat:"abris",art:"neige",t:"Tranchée-abri dans la neige",diff:2,time:"1 à 2 h",
s:"La neige est un excellent isolant : à l'intérieur, la température reste proche de 0 °C même par grand froid.",
mat:["Neige d'au moins 60 cm","Pelle, ski, planche ou les mains gantées","Branches ou bâche pour le toit","Branches de conifère pour le sol"],
steps:["Choisissez une zone sans risque d'avalanche, à l'abri du vent.","Creusez une tranchée de la longueur de votre corps, large de 1 m et profonde d'au moins 1 m.","Creusez le couchage plus haut que l'entrée : l'air froid descend et sortira par le point bas.","Couvrez la tranchée avec des branches ou une bâche, puis recouvrez de 20–30 cm de neige (ou de blocs de neige découpés en toit en A).","Percez un trou d'aération de la taille d'un bâton dans le toit et gardez-le dégagé.","Isolez le sol avec des branches de conifère ou votre sac.","Fermez l'entrée avec un bloc de neige ou votre sac, sans la sceller complètement."],
tips:["Évitez de transpirer en creusant : retirez une couche de vêtements, l'humidité est votre ennemie.","Une bougie suffit à gagner quelques degrés."],
warn:["Ne faites jamais de feu ou de réchaud dans un abri fermé : risque d'intoxication au monoxyde de carbone.","Marquez l'emplacement de l'abri à l'extérieur pour les secours."]},

/* --- FEU --- */
{id:"feu-tipi",cat:"feu",art:"tipi",t:"Préparer et monter un feu (tipi)",diff:1,time:"15 à 30 min",
s:"La structure de feu la plus fiable : tout le secret est dans la préparation des combustibles.",
mat:["Amadou : herbe sèche, écorce de bouleau, duvet de massette, coton vaseliné","Petit bois : brindilles fines comme une allumette, puis comme un crayon","Bois moyen : épaisseur du pouce","Bûches : épaisseur du poignet et plus","Allumettes, briquet ou ferro"],
steps:["Choisissez un emplacement abrité du vent, sur sol minéral, dégagé sur 1 m autour, loin des racines et des branches basses.","Préparez TOUT avant d'allumer : une grosse poignée d'amadou, deux poignées de brindilles fines, deux de bois crayon, une brassée de bois moyen.","Ramassez du bois mort encore accroché aux arbres : il est plus sec que celui au sol. Il doit casser net (« crac »).","Faites un lit de bois sec si le sol est humide ou enneigé.","Placez le nid d'amadou au centre, puis dressez les brindilles fines en cône autour, en laissant une ouverture côté vent.","Ajoutez une deuxième couche de bois crayon en cône.","Allumez l'amadou par la base côté vent ; soufflez doucement à la base des flammes.","Quand le tipi s'effondre et forme des braises, ajoutez progressivement du bois plus gros. Ne l'étouffez pas."],
tips:["Le bouleau brûle même humide grâce à son écorce riche en résine.","Les brindilles mortes à la base des épicéas et sapins sont presque toujours sèches."],
warn:["Respectez les interdictions de feu et les risques d'incendie de forêt.","N'utilisez jamais de pierres de rivière autour du feu : elles peuvent éclater.","Éteignez totalement : noyez, remuez, noyez encore jusqu'à ce que les cendres soient froides au toucher."]},
{id:"feu-archet",cat:"feu",art:"archet",t:"Feu par friction à l'archet",diff:3,time:"1 à 3 h (fabrication)",
s:"La méthode primitive la plus efficace pour allumer un feu sans briquet. Demande de l'entraînement.",
mat:["Planchette en bois sec et tendre (tilleul, saule, peuplier, cèdre)","Foret droit du même bois, 20 cm, épaisseur du pouce","Archet : branche légèrement courbe, longueur du bras","Cordage (lacet, paracorde)","Poignée : bois dur ou pierre avec un creux","Copeau ou feuille pour recueillir la braise","Nid d'amadou très sec"],
steps:["Taillez le foret bien rond ; pointe arrondie côté planchette, pointe plus fine côté poignée (moins de friction en haut).","Creusez un petit trou de départ dans la planchette à 1–2 cm du bord.","Attachez la corde à l'archet avec un peu de mou ; enroulez-la une fois autour du foret (le foret doit être à l'extérieur de la corde).","Bloquez la planchette avec le pied, genou au sol, poignet appuyé contre le tibia pour la stabilité.","Mouvements longs et réguliers sur toute la longueur de l'archet pour « roder » le trou jusqu'à ce qu'il noircisse.","Taillez une encoche en V de la planchette jusqu'au centre du trou (environ 1/8 du cercle). C'est là que la poussière s'accumulera.","Placez le copeau sous l'encoche et reprenez : accélérez progressivement, augmentez la pression. La fumée doit être épaisse.","Quand la poussière noire fume seule, arrêtez. Transférez délicatement la braise dans le nid d'amadou, refermez-le et soufflez doucement jusqu'à la flamme."],
tips:["Si vous obtenez une poussière brune claire : pas assez de vitesse ou de pression. Si le foret crisse et brille : bois trop dur ou humide.","Lubrifiez le haut du foret (graisse de peau, feuille) pour réduire la friction côté poignée."],
warn:["Entraînez-vous AVANT d'en avoir besoin : réussir la première fois en conditions réelles est rare."]},
{id:"ferro",cat:"feu",art:"ferro",t:"Allumer avec un ferrocérium",diff:1,time:"5 min",
s:"Une tige de ferrocérium produit des étincelles à près de 3 000 °C, même mouillée, par milliers d'utilisations.",
mat:["Tige de ferrocérium","Grattoir ou dos de couteau à arête vive","Amadou fin et sec : coton vaseliné, écorce de bouleau grattée, duvet de massette, copeaux très fins"],
steps:["Préparez votre feu tipi complet avant de faire la moindre étincelle.","Préparez un amadou très fin : grattez l'écorce de bouleau ou faites des « bâtons à plumes » (copeaux fins restés attachés).","Posez l'extrémité de la tige directement dans l'amadou.","Plaquez le grattoir à 45° contre la tige.","Au lieu de pousser le grattoir, tirez la tige vers l'arrière en gardant le grattoir immobile : vous ne détruisez pas le nid.","Grattez fermement et lentement : les étincelles doivent tomber au cœur de l'amadou.","Soufflez doucement dès que l'amadou prend, puis glissez-le sous le petit bois."],
tips:["Une boule de coton imbibée de vaseline brûle 2 à 4 minutes : la meilleure aide à l'allumage.","Les tiges neuves ont un revêtement noir à gratter d'abord."],
warn:["Le ferro ne produit que des étincelles : sans amadou très fin, il n'allumera rien."]},
{id:"dakota",cat:"feu",art:"dakota",t:"Foyer « trou de Dakota »",diff:2,time:"30 à 45 min",
s:"Un feu enterré, discret, peu sensible au vent et très économe en bois. Utilisé par les militaires.",
mat:["Outil pour creuser (couteau, bâton, pelle)","Sol non rocailleux et pas trop humide","Petit bois et bois sec"],
steps:["Repérez la direction du vent.","Creusez un premier trou de 25–30 cm de diamètre et 30 cm de profondeur : c'est le foyer.","Côté vent, à 20–30 cm de distance, creusez un second trou plus petit (15 cm) : la cheminée d'arrivée d'air.","Reliez le fond des deux trous par un tunnel incliné.","Allumez le feu au fond du foyer avec de l'amadou et du petit bois.","L'aspiration crée un tirage puissant : le bois brûle presque sans fumée.","Posez une gamelle ou des bâtons verts en travers du trou pour cuisiner."],
tips:["Creuser près des racines d'un arbre aide à tenir les parois et à disperser la fumée.","Rebouchez les trous en partant : aucune trace."],
warn:["Ne creusez pas dans la tourbe ou un sol riche en racines sèches : le feu peut couver sous terre."]},

/* --- EAU --- */
{id:"trouver-eau",cat:"eau",art:"trouver",t:"Trouver de l'eau",diff:1,time:"Variable",
s:"Lire le terrain pour localiser l'eau, même en apparence absente.",
mat:["Récipients : bouteille, sac plastique, boîte","Tissu absorbant (t-shirt, bandana)","Bâton pour creuser"],
steps:["Descendez : l'eau suit la gravité. Fonds de vallée, ravines et pieds de falaises sont prioritaires.","Repérez la végétation plus verte et dense : saules, peupliers, roseaux et joncs indiquent de l'eau proche de la surface.","Suivez les traces d'animaux convergentes, surtout à l'aube et au crépuscule ; observez les oiseaux granivores qui volent bas et droit le soir, les abeilles et les mouches.","Dans un lit de rivière à sec, creusez à l'extérieur du virage, au point le plus bas : l'eau s'infiltre souvent dans le trou.","Collectez la rosée à l'aube : passez un tissu sur l'herbe haute puis essorez-le dans un récipient.","Récupérez la pluie avec une bâche, un poncho ou de grandes feuilles orientées vers un récipient.","Dans la neige : faites-la fondre avant de la boire, de préférence en ajoutant d'abord un fond d'eau liquide dans la gamelle."],
tips:["L'eau courante en surface est généralement moins contaminée que l'eau stagnante, mais doit quand même être purifiée.","Rationner l'eau quand on a soif est une erreur : buvez, mais réduisez la transpiration (ombre, repos aux heures chaudes)."],
warn:["Ne buvez jamais d'eau de mer ni d'urine : elles aggravent la déshydratation.","Manger de la neige directement fait chuter la température corporelle."]},
{id:"filtre",cat:"eau",art:"filtre",t:"Filtre à eau improvisé",diff:1,time:"30 min",
s:"Un filtre à couches qui clarifie l'eau trouble. Étape de préparation avant la purification.",
mat:["Bouteille plastique coupée (ou chaussette, jambe de pantalon, écorce roulée)","Tissu fin","Charbon de bois écrasé (feu de la veille, pas de cendres)","Sable fin, lavé","Graviers fins puis plus gros","Récipient de collecte"],
steps:["Coupez le fond d'une bouteille et retournez-la, bouchon percé en bas.","Placez un tissu au niveau du goulot.","Ajoutez une couche de charbon de bois écrasé de 5 cm (il retient particules et une partie des odeurs).","Ajoutez une couche de sable fin de 5–10 cm.","Ajoutez une couche de petits graviers, puis une couche de graviers plus gros.","Versez l'eau doucement ; jetez le premier litre qui rince le filtre.","Faites passer l'eau plusieurs fois si elle reste trouble.","Purifiez TOUJOURS l'eau filtrée ensuite (ébullition ou traitement chimique)."],
tips:["Laisser décanter l'eau quelques heures avant de la filtrer prolonge la vie du filtre.","Un simple tissu plié plusieurs fois retire déjà une partie des sédiments."],
warn:["Ce filtre NE rend PAS l'eau potable : il ne retire pas les virus, ni de façon fiable les bactéries et parasites."]},
{id:"purifier-eau",cat:"eau",art:"purif",t:"Purifier l'eau",diff:1,time:"10 min à 6 h",
s:"Les méthodes militaires et humanitaires pour rendre l'eau sûre à boire.",
mat:["Récipient métallique résistant au feu","Ou pastilles de purification","Ou eau de Javel non parfumée (≈ 5–6 %)","Ou bouteilles PET transparentes + soleil"],
steps:["ÉBULLITION (la plus sûre) : filtrez grossièrement, puis portez à gros bouillons pendant au moins 1 minute ; 3 minutes au-dessus de 2 000 m d'altitude.","PASTILLES : suivez la notice ; en général 30 minutes d'attente minimum, plus longtemps si l'eau est froide.","JAVEL : environ 2 gouttes de Javel à 5–6 % par litre d'eau claire, le double si l'eau est trouble ou froide. Mélangez et attendez 30 minutes : une légère odeur de chlore doit persister.","IODE (teinture à 2 %) : environ 5 gouttes par litre d'eau claire, 10 si elle est trouble ; attendre 30 minutes.","SODIS (solaire) : remplissez des bouteilles PET transparentes (2 L max) avec de l'eau claire, couchez-les en plein soleil sur une surface réfléchissante pendant 6 heures, ou 2 jours si le ciel est nuageux.","Stockez l'eau purifiée dans un récipient propre et fermé."],
tips:["Si vous n'avez pas de casserole : une bouteille plastique pleine d'eau ou un récipient en écorce posés sur les braises résistent tant qu'ils contiennent de l'eau.","On peut aussi faire bouillir l'eau dans un trou tapissé de bâche en y plongeant des pierres chauffées au feu."],
warn:["L'iode est déconseillé pour les femmes enceintes, les personnes avec un trouble thyroïdien et en usage prolongé.","Aucune de ces méthodes n'élimine les produits chimiques ou métaux lourds (eaux industrielles, minières, agricoles)."]},
{id:"alambic",cat:"eau",art:"alambic",t:"Alambic solaire & sac de transpiration",diff:2,time:"1 h + 24 h",
s:"Extraire de l'eau du sol et des plantes grâce au soleil.",
mat:["Feuille de plastique transparent (≈ 1,8 x 1,8 m)","Récipient","Petite pierre","Tuyau ou paille (facultatif)","Sac plastique transparent (pour la transpiration)","Végétation verte non toxique"],
steps:["ALAMBIC : creusez dans un endroit ensoleillé et humide un trou d'environ 90 cm de large et 60 cm de profondeur.","Placez le récipient au centre du fond ; disposez de la végétation verte autour pour augmenter l'humidité.","Couvrez le trou avec le plastique, scellez les bords avec de la terre et des pierres.","Posez une petite pierre au centre du plastique pour former un cône à 40 cm au-dessus du récipient, sans toucher les parois.","La condensation coule le long du plastique et goutte dans le récipient. Utilisez un tuyau pour boire sans ouvrir.","SAC DE TRANSPIRATION : enfermez une branche feuillue d'arbre en plein soleil dans un sac plastique transparent, fermé autour de la branche.","Orientez un coin du sac vers le bas ; l'eau s'y accumule. Changez de branche chaque jour."],
tips:["Un alambic produit souvent moins d'un litre par jour : ne comptez pas dessus comme seule source.","Versez dans le trou de l'eau impropre (eau salée, urine) : l'alambic la distille."],
warn:["Ne mettez jamais de plantes toxiques dans un sac de transpiration (laurier-rose, if…).","Creuser au soleil fait perdre beaucoup d'eau : travaillez aux heures fraîches."]},

/* --- NOURRITURE --- */
{id:"test-comestibilite",cat:"nourriture",art:"plantes",t:"Plantes : le test de comestibilité",diff:3,time:"24 h et plus",
s:"Le protocole militaire du « test universel de comestibilité », à n'utiliser qu'en dernier recours.",
mat:["Une seule espèce de plante, en grande quantité","Eau potable","Patience : rien d'autre à manger pendant le test"],
steps:["Testez UNE seule partie (feuille, tige, racine, fleur) d'UNE seule plante à la fois. Jeûnez 8 h avant.","Écrasez la partie et sentez-la : odeur d'amande amère ou de pêche (cyanure) → rejet immédiat.","Posez-la 15 minutes sur l'intérieur du poignet ou du coude. Brûlure, démangeaison, rougeur → rejet.","Préparez-la comme vous la mangeriez (de préférence cuite). Posez-la 3 minutes sur la lèvre.","Si rien ne se passe, posez-la 15 minutes sur la langue sans avaler.","Si rien ne se passe, mâchez 15 minutes sans avaler.","Si aucune réaction, avalez une petite bouchée et attendez 8 heures sans rien manger d'autre. En cas de malaise, faites-vous vomir et buvez beaucoup d'eau.","Si tout va bien, mangez 1/4 de tasse préparée de la même façon, attendez encore 8 h. Si aucun effet, cette partie, préparée ainsi, est probablement sûre."],
tips:["Mieux vaut apprendre AVANT 5 à 10 plantes comestibles certaines de votre région (ortie, pissenlit, plantain, ail des ours, châtaignes, glands lessivés…).","En règle générale, évitez : sève laiteuse, ombellifères (famille de la carotte, souvent mortelle), haricots en gousse, aspect amande, poils piquants, trois feuilles."],
warn:["NE TESTEZ JAMAIS LES CHAMPIGNONS : certains mortels ne provoquent aucun symptôme avant 24–48 h, quand il est trop tard.","Ce test ne détecte pas toutes les toxines. En cas de doute, abstenez-vous : on peut survivre des semaines sans manger."]},
{id:"insectes",cat:"nourriture",art:"insectes",t:"Insectes & vers comestibles",diff:1,time:"30 min",
s:"La source de protéines la plus facile à trouver : sauterelles, grillons, larves, fourmis, vers de terre.",
mat:["Récipient ou sac","Bâton pour fouiller","Feu pour la cuisson"],
steps:["Cherchez sous les pierres, les écorces décollées, dans les souches pourries (larves) et dans les herbes au petit matin (sauterelles engourdies par la fraîcheur).","Règle de sécurité : évitez les insectes aux couleurs vives, poilus, piqueurs, qui sentent fort, ainsi que mouches, moustiques et tiques (porteurs de maladies).","Pour les sauterelles et grillons : retirez pattes, ailes et tête.","Faites jeûner les vers de terre quelques heures dans de l'eau propre pour qu'ils se vident.","Faites toujours cuire : grillés sur une pierre chaude, rôtis sur un bâton ou bouillis. La cuisson tue les parasites.","Les fourmis et termites peuvent être grillées et broyées pour ajouter à une soupe."],
tips:["Grillés et broyés en poudre, ils sont plus faciles à manger et se conservent mieux.","100 g de sauterelles apportent autant de protéines qu'un steak."],
warn:["Les personnes allergiques aux crustacés peuvent réagir aux insectes."]},
{id:"cuisson-pierre",cat:"nourriture",art:"cuisson",t:"Cuisiner sans ustensiles",diff:1,time:"20 à 60 min",
s:"Pierre plate, broche, braises, papillote de feuilles : toutes les techniques de cuisson sans casserole.",
mat:["Pierre plate et sèche (non issue d'une rivière)","Bâtons verts (bois non toxique : noisetier, saule)","Grandes feuilles non toxiques ou argile","Feu réduit en braises"],
steps:["Laissez le feu se réduire en un lit de braises : on cuisine sur les braises, pas sur les flammes.","PIERRE : placez une pierre plate sur deux pierres latérales au-dessus des braises ; laissez-la chauffer 20–30 minutes, puis cuisez viande, poisson ou galettes dessus.","BROCHE : enfilez la viande sur un bâton vert, posez-le sur deux fourches ; tournez régulièrement, à distance des flammes.","PAPILLOTE : enveloppez poisson ou légumes dans plusieurs couches de grandes feuilles humides (ou d'argile) et enterrez dans les braises 20–40 minutes.","BOUILLIR SANS CASSEROLE : remplissez d'eau un récipient en écorce ou un trou tapissé de bâche, et ajoutez des pierres chauffées dans le feu, une à une.","Vérifiez la cuisson : jus clair, chair non rosée à cœur."],
tips:["Bouillir conserve tous les nutriments (gardez le bouillon) ; rôtir en perd une partie.","Une pierre de schiste ou d'ardoise sèche fait une excellente plancha."],
warn:["Les pierres de rivière ou humides peuvent exploser à la chaleur.","Évitez le bois de laurier-rose, if, sureau frais ou tout bois inconnu pour les broches."]},
{id:"four-terre",cat:"nourriture",art:"four",t:"Four en terre (cuisson à l'étouffée)",diff:2,time:"3 à 5 h",
s:"Cuire de grosses pièces lentement et sans surveillance, comme les fours polynésiens ou le « hangi ».",
mat:["Pierres sèches de la taille d'un poing (pas de rivière)","Bois en quantité","Feuillage vert non toxique ou herbe humide","Outil pour creuser","Viande, poisson, racines"],
steps:["Creusez une fosse 2 fois plus grande que la nourriture, environ 60 cm de profondeur.","Tapissez le fond de pierres, puis faites un gros feu dans la fosse pendant 1 à 2 heures pour les chauffer.","Retirez les braises et les cendres non consumées, gardez les pierres brûlantes au fond.","Couvrez les pierres d'une couche épaisse de végétation verte et humide.","Posez la nourriture enveloppée de feuilles, puis une nouvelle couche de végétation.","Recouvrez de 10–15 cm de terre pour sceller la vapeur.","Laissez cuire 2 à 4 heures selon la taille ; creusez prudemment pour sortir le repas."],
tips:["Plantez un bâton jusqu'à la nourriture avant de refermer : en le retirant, vous pourrez verser de l'eau pour plus de vapeur.","Idéal pour cuisiner pendant que vous construisez l'abri ou relevez les pièges."],
warn:["Vapeur et pierres restent brûlantes longtemps : ouvrez avec un bâton, pas à la main."]},
{id:"bannock",cat:"nourriture",art:"bannock",t:"Pain de survie (bannock)",diff:1,time:"20 min",
s:"Le pain des trappeurs : quelques ingrédients secs qui se transportent facilement et cuisent sur un bâton.",
mat:["Farine (2 parts)","Levure chimique (1 cuillère à café par tasse de farine, facultatif)","Une pincée de sel","Eau","Matière grasse (facultatif)","Bâton vert écorcé ou pierre chaude"],
steps:["Préparez à l'avance un sachet avec farine, levure et sel mélangés.","Ajoutez l'eau petit à petit jusqu'à obtenir une pâte souple qui ne colle pas aux doigts.","Ajoutez éventuellement graisse, baies séchées ou miel.","Roulez la pâte en un long boudin et enroulez-le en spirale autour d'un bâton vert écorcé.","Faites cuire au-dessus des braises en tournant, 10 à 15 minutes, jusqu'à ce que la croûte soit dorée et sonne creux.","Alternative : aplatissez en galette de 2 cm et cuisez sur une pierre chaude, 5–8 minutes par face."],
tips:["Le mélange sec se garde des mois dans un sac étanche.","Ajoutez des insectes broyés ou de la viande séchée pour les protéines."],
warn:["Gardez la pâte loin des flammes directes : extérieur brûlé, intérieur cru."]},

/* --- CONSERVATION --- */
{id:"secher-viande",cat:"conservation",art:"sechage",t:"Sécher la viande (jerky)",diff:2,time:"1 à 3 jours",
s:"La méthode de conservation la plus ancienne : retirer l'eau pour empêcher les bactéries de se développer.",
mat:["Viande maigre fraîche","Couteau bien aiguisé","Séchoir : perches et cordes ou claie de branches","Sel (facultatif mais recommandé)","Feu ou soleil et vent sec"],
steps:["Travaillez vite et proprement : la viande doit être fraîche, gardée au frais et à l'abri des mouches.","Retirez TOUT le gras visible : le gras rancit et gâche la conservation.","Coupez des lanières fines de 3 à 6 mm d'épaisseur, dans le sens des fibres (plus résistantes) ou en travers (plus tendres).","Facultatif : frottez de sel ou trempez dans une saumure forte quelques heures pour accélérer le séchage et limiter les bactéries.","Recommandation sanitaire : pour plus de sécurité, faites d'abord blanchir brièvement les lanières (eau bouillante ou au-dessus du feu) avant de les sécher.","Suspendez les lanières sans qu'elles se touchent, au soleil, au vent sec, ou au-dessus d'un feu fumant (pas de flammes).","Protégez des insectes avec la fumée ou un tissu fin.","La viande est prête quand elle est sèche, foncée, se plie et se fissure sans casser net. Comptez 1 à 3 jours au soleil, 12 à 24 h au-dessus d'un feu."],
tips:["Stockée au sec dans un sac en tissu ou une boîte, elle se garde plusieurs semaines.","Réhydratez-la dans une soupe pour la rendre plus digeste."],
warn:["En climat humide, le séchage au soleil seul est risqué : combinez avec la fumée.","Une odeur aigre ou une texture gluante = jetez."]},
{id:"fumer",cat:"conservation",art:"fumage",t:"Fumer viande et poisson",diff:2,time:"12 à 48 h",
s:"La fumée sèche, parfume et protège des insectes et des bactéries. Méthode du fumoir tipi.",
mat:["3 à 4 perches de 2 m","Bâche, branchages ou écorce pour couvrir","Grille de bâtons verts","Bois dur non résineux (hêtre, chêne, aulne, fruitiers)","Lanières de viande ou poisson ouvert en deux"],
steps:["Construisez un tipi de 1,5 à 2 m de haut avec les perches, attachées au sommet.","Installez à environ 60–90 cm du sol une ou deux grilles de bâtons verts.","Couvrez le tipi en laissant une petite ouverture au sommet pour la circulation.","Allumez un petit feu au centre, laissez-le se réduire en braises.","Ajoutez du bois vert ou humide, ou des copeaux, pour produire une fumée épaisse sans flammes.","Disposez la viande (3–6 mm) ou les poissons ouverts à plat, peau vers le bas, sur la grille.","Entretenez la fumée sans laisser monter de flammes. Le fumage à chaud prend 12 à 24 h ; un fumage long et froid plusieurs jours.","Le produit est prêt quand il est sec et cassant en surface, sans humidité à cœur."],
tips:["Salez le poisson 1 à 2 heures avant pour de meilleurs résultats.","Le poisson gras (truite, saumon) fumé se garde moins longtemps que la viande maigre."],
warn:["N'utilisez pas de bois résineux (pin, sapin) : goût amer et dépôts nocifs.","Ne pas utiliser de bois toxique (if, laurier-rose, bois traité)."]},
{id:"saler",cat:"conservation",art:"salage",t:"Saler la viande",diff:1,time:"1 à 4 semaines",
s:"Le salage à sec ou en saumure, utilisé par les marins et les armées pendant des siècles.",
mat:["Beaucoup de sel (environ 1 kg pour 3 à 4 kg de viande)","Récipient non métallique (bois, céramique, plastique)","Viande fraîche coupée en morceaux","Poids pour presser"],
steps:["Coupez la viande en morceaux réguliers (5 cm d'épaisseur max), sans os si possible.","SALAGE À SEC : frottez chaque morceau de sel sur toutes les faces, en insistant dans les replis.","Tapissez le fond du récipient de sel, alternez couches de viande et de sel, finissez par une couche de sel.","Posez un poids dessus ; retirez le liquide qui s'écoule les premiers jours et ajoutez du sel si nécessaire.","Laissez dans un endroit frais environ 1 jour par cm d'épaisseur.","SAUMURE : dissolvez du sel dans l'eau jusqu'à ce qu'un œuf ou une pomme de terre flotte ; immergez la viande totalement.","Avant consommation, faites dessaler dans plusieurs eaux pendant 12 à 24 h, puis faites cuire."],
tips:["Combinez sel + séchage ou sel + fumage pour une conservation encore plus longue.","Récupérez le sel de mer en faisant évaporer l'eau de mer dans un récipient au soleil ou au feu."],
warn:["Ne consommez pas de grandes quantités de viande salée sans eau en suffisance."]},
{id:"pemmican",cat:"conservation",art:"pemmican",t:"Pemmican",diff:2,time:"2 à 3 h",
s:"L'aliment de survie ultime des peuples d'Amérique du Nord : très énergétique et conservable des mois.",
mat:["Viande séchée très sèche (jerky)","Graisse animale fondue (suif)","Baies séchées (facultatif)","Pierre pour broyer, récipient"],
steps:["Utilisez une viande séchée jusqu'à devenir cassante.","Broyez-la en poudre fine entre deux pierres ou au marteau.","Faites fondre doucement la graisse animale à feu doux, filtrez les impuretés.","Ajoutez éventuellement des baies séchées écrasées.","Mélangez environ à poids égal poudre de viande et graisse liquide (1 pour 1).","Façonnez en galettes ou boulettes, laissez durcir au frais.","Emballez dans des feuilles, de l'écorce ou un sac et stockez au frais et au sec."],
tips:["Très dense : une petite quantité suffit pour une journée d'effort.","Le pemmican se mange tel quel ou dans un bouillon chaud (« rubaboo »)."],
warn:["Une graisse mal fondue ou une viande pas assez sèche rancit vite."]},

/* --- PIÈGES --- */
{id:"collet",cat:"pieges",art:"collet",t:"Collet simple",diff:1,time:"10 min par collet",
s:"Le piège le plus simple et le plus efficace pour le petit gibier (lapin, lièvre) selon les manuels militaires.",
mat:["Fil de laiton fin, câble fin ou cordelette solide","Bâton d'ancrage solide","Brindilles pour guider l'animal"],
steps:["Repérez une coulée active : passage tassé dans l'herbe, crottes fraîches, poils, souvent entre terrier et zone de nourriture.","Faites une petite boucle (œillet) à une extrémité du fil, passez l'autre extrémité dedans pour former un nœud coulant.","Pour le lapin : un nœud coulant d'environ 10 cm de diamètre (la taille d'un poing ouvert).","Positionnez le bas de la boucle à environ 4 doigts du sol, en travers de la coulée.","Fixez l'autre extrémité solidement à un piquet planté ou à une racine.","Placez des brindilles de chaque côté pour canaliser l'animal vers la boucle, sans obstruer le passage.","Posez plusieurs collets (en survie, les militaires recommandent d'en poser beaucoup) et notez leur emplacement.","Relevez-les au moins une fois par jour, idéalement à l'aube."],
tips:["Évitez de laisser votre odeur : manipulez le moins possible, frottez vos mains avec de la terre ou des feuilles.","Ne modifiez pas l'environnement autour de la coulée."],
warn:["Le piégeage est strictement réglementé, voire interdit, dans de nombreux pays. À réserver aux situations d'urgence vitale.","Ne posez pas de pièges là où des humains ou des animaux domestiques peuvent passer. Démontez-les tous en partant."]},
{id:"collet-ressort",cat:"pieges",art:"ressort",t:"Collet à ressort (perche)",diff:2,time:"30 min",
s:"Un collet qui soulève l'animal du sol : plus rapide, empêche les prédateurs de voler la prise.",
mat:["Jeune arbre souple ou perche flexible","Cordelette","Fil ou cordelette pour le nœud coulant","2 bâtons pour le déclencheur (un piquet à encoche, une clenche)","Couteau"],
steps:["Choisissez un jeune arbre souple à côté d'une coulée, ou plantez une longue perche flexible.","Plantez solidement un piquet près de la coulée et taillez-y une encoche en forme de crochet.","Taillez une clenche (petit bâton) avec une encoche qui s'emboîte dans celle du piquet.","Attachez la cordelette au sommet de l'arbre et à la clenche.","Fixez le nœud coulant à la clenche, en position au-dessus de la coulée.","Courbez l'arbre et emboîtez la clenche dans l'encoche du piquet : la tension les maintient.","Quand l'animal passe la tête et tire, la clenche se libère et l'arbre se redresse."],
tips:["Testez la sensibilité : le déclenchement doit se produire à la moindre traction.","Variante : appâtez la clenche pour en faire un déclencheur à appât."],
warn:["Mêmes obligations légales et de sécurité que le collet simple.","Restez hors de la trajectoire de la perche lors de l'armement."]},
{id:"figure-4",cat:"pieges",art:"figure4",t:"Assommoir en « figure 4 »",diff:3,time:"45 min",
s:"Un piège à poids (pierre ou rondin) déclenché par 3 bâtons encochés. Classique de tous les manuels de survie.",
mat:["Lourde pierre plate ou rondin","3 bâtons de même diamètre (≈ 2 cm) : montant, levier, déclencheur","Couteau","Appât (pour rongeurs : graines, noix)"],
steps:["MONTANT (vertical, ≈ 30 cm) : taillez le sommet en biseau (tournevis) et une encoche carrée sur une face.","LEVIER (diagonal, ≈ 30 cm) : taillez une extrémité en biseau et une encoche en V au milieu, qui viendra reposer sur le sommet du montant.","DÉCLENCHEUR (horizontal, ≈ 40 cm) : taillez une extrémité en biseau qui s'emboîtera dans l'encoche du levier, une encoche carrée qui s'accrochera à celle du montant, et effilez l'autre bout pour l'appât.","Assemblez au sol pour vérifier la forme du « 4 ».","Plantez le montant, posez le levier sur son sommet, accrochez le déclencheur appâté dans l'encoche du montant.","Appuyez le bord de la pierre sur l'extrémité du levier : le poids maintient l'ensemble en tension.","Quand l'animal tire l'appât, les bâtons se dérobent et la pierre tombe."],
tips:["La pierre doit être 5 fois plus lourde que l'animal visé.","Entraînez-vous chez vous avec un petit poids : le réglage demande de la pratique."],
warn:["Armez toujours la pierre en gardant les mains et doigts hors de sa zone de chute.","Usage soumis à la législation : uniquement en situation d'urgence."]},
{id:"lance",cat:"pieges",art:"lance",t:"Lance de survie",diff:1,time:"30 à 60 min",
s:"Outil de défense, de pêche et de chasse, fabriqué uniquement avec un couteau.",
mat:["Jeune arbre droit (≈ 2 m, diamètre 3 cm), bois dur","Couteau","Feu","Cordage (pour la version à pointes multiples)"],
steps:["Coupez un jeune arbre droit et retirez les branches et l'écorce.","Taillez une extrémité en pointe longue (10–15 cm), en retirant le bois en copeaux vers l'extérieur.","Durcissez au feu : passez la pointe au-dessus des braises en la tournant, sans la carboniser, jusqu'à ce qu'elle brunisse. Le bois devient plus dur.","VERSION PÊCHE : fendez l'extrémité en 4 sur 15 cm, écartez les dents avec deux petits bâtons croisés et attachez juste au-dessus, puis affûtez chaque dent.","Taillez des barbes à l'arrière des pointes pour que le poisson ne s'échappe pas.","Attachez éventuellement votre couteau à l'extrémité uniquement si vous en avez un second : perdre son seul couteau est grave."],
tips:["Pour la pêche, visez sous le poisson : la réfraction de l'eau le fait paraître plus haut qu'il n'est.","Approchez lentement, pointe déjà dans l'eau."],
warn:["La chasse à la lance est illégale dans la plupart des pays hors situation de détresse."]},
{id:"preparer-gibier",cat:"pieges",art:"gibier",t:"Vider et dépecer le petit gibier",diff:2,time:"20 à 30 min",
s:"Préparer un lapin ou un petit animal proprement pour éviter maladies et gaspillage.",
mat:["Couteau aiguisé","Eau propre","Gants ou sac plastique si possible","Bâton pour suspendre"],
steps:["Préparez l'animal le plus vite possible, loin de votre abri et de votre point d'eau.","Suspendez-le par les pattes arrière ou posez-le sur le dos sur une surface propre.","Pincez la peau du ventre, incisez-la légèrement sans percer la paroi abdominale, et ouvrez du bassin au sternum en glissant deux doigts sous la lame.","Retirez les viscères en évitant de percer la vessie et les intestins.","Examinez le foie : il doit être rouge foncé, lisse. Des taches blanches ou jaunes (signe possible de tularémie chez le lapin) : jetez l'animal entier.","Gardez cœur, foie et reins sains : ils sont très nutritifs.","Dépecez : incisez la peau autour des pattes, puis tirez la peau vers la tête comme un pull.","Rincez la viande à l'eau propre et cuisez-la entièrement."],
tips:["La peau peut servir d'isolant ou de petit sac ; les tendons séchés font un excellent fil.","Les viscères éloignés du camp peuvent servir d'appât pour la pêche."],
warn:["Ne consommez jamais un animal trouvé mort ou au comportement anormal.","Les lapins sont très maigres : en manger exclusivement mène à une carence (« famine du lapin ») ; complétez avec graisses et végétaux."]},

/* --- PÊCHE --- */
{id:"hamecons",cat:"peche",art:"hamecon",t:"Hameçons improvisés",diff:1,time:"15 min",
s:"Des hameçons fabriqués avec des épines, des os, du bois ou du métal récupéré.",
mat:["Épines dures (aubépine, prunellier)","Os ou bois dur","Épingle de sûreté, trombone, fil métallique, canette","Fil : fil de pêche, fil dentaire, fibres torsadées","Appât : vers, insectes, viscères"],
steps:["HAMEÇON ÉPINE : choisissez une branche avec une épine dure ; coupez la branche pour garder l'épine en crochet et attachez le fil à la branche.","HAMEÇON GORGE (le plus simple) : taillez un petit bâtonnet de bois ou d'os de 2–3 cm, pointu aux deux bouts, avec une rainure au milieu pour attacher le fil.","Insérez le bâtonnet dans l'appât, dans le sens de la ligne : le poisson l'avale et le bâtonnet se met en travers dans sa gorge.","MÉTAL : pliez une épingle de sûreté ou un fil métallique en J et affûtez la pointe sur une pierre.","Attachez fermement le fil (nœud de pêcheur ou plusieurs tours enduits de résine).","Lestez avec une petite pierre, ajoutez un flotteur en bois ou une plume pour voir les touches."],
tips:["Pêchez à l'aube et au crépuscule, dans les zones calmes, sous les rives creusées et près des obstacles.","Cherchez l'appât sur place : les poissons mangent ce qui vit déjà dans ce cours d'eau."],
warn:["Vérifiez la réglementation de la pêche ; en survie seulement, tout moyen devient acceptable."]},
{id:"ligne-fond",cat:"peche",art:"ligne",t:"Ligne dormante (ligne de fond)",diff:1,time:"20 min",
s:"Pêcher en continu pendant que vous faites autre chose : la base de la pêche de survie.",
mat:["Fil de pêche ou cordelette longue","Plusieurs hameçons (5 à 10)","Lests (pierres)","Piquet solide ou branche","Appâts"],
steps:["Coupez une ligne principale de plusieurs mètres.","Attachez des bas de ligne courts (30 cm) espacés d'au moins 60 cm, chacun avec un hameçon appâté.","Lestez l'extrémité avec une pierre.","Ancrez solidement l'autre extrémité à un piquet ou une branche flexible sur la berge (la branche qui bouge signale une touche).","Lancez ou posez la ligne en travers d'un courant lent ou dans une zone profonde.","Vérifiez et réappâtez toutes les quelques heures, et au minimum matin et soir."],
tips:["Une ligne posée la nuit est souvent plus productive (anguilles, poissons-chats).","Variez profondeurs et appâts pour comprendre ce qui fonctionne."],
warn:["Retirez toutes les lignes en partant : elles piègent oiseaux et animaux."]},
{id:"nasse",cat:"peche",art:"nasse",t:"Nasse & piège à poissons",diff:2,time:"1 à 3 h",
s:"Un entonnoir dans lequel le poisson entre facilement mais ne trouve pas la sortie.",
mat:["Bouteille plastique de grande taille","Ou branches souples (saule, noisetier) et cordage","Pierres pour un barrage (version rivière)","Appât"],
steps:["VERSION BOUTEILLE : coupez le haut d'une bouteille au niveau de l'épaule ; retournez-le et insérez-le dans le corps de la bouteille, goulot vers l'intérieur.","Fixez-le avec des liens ou des épines, percez quelques trous pour que la bouteille coule.","Appâtez, lestez et placez dans une eau calme ; relevez régulièrement.","VERSION BRANCHES : formez deux cercles de branches souples (un grand, un petit) et liez des baguettes droites entre eux pour faire un cône allongé.","Fabriquez un entonnoir intérieur plus petit, pointe vers l'intérieur, et fermez l'arrière.","VERSION BARRAGE : sur une rivière peu profonde, construisez avec des pierres un enclos en forme de V ou de cœur, pointe vers l'aval, avec une étroite entrée. Les poissons y entrent et peinent à ressortir."],
tips:["Placez les nasses à l'entrée d'une zone calme, entrée orientée vers l'aval.","Rabattez les poissons vers le barrage en marchant dans l'eau depuis l'amont."],
warn:["Ces techniques sont généralement interdites hors situation de survie."]},

/* --- OUTILS --- */
{id:"cordage",cat:"outils",art:"cordage",t:"Cordage naturel",diff:2,time:"1 h et plus",
s:"Fabriquer de la corde solide à partir de fibres végétales par la technique de la « torsion inversée ».",
mat:["Fibres : ortie (tiges sèches), écorce interne de tilleul ou de saule, racines fines d'épicéa, herbes longues, massette","Eau pour assouplir"],
steps:["Récoltez les fibres. Pour l'ortie : écrasez les tiges, ouvrez-les et retirez l'écorce fibreuse extérieure du cœur ligneux.","Pour le tilleul : faites tremper l'écorce plusieurs jours dans l'eau pour séparer les fibres internes (rouissage).","Prenez un faisceau de fibres et pliez-le en deux, non au centre mais aux 2/3 (pour décaler les raccords).","Pincez le pli entre le pouce et l'index de la main gauche.","Avec la main droite, tordez le brin du haut vers vous (dans le sens horaire), puis passez-le par-dessus l'autre brin (sens antihoraire).","Répétez : chaque brin est tordu dans un sens puis croisé dans l'autre. Cette opposition empêche la corde de se défaire.","Pour allonger, ajoutez de nouvelles fibres au brin le plus court en les superposant sur quelques centimètres.","Pour une corde plus solide, tressez ensemble deux ou trois cordelettes obtenues."],
tips:["Maintenez les fibres légèrement humides : elles sont plus souples et la torsion est plus serrée.","Les tendons séchés d'animaux donnent un fil d'une solidité remarquable."],
warn:["Les orties piquent fraîches : manipulez avec des gants ou retournez la tige dans le sens des poils."]},
{id:"lame-pierre",cat:"outils",art:"pierre",t:"Lame en pierre taillée",diff:3,time:"30 min à 2 h",
s:"Obtenir une lame tranchante si vous avez perdu votre couteau, à partir de silex, d'obsidienne ou de quartzite.",
mat:["Roche à grain fin et cassure conchoïdale (silex, chaille, obsidienne, quartzite)","Percuteur : galet dur et rond","Bois de cervidé ou os (facultatif, pour affiner)","Protection des yeux, tissu ou cuir pour les mains"],
steps:["Identifiez une bonne pierre : en la cassant, elle doit former une surface lisse et en coquille, avec des bords tranchants.","Protégez vos yeux et posez le bloc (nucléus) sur votre cuisse protégée par du cuir ou un vêtement épais.","Frappez un bord du bloc avec le galet, d'un coup sec à angle aigu (environ 70° par rapport à la surface de frappe), en suivant le coup.","Un éclat se détache : il est déjà extrêmement tranchant et suffit pour couper viande, cordes et peau.","Pour retoucher le tranchant, pressez par petits coups avec un os ou un bois de cerf le long du bord (retouche par pression).","Émoussez la partie que vous tiendrez en main, ou enveloppez-la de cuir ou de tissu en guise de manche."],
tips:["Même sans technique, casser un silex contre un rocher donne des éclats utilisables.","Une lame de verre (bouteille) se travaille de la même façon."],
warn:["Les éclats sont plus tranchants qu'un scalpel : portez des protections et travaillez loin des autres.","Les fragments projetés peuvent blesser les yeux."]},
{id:"recipient-ecorce",cat:"outils",art:"ecorce",t:"Récipient en écorce de bouleau",diff:2,time:"30 min",
s:"Un récipient étanche capable de transporter de l'eau et même de la faire bouillir sur les braises.",
mat:["Feuille d'écorce de bouleau (prélevée sur un arbre mort ou abattu)","Couteau","Bâtonnets fendus pour pinces","Cordage ou racines"],
steps:["Prélevez l'écorce sur un arbre mort ou abattu : incisez verticalement et décollez-la en un grand rectangle.","Chauffez légèrement l'écorce au-dessus du feu pour l'assouplir.","Côté blanc à l'extérieur, repliez les quatre bords pour former une boîte, en pinçant les coins en triangle vers les côtés.","Maintenez les plis avec des bâtonnets fendus utilisés comme pinces à linge, ligaturés.","Pour faire bouillir : remplissez d'eau et posez sur des braises (pas sur des flammes). Tant qu'elle contient de l'eau, l'écorce ne brûle pas sous la ligne d'eau.","Alternative : utilisez la technique des pierres chaudes plongées dans l'eau."],
tips:["Le même pliage fonctionne avec une feuille d'aluminium, une bâche ou un sac plastique (sans chauffer le plastique).","L'écorce de bouleau est aussi le meilleur allume-feu naturel : gardez-en toujours."],
warn:["Ne décollez jamais l'écorce d'un arbre vivant tout autour du tronc : l'arbre meurt."]},

/* --- ORIENTATION --- */
{id:"baton-ombre",cat:"orientation",art:"ombre",t:"Méthode du bâton et de l'ombre",diff:1,time:"15 à 30 min",
s:"La méthode militaire la plus fiable pour trouver l'axe est-ouest avec le soleil, partout dans le monde.",
mat:["Bâton droit d'environ 1 m","2 petits cailloux","Sol plat et ensoleillé"],
steps:["Plantez le bâton bien droit dans un sol plat.","Marquez avec un caillou l'extrémité de l'ombre : c'est votre premier point, il indique l'OUEST.","Attendez 15 à 20 minutes : l'ombre se déplace.","Marquez la nouvelle extrémité de l'ombre avec un second caillou : c'est l'EST.","Tracez une ligne entre les deux cailloux : c'est l'axe ouest–est.","Placez-vous le pied gauche sur le premier caillou et le pied droit sur le second : vous faites face au NORD (dans les deux hémisphères).","Une perpendiculaire à cette ligne donne l'axe nord–sud."],
tips:["Plus l'attente est longue, plus la précision est bonne.","Fonctionne aussi avec la lune lorsqu'elle projette une ombre nette."],
warn:["Peu précise près des pôles et autour de midi aux latitudes tropicales."]},
{id:"etoile-polaire",cat:"orientation",art:"polaire",t:"Trouver le nord avec les étoiles",diff:1,time:"5 min",
s:"L'Étoile polaire (hémisphère nord) et la Croix du Sud (hémisphère sud) indiquent les pôles.",
mat:["Ciel dégagé","Un bâton pour marquer la direction"],
steps:["HÉMISPHÈRE NORD : repérez la Grande Ourse (la « Grande Casserole »), 7 étoiles brillantes.","Prenez les deux étoiles qui forment le bord avant de la « casserole » (côté opposé au manche).","Prolongez la ligne qui les relie d'environ 5 fois leur écartement, vers le haut de la casserole.","Vous tombez sur l'Étoile polaire, isolée et moyennement brillante : elle indique le nord à moins d'un degré près.","Alternative : Cassiopée (le « W ») se trouve de l'autre côté de la Polaire par rapport à la Grande Ourse.","HÉMISPHÈRE SUD : repérez la Croix du Sud ; prolongez son grand axe d'environ 4,5 fois sa longueur. Le point obtenu est au-dessus du sud : descendez verticalement jusqu'à l'horizon.","Plantez deux bâtons alignés sur la direction trouvée pour la retrouver au matin."],
tips:["L'Étoile polaire est à une hauteur au-dessus de l'horizon égale à votre latitude.","Elle n'est pas la plus brillante du ciel, contrairement à une idée reçue."],
warn:["Ne confondez pas la Croix du Sud avec la « fausse croix » voisine, plus grande et sans les étoiles pointeuses."]},
{id:"montre",cat:"orientation",art:"montre",t:"Trouver le sud avec une montre",diff:1,time:"2 min",
s:"Une montre à aiguilles (ou un cadran dessiné) et le soleil suffisent pour une orientation approximative.",
mat:["Montre à aiguilles, ou un cercle dessiné au sol avec l'heure","Soleil visible"],
steps:["Réglez la montre à l'heure solaire : en heure d'été, utilisez 13 h comme repère au lieu de 12 h (en Europe, retirez une heure supplémentaire en hiver selon votre fuseau).","HÉMISPHÈRE NORD : tenez la montre à plat et pointez la petite aiguille vers le soleil.","La bissectrice de l'angle entre la petite aiguille et le 12 indique le SUD.","HÉMISPHÈRE SUD : pointez le 12 vers le soleil ; la bissectrice entre le 12 et la petite aiguille indique le NORD.","Avec une montre digitale, dessinez un cadran au sol avec l'heure affichée et procédez de la même façon."],
tips:["Placez un brin d'herbe debout au bord de la montre : alignez son ombre sur l'aiguille pour viser précisément le soleil."],
warn:["Méthode approximative (jusqu'à 20–25° d'erreur), surtout en été et aux latitudes basses. Vérifiez avec la méthode du bâton et de l'ombre."]},

/* --- SECOURS --- */
{id:"hemorragie",cat:"secours",art:"garrot",t:"Arrêter une hémorragie (garrot)",diff:2,time:"Immédiat",
s:"Une hémorragie grave peut tuer en quelques minutes. Gestes issus des protocoles de secourisme au combat.",
mat:["Compresses, tissu propre","Bande ou tissu large (≥ 4 cm) pour un garrot","Bâton solide (tourniquet)","Marqueur ou charbon pour noter l'heure"],
steps:["Protégez-vous (gants, sac plastique) et allongez la victime.","COMPRESSION DIRECTE : appuyez fort et en continu avec la main ou un tissu sur la plaie. C'est le geste prioritaire pour la majorité des plaies.","Si le saignement continue, ajoutez d'autres tissus par-dessus sans retirer les premiers, et faites un pansement compressif serré.","GARROT (membre seulement, si la compression ne suffit pas ou est impossible) : placez une bande large de 5 à 8 cm au-dessus de la plaie, entre la plaie et le cœur, jamais sur une articulation.","Faites un nœud, placez un bâton sur le nœud, refaites un nœud par-dessus.","Tournez le bâton jusqu'à l'arrêt complet du saignement, puis fixez le bâton pour qu'il ne se déroule pas.","Notez l'heure de pose sur le front ou sur le garrot. Ne desserrez jamais un garrot vous-même.","Couvrez la victime pour éviter l'hypothermie, surveillez sa conscience et organisez l'évacuation d'urgence."],
tips:["Un garrot posé correctement fait mal : c'est normal.","Une fine ficelle ou un fil ne doivent jamais servir de garrot : ils coupent les tissus."],
warn:["Appelez le 112 dès que possible. Un garrot est une mesure d'urgence vitale qui nécessite une prise en charge médicale rapide.","Suivez une formation aux premiers secours : rien ne remplace la pratique encadrée."]},
{id:"attelle",cat:"secours",art:"attelle",t:"Attelle improvisée",diff:1,time:"15 min",
s:"Immobiliser une fracture ou une entorse pour limiter la douleur et permettre l'évacuation.",
mat:["2 bâtons droits, bâtons de marche, planchettes ou carton épais","Rembourrage : vêtements, mousse, herbe","Liens : bandes, foulards, lacets, ceinture"],
steps:["Ne réalignez pas une fracture déformée : immobilisez-la dans la position où vous la trouvez, sauf absence de pouls en dessous (et seulement si vous êtes formé).","Vérifiez la circulation sous la blessure : couleur, chaleur, sensibilité.","Choisissez des supports assez longs pour bloquer l'articulation au-dessus ET au-dessous de la fracture.","Rembourrez les supports, surtout au niveau des os saillants (cheville, genou, poignet).","Placez un support de chaque côté du membre.","Attachez avec 3 à 4 liens au-dessus et au-dessous de la blessure, jamais directement sur la fracture. Nœuds du côté des supports.","Revérifiez la circulation : si les doigts ou orteils deviennent froids, bleus ou insensibles, desserrez.","Pour un bras, complétez avec une écharpe (triangle de tissu) ; une jambe peut aussi être attachée à l'autre jambe."],
tips:["Un tapis de sol roulé fait une excellente attelle pour une jambe.","Surélevez le membre et appliquez du froid (eau, neige dans un tissu) pour limiter le gonflement."],
warn:["Suspicion de fracture du dos ou du cou : ne bougez pas la victime sauf danger immédiat ; appelez les secours."]},
{id:"hypothermie",cat:"secours",art:"hypo",t:"Hypothermie : reconnaître et réchauffer",diff:2,time:"Immédiat",
s:"Première cause de décès en milieu naturel, même par 5 à 10 °C avec du vent et de la pluie.",
mat:["Vêtements secs","Couverture de survie, sac de couchage","Isolant de sol","Boissons chaudes et sucrées","Bouteilles d'eau chaude"],
steps:["Reconnaissez les signes : frissons intenses, mains maladroites, confusion, discours pâteux, comportement inhabituel (les « umbles » : il trébuche, marmonne, tâtonne). Si les frissons s'arrêtent alors qu'il fait toujours froid, c'est grave.","Mettez immédiatement la personne à l'abri du vent et de l'humidité.","Isolez-la du sol avant tout : le sol froid vole la chaleur par conduction.","Retirez les vêtements mouillés et remplacez-les par des vêtements secs ; couvrez la tête et le cou.","Enveloppez-la dans un sac de couchage et une couverture de survie (plusieurs couches).","Placez des bouteilles d'eau chaude (enveloppées) aux aisselles, à l'aine et sur le thorax.","Si elle est consciente et peut avaler, donnez des boissons chaudes et sucrées et un peu de nourriture.","Partage de chaleur : une personne saine peut se glisser dans le sac de couchage avec la victime."],
tips:["Prévention : rester sec, superposer les couches, manger et boire régulièrement.","« Coton = mort » en climat froid et humide : préférez laine et synthétique."],
warn:["Ne frictionnez pas les membres, ne donnez pas d'alcool : cela aggrave la perte de chaleur.","Hypothermie sévère (inconscience, pas de frissons) : manipulez très doucement et évacuez en urgence ; appelez le 112."]},
{id:"brulures",cat:"secours",art:"brulure",t:"Soigner une brûlure",diff:1,time:"20 min et plus",
s:"Les brûlures sont fréquentes autour d'un feu de camp. Les bons réflexes limitent les séquelles.",
mat:["Eau tempérée propre (15 à 25 °C)","Pansement propre non adhésif, film alimentaire","Tissu propre"],
steps:["Éloignez la victime de la source de chaleur. Si les vêtements brûlent : « Stop, tombe et roule ».","Refroidissez immédiatement la brûlure à l'eau tempérée pendant 20 minutes.","Retirez bagues, montres et vêtements autour de la zone (sauf s'ils collent à la peau).","Ne percez pas les cloques.","Couvrez légèrement avec un pansement propre non adhésif ou du film alimentaire, sans serrer.","Faites boire la victime (risque de déshydratation pour les brûlures étendues).","Surveillez les signes d'infection les jours suivants : rougeur qui s'étend, pus, fièvre."],
tips:["En pleine nature, l'eau d'un ruisseau peut servir pour refroidir même si elle n'est pas potable ; nettoyez ensuite avec de l'eau purifiée."],
warn:["Pas de beurre, d'huile, de dentifrice ni de glace directement sur la peau.","Brûlure plus grande que la paume de la victime, sur le visage, les mains, les organes génitaux, ou brûlure profonde (blanche, cartonnée, insensible) : évacuation et secours d'urgence (112)."]},

/* --- SIGNALISATION --- */
{id:"signaux-sol",cat:"signal",art:"signaux",t:"Signaux au sol (codes air–sol)",diff:1,time:"30 à 60 min",
s:"Des symboles géants, visibles depuis un avion ou un hélicoptère, reconnus internationalement.",
mat:["Pierres, branches, troncs, vêtements colorés","Ou tranchées creusées dans la neige ou le sable"],
steps:["Choisissez un espace dégagé et visible du ciel : clairière, plage, crête, champ de neige.","Construisez des symboles d'au moins 3 m de long (idéalement 6 m) avec un fort contraste de couleur avec le sol.","SOS : appel à l'aide universel.","V : « J'ai besoin d'assistance ».","X : « J'ai besoin d'assistance médicale ».","Flèche → : « Je pars dans cette direction ».","N : « Non » ; Y : « Oui ».","Dans la neige, piétinez les lettres puis remplissez-les de branches de conifère sombres ; utilisez l'ombre en creusant des tranchées orientées est–ouest.","Les formes géométriques à angles droits n'existent pas dans la nature : elles attirent l'œil."],
tips:["Si vous quittez le site, laissez une flèche et un message indiquant votre direction et l'heure.","Un mouvement attire l'attention : agitez un vêtement coloré quand un avion passe."],
warn:["Ne démontez pas vos signaux une fois secouru sans prévenir : d'autres équipes pourraient les chercher."]},
{id:"miroir",cat:"signal",art:"miroir",t:"Miroir de signalisation",diff:1,time:"Immédiat",
s:"Un éclat de miroir peut être vu à plusieurs dizaines de kilomètres par temps clair. Le meilleur signal de jour.",
mat:["Miroir de signalisation, ou tout objet brillant : CD, téléphone éteint, couvercle de boîte, couverture de survie, boucle de ceinture polie"],
steps:["Tenez le miroir près de votre œil, face réfléchissante vers l'avant.","Tendez l'autre bras et formez un V avec l'index et le majeur, en visant la cible (avion, bateau, crête) à travers ce V.","Inclinez le miroir jusqu'à voir la tache de lumière sur vos doigts.","Faites passer la tache de lumière d'un doigt à l'autre à travers le V : le reflet balaie ainsi la cible.","Pour un miroir à viseur : regardez à travers le trou et faites coïncider le point lumineux avec la cible.","Balayez l'horizon régulièrement, même sans cible visible : un pilote peut vous voir avant que vous le voyiez.","Arrêtez de flasher un aéronef dès qu'il a manifesté qu'il vous a vu (battement d'ailes, changement de cap) pour ne pas éblouir le pilote."],
tips:["Trois éclats répétés signalent une détresse.","Ça fonctionne aussi sous un ciel légèrement voilé."],
warn:["Ne visez jamais longtemps le cockpit d'un aéronef en approche."]},
{id:"feux-signal",cat:"signal",art:"feuxsig",t:"Feux et fumée de signalisation",diff:2,time:"1 h de préparation",
s:"Trois feux en triangle sont un signal de détresse international. La fumée se voit de très loin le jour.",
mat:["Bois sec en quantité","Végétation verte (fumée blanche)","Caoutchouc, huile ou plastique (fumée noire, dernier recours)","Espace dégagé"],
steps:["Préparez 3 foyers en triangle (ou en ligne) espacés d'environ 30 m, dans un lieu dégagé et visible.","Construisez chaque foyer à l'avance, prêt à être allumé en quelques secondes (amadou protégé de la pluie sous écorce ou bâche).","Gardez un feu principal allumé en permanence pour pouvoir enflammer rapidement les autres.","Allumez dès que vous entendez un moteur d'avion ou voyez des secours.","DE JOUR : ajoutez de la végétation verte ou humide pour une fumée blanche, visible sur un fond sombre (forêt).","Sur la neige ou un fond clair, une fumée noire (caoutchouc, huile) est plus visible.","DE NUIT : privilégiez des flammes vives et hautes ; le bouleau et les branches de conifère sèches s'embrasent vite."],
tips:["Un arbre résineux isolé et sec peut servir de « torche » géante, à n'enflammer qu'avec une extrême prudence et loin de la forêt.","Le signal sonore de détresse est 3 coups (sifflet) répétés ; 6 coups par minute selon la convention alpine."],
warn:["Risque majeur d'incendie de forêt : dégagez les foyers jusqu'au sol minéral, surveillez-les en permanence et tenez compte du vent."]}
];
