/* ===== Design tokens ===== */
:root{
  --bg:#0e110d; --bg2:#12160f; --s1:#171c14; --s2:#1e2519; --s3:#27301f;
  --line:rgba(226,214,178,.09); --line2:rgba(226,214,178,.17);
  --txt:#eeebe1; --txt2:#b9b4a2; --mut:#8a8673;
  --kh:#d6c795; --kh2:#8d8463; --acc:#ff7b30; --acc2:#ffae6d; --accbg:rgba(255,123,48,.13);
  --red:#ff5b4c; --redbg:rgba(255,91,76,.12); --ok:#93c463; --okbg:rgba(147,196,99,.13); --water:#74b6d8; --waterbg:rgba(116,182,216,.13); --gold:#e8b94a;
  --glass:rgba(14,17,13,.78); --shadow:0 12px 32px rgba(0,0,0,.38); --shadow2:0 2px 10px rgba(0,0,0,.25);
  --r:18px; --r2:24px; --panel:var(--s1); --panel2:var(--s2);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
body.sable{
  --bg:#f1ece0; --bg2:#ebe5d6; --s1:#fbf9f3; --s2:#efe9da; --s3:#e4dcc7;
  --line:rgba(50,48,30,.1); --line2:rgba(50,48,30,.2);
  --txt:#1f2117; --txt2:#4b4b3a; --mut:#76735f; --kh:#4b4a2c; --kh2:#8f8664;
  --acc:#d4570f; --acc2:#e8873f; --accbg:rgba(212,87,15,.1); --red:#c8382a; --redbg:rgba(200,56,42,.08); --ok:#4b7a28; --okbg:rgba(75,122,40,.1); --water:#2a78a3; --waterbg:rgba(42,120,163,.1); --gold:#a8770e;
  --glass:rgba(251,249,243,.85); --shadow:0 12px 30px rgba(70,60,30,.12); --shadow2:0 2px 8px rgba(70,60,30,.08);
}
body.night{
  --bg:#080101; --bg2:#0e0202; --s1:#140303; --s2:#1c0505; --s3:#260707;
  --line:rgba(255,60,40,.12); --line2:rgba(255,60,40,.24);
  --txt:#f0574a; --txt2:#c8463a; --mut:#9a3428; --kh:#d23b2a; --kh2:#8a2418;
  --acc:#ff4a33; --acc2:#ff6a55; --accbg:rgba(255,74,51,.12); --red:#ff4a33; --redbg:rgba(255,74,51,.1); --ok:#d23b2a; --okbg:rgba(210,59,42,.1); --water:#b8382a; --waterbg:rgba(184,56,42,.1); --gold:#d23b2a; --glass:rgba(8,1,1,.85);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(96px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.fs1 #app,body.fs1 #guide{zoom:1.1} body.fs2 #app,body.fs2 #guide{zoom:1.22}

/* ===== App bar ===== */
.appbar{position:sticky;top:0;z-index:30;padding:calc(8px + var(--safe-t)) 12px 8px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--line)}
.appbar .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:6px;min-height:44px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.brand svg{width:30px;height:30px}
.brand b{font:400 19px/1 Impact,"Arial Narrow Bold","Haettenschweiler",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--kh)} .brand b em{font-style:normal;color:var(--acc)}
.bartitle{flex:1;min-width:0;font-weight:750;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;border:0;background:transparent;cursor:pointer;color:var(--txt2)}
.ib:active{background:var(--s2)} .ib.on{color:var(--acc)}
.ib.solid{background:var(--s1);border:1px solid var(--line)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 10px}

/* ===== Bottom nav ===== */
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--safe-b));z-index:40;display:flex;padding:6px;border-radius:26px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line2);box-shadow:var(--shadow);width:min(500px,calc(100% - 20px))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:20px;text-decoration:none;color:var(--mut);font-size:10.5px;font-weight:650;letter-spacing:.01em;transition:color .2s,background .2s}
.bnav a.on{color:var(--acc);background:var(--accbg)}
.bnav a.sos{color:var(--red)} .bnav a.sos .dotc{width:44px;height:44px;margin:-14px 0 -3px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;box-shadow:0 6px 18px rgba(255,91,76,.45);border:3px solid var(--bg)}
body.night .bnav a.sos .dotc{color:#080101}
.bnav a.sos.on{background:transparent}

/* ===== Typography & layout ===== */
.h1{font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.025em;margin:0}
.h2{font-size:21px;line-height:1.15;font-weight:780;letter-spacing:-.02em;margin:0}
.lead{color:var(--txt2);font-size:15px;margin:6px 0 0}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.shd{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 12px}
.shd h3{margin:0;font-size:17px;font-weight:760;letter-spacing:-.01em}
.shd a,.shd button{color:var(--acc);font-size:13.5px;text-decoration:none;font-weight:650;background:none;border:0;cursor:pointer;padding:0}
.muted{color:var(--mut)} .small{font-size:13px}

@media(min-width:760px){.grid2.wide{grid-template-columns:repeat(4,1fr)}.list{grid-template-columns:1fr 1fr!important}.h1{font-size:34px}}
@media(min-width:1040px){.list{grid-template-columns:1fr 1fr 1fr!important}}
.fade{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== Surfaces ===== */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card h4{margin:0 0 12px;font-size:15.5px;font-weight:720;display:flex;align-items:center;gap:9px}
.card h4 .r{margin-left:auto;font-size:12.5px;color:var(--mut);font-weight:600}
.card h4 svg.i{width:19px;height:19px;color:var(--acc)}
.card.warn{background:linear-gradient(var(--redbg),var(--redbg)),var(--s1);border-color:rgba(255,91,76,.28)} .card.warn h4,.card.warn h4 svg.i{color:var(--red)}
.card.tip h4,.card.tip h4 svg.i{color:var(--gold)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-size:13.5px;color:var(--txt2);margin:12px 0}
.note svg.i{width:18px;height:18px;margin-top:1px;color:var(--acc)}
.note.red{background:var(--redbg);border-color:rgba(255,91,76,.25)} .note.red svg.i{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--s2);color:var(--txt2);font-weight:650;white-space:nowrap}
.chip.d1{color:var(--ok);background:var(--okbg)} .chip.d2{color:var(--acc);background:var(--accbg)} .chip.d3{color:var(--red);background:var(--redbg)}
.chip svg.i{width:13px;height:13px}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 18px;border-radius:15px;border:0;cursor:pointer;font-weight:720;font-size:15px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);color:#fff;box-shadow:0 8px 20px rgba(255,123,48,.25)} body.night .btn.pri{color:#080101}
.btn.sec{background:var(--s1);border:1px solid var(--line2);color:var(--txt)}
.btn.red{background:var(--red);color:#fff} .btn.block{width:100%}
.btn svg.i{width:19px;height:19px}
.row2{display:flex;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(104px + var(--safe-b));transform:translateX(-50%) translateY(16px);opacity:0;background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:650;z-index:90;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ===== Search field ===== */
.search{position:relative;display:flex;align-items:center}
.search svg.i{position:absolute;left:14px;width:19px;height:19px;color:var(--mut)}
.search input{width:100%;height:50px;border-radius:16px;border:1px solid var(--line2);background:var(--s1);padding:0 44px;font-size:16px;outline:none;transition:.2s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--accbg)}
.search .clr{position:absolute;right:6px;width:38px;height:38px;border:0;background:none;color:var(--mut);cursor:pointer;display:none;place-items:center}
.search.has .clr{display:grid}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.fakesearch{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:16px;border:1px solid var(--line2);background:var(--s1);color:var(--mut);cursor:pointer;width:100%;text-align:left;font-size:15px}

/* ===== Home ===== */
.hello{margin:4px 2px 14px}
.hello .h1 span{color:var(--acc)}
.score{display:flex;gap:16px;align-items:center;padding:16px;border-radius:var(--r2);background:linear-gradient(140deg,var(--s2),var(--s1));border:1px solid var(--line);cursor:pointer;width:100%;text-align:left;margin-top:14px}
.ring{--p:0;--c:var(--ok);width:78px;height:78px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;background:radial-gradient(closest-side,var(--s1) 79%,transparent 81% 100%),conic-gradient(var(--c) calc(var(--p)*1%),var(--s3) 0)}
.score h3{margin:0;font-size:16px;font-weight:750} .score p{margin:3px 0 8px;color:var(--mut);font-size:13px}
.ticks{display:flex;flex-wrap:wrap;gap:6px}
.tick{font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:999px;background:var(--s3);color:var(--mut)} .tick.ok{background:var(--okbg);color:var(--ok)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px 12px;border-radius:18px;border:1px solid var(--line);background:var(--s1);cursor:pointer;font-size:11.5px;font-weight:650;text-align:center;line-height:1.2;color:var(--txt)}
.qa .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.qa.red .ico{background:var(--redbg);color:var(--red)}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:none;width:168px;scroll-snap-align:start;border-radius:16px;border:1px solid var(--line);background:var(--s1);overflow:hidden;cursor:pointer;text-align:left;padding:0}
.mini .pic{background:var(--s2)} .mini .pic svg,.mini .pic img{display:block;width:100%;aspect-ratio:5/3;object-fit:cover}
.mini .t{padding:9px 11px 11px;font-size:13.5px;font-weight:650;line-height:1.3}
.mini .t small{display:block;color:var(--mut);font-weight:550;font-size:11.5px;margin-bottom:2px}
.feature{display:flex;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer;padding:12px;border-radius:var(--r2);border:1px solid var(--line);background:var(--s1)}
.feature .pic{width:120px;flex:none;border-radius:14px;overflow:hidden;background:var(--s2)} .feature .pic svg,.feature .pic img{display:block;width:100%;aspect-ratio:5/3;object-fit:cover}
.feature h4{margin:3px 0 4px;font-size:16px;font-weight:720} .feature p{margin:0;color:var(--mut);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===== Category tiles ===== */
.cat{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:112px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--s1);cursor:pointer;text-align:left;overflow:hidden;transition:border-color .15s,transform .15s}
.cat:active{transform:scale(.98)} .cat:hover{border-color:var(--line2)}
.cat .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.cat b{display:block;font-size:15px;font-weight:720;line-height:1.2} .cat small{color:var(--mut);font-size:12.5px}
.cat .ghost{position:absolute;right:-10px;bottom:-14px;width:112px;opacity:.13;pointer-events:none}
.catrow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer;padding:13px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--s1)}
.catrow .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.catrow b{display:block;font-size:15.5px;font-weight:720} .catrow small{display:block;color:var(--mut);font-size:13px;line-height:1.35;margin-top:1px}
.catrow .n{margin-left:auto;font-size:12.5px;color:var(--mut);font-weight:650;display:flex;align-items:center;gap:2px}
.catrow .n svg.i{width:17px;height:17px}

/* ===== Page head ===== */
.phead{display:flex;gap:14px;align-items:center;margin:2px 0 14px}
.phead .ico{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;flex:none}
.phead .ico svg.i{width:26px;height:26px}
.phead p{margin:3px 0 0;color:var(--mut);font-size:13.5px;line-height:1.4}

/* ===== Filters & lists ===== */
.filters{position:sticky;top:calc(61px + var(--safe-t));z-index:20;background:var(--bg);margin:0 -16px;padding:6px 16px 10px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line2);background:var(--s1);color:var(--txt2);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.fchip.on{background:var(--txt);border-color:var(--txt);color:var(--bg)}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:10px;font-size:13px;font-weight:650;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--s3);color:var(--txt);box-shadow:var(--shadow2)}
.count{margin:14px 2px 8px;color:var(--mut);font-size:13px}
.list{display:grid;grid-template-columns:1fr;gap:10px}
.item{display:flex;gap:12px;align-items:stretch;border-radius:var(--r);border:1px solid var(--line);background:var(--s1);padding:10px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s}
.item:hover{border-color:var(--line2)}
.item .pic{width:108px;flex:none;border-radius:13px;overflow:hidden;background:var(--s2);align-self:center} .item .pic svg,.item .pic img{display:block;width:100%;aspect-ratio:5/3;object-fit:cover}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.item .k{font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.item h4{margin:2px 0 3px;font-size:15px;font-weight:700;line-height:1.25}
.item p{margin:0;color:var(--mut);font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .mt{display:flex;gap:6px;margin-top:auto;padding-top:7px;flex-wrap:wrap}
.item .mt .chip{font-size:11px;padding:2px 8px}
.item .fv{align-self:flex-start;border:0;background:none;color:var(--mut);cursor:pointer;padding:2px;display:grid}
.item .fv.on,.btn.sec.on{color:var(--gold)} [data-fav].on svg path{fill:currentColor}
.empty{text-align:center;color:var(--mut);padding:44px 20px}
.empty svg.i{width:40px;height:40px;margin-bottom:8px;color:var(--kh2)}

/* ===== Detail ===== */
.dwrap{max-width:780px;margin:0 auto}
.hero{border-radius:var(--r2);overflow:hidden;background:var(--s2);border:1px solid var(--line)}
.hero svg,.hero img{display:block;width:100%;max-height:360px;object-fit:cover}
.dt{margin:16px 0 6px} .dt .h1{font-size:27px} .dt .en{color:var(--mut);font-size:13.5px;font-style:italic;margin-top:3px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.cta{display:flex;gap:10px;margin:16px 0 4px} .cta .btn.pri{flex:1}
.example{margin:14px 0;border-radius:var(--r);padding:16px;background:linear-gradient(135deg,var(--okbg),var(--s1));border:1px solid rgba(147,196,99,.28)}
.example .eyebrow{color:var(--ok)} .example h4{margin:5px 0 6px;font-size:16px;font-weight:720} .example p{margin:0;font-size:14.5px;color:var(--txt2)}
.mat{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mat label{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg2);cursor:pointer;font-size:14.5px;transition:background .15s}
.mat input{accent-color:var(--ok);width:19px;height:19px;margin-top:1px;flex:none}
.mat input:checked+span{color:var(--mut)} .mat li:has(input:checked) label{background:var(--okbg)}
.sub{display:block;color:var(--mut);font-size:12.5px}
.pbar{height:6px;border-radius:9px;background:var(--s3);overflow:hidden;margin:-4px 0 6px}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:13px;padding:13px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5;cursor:pointer}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:10px;background:var(--s3);color:var(--txt);display:grid;place-items:center;font-weight:800;font-size:13px;transition:.2s}
.steps li.done{color:var(--mut)} .steps li.done::before{content:"✓";background:var(--ok);color:var(--bg)}
.steps.plain li{cursor:default}
.bul{margin:0;padding-left:18px} .bul li{margin:7px 0;font-size:14.5px;color:var(--txt2)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.pn button{border:1px solid var(--line);background:var(--s1);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;font-size:14px;font-weight:650;line-height:1.3}
.pn button:last-child{text-align:right} .pn small{display:block;color:var(--mut);font-weight:550;font-size:12px;margin-bottom:2px}
.src{font-size:12.5px;color:var(--mut);margin:12px 2px 6px;line-height:1.5}

/* ===== Guided mode ===== */
.overlay{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + var(--safe-t)) 18px calc(18px + var(--safe-b));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.overlay.open{transform:none}
.gtop{display:flex;align-items:center;gap:10px} .gtop .t{flex:1;font-weight:700;font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gprog{display:flex;gap:4px;margin:14px 0 6px} .gprog i{flex:1;height:4px;border-radius:4px;background:var(--s3);transition:.3s} .gprog i.on{background:var(--acc)}
.gbody{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:680px;width:100%;margin:0 auto;overflow-y:auto}
.gart{border-radius:20px;overflow:hidden;background:var(--s2);max-width:340px;width:72%;margin:0 auto 24px} .gart svg,.gart img{display:block;width:100%}
.gnum{font-size:12.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.gtext{font-size:clamp(20px,5.4vw,27px);line-height:1.38;margin:10px 0 0;font-weight:650;letter-spacing:-.01em}
.gfoot{display:flex;gap:10px;max-width:680px;width:100%;margin:16px auto 0} .gfoot .btn{flex:1} .gfoot .btn.sec{flex:0 0 120px}
.gdone{text-align:center} .gdone svg.i{width:64px;height:64px;color:var(--ok)}

/* ===== Forms ===== */
.fld{display:block;margin:10px 0} .fld>span{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px;font-weight:650}
.fld input,.fld textarea,.fld select,.numrow input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px;font-size:15.5px;outline:none}
.fld input:focus,.fld textarea:focus,.fld select:focus,.numrow input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px} .two .fld{margin:0}
.numrow{display:grid;grid-template-columns:1fr 1fr 42px;gap:8px;margin:8px 0}
.del{border:0;background:var(--redbg);color:var(--red);border-radius:11px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center}
.del svg.i{width:17px;height:17px}
.add{width:100%;margin-top:8px;border:1.5px dashed var(--line2);background:none;color:var(--acc);border-radius:14px;padding:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.add svg.i{width:18px;height:18px}
.sub-card{padding:12px 14px;border-radius:14px;background:var(--bg2);margin-bottom:10px}
.sub-card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.kv{list-style:none;margin:0;padding:0}
.kv li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv li:first-child{border-top:0} .kv li>span{color:var(--txt2)} .kv li>b{text-align:right;font-weight:700}
.kv.stack li{flex-direction:column;gap:2px} .kv.stack li>b{text-align:left;font-weight:600} .kv.stack li>span{font-size:12.5px;color:var(--mut)}
.na{color:var(--mut);font-weight:500;font-style:italic}
.tel{color:var(--acc);text-decoration:none;font-weight:800}
.pill{border:1px solid var(--line2);background:var(--s1);color:var(--txt);padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--ok);border-color:var(--ok);color:var(--bg)} .pill svg.i{width:16px;height:16px}
.tgl{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14.5px;cursor:pointer} .tgl input{accent-color:var(--acc);width:20px;height:20px}

/* ===== Prepare ===== */
.hub{display:flex;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer;padding:15px;border-radius:var(--r);border:1px solid var(--line);background:var(--s1);margin-top:10px}
.hub .ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:none}
.hub b{display:block;font-size:15.5px;font-weight:720} .hub small{display:block;color:var(--mut);font-size:13px;line-height:1.35;margin-top:2px}
.hub .st{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--s3);color:var(--mut)} .hub .st.ok{background:var(--okbg);color:var(--ok)}
.bar{height:5px;border-radius:9px;background:var(--s3);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.scen-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.scen-grid{grid-template-columns:repeat(4,1fr)}}
.scen-t{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--s1);text-align:left;cursor:pointer;min-height:104px}
.scen-t .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--s2);font-size:20px}
.scen-t b{font-size:14px;font-weight:700;line-height:1.25}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.kpi{border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.kpi.water{background:linear-gradient(135deg,var(--waterbg),var(--s1))} .kpi.food{background:linear-gradient(135deg,var(--accbg),var(--s1))}
.kpi small{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.kpi b{display:block;font-size:30px;line-height:1.1;margin:4px 0 2px;font-weight:800;letter-spacing:-.02em} .kpi.water b{color:var(--water)} .kpi.food b{color:var(--acc)}
.kpi span{font-size:12.5px;color:var(--mut)}
.wv{display:flex;align-items:center;justify-content:center;gap:16px;padding:4px 0 12px;text-align:center}
.wv b{display:block;font-size:26px;color:var(--water);font-weight:800} .wv small{color:var(--mut);font-size:12px} .wv .or{color:var(--mut);font-size:13px}
.hint{font-size:13px;color:var(--mut);margin:10px 0 0;line-height:1.5}
.stp{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)} .stp:first-of-type{border-top:0}
.stp>div:first-child{flex:1} .stp b{display:block;font-size:15px} .stp small{color:var(--mut);font-size:12.5px}
.stp-c{display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:14px;padding:4px}
.stp-c button{width:40px;height:40px;border-radius:11px;border:0;background:var(--s3);font-size:22px;cursor:pointer;color:var(--txt)}
.stp-c span{min-width:30px;text-align:center;font-weight:800;font-size:18px}
.ringcard{display:flex;gap:16px;align-items:center;padding:16px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);margin:4px 0 12px}
.ringcard b{font-size:16px} .ringcard p{margin:4px 0 6px;color:var(--mut);font-size:13px}
.lnk{border:0;background:none;color:var(--acc);font-weight:650;font-size:13.5px;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:5px}
.lnk svg.i{width:15px;height:15px}

/* ===== Scenario ===== */
.scen-hero{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:var(--r2);background:linear-gradient(135deg,var(--s2),var(--s1));border:1px solid var(--line)}
.scen-hero>span{font-size:40px;line-height:1}
.scen-hero p{margin:4px 0 0;color:var(--mut);font-size:14px}
.numbar{display:flex;gap:12px;align-items:center;margin:12px 0;padding:12px 14px;border-radius:16px;background:var(--redbg);border:1px solid rgba(255,91,76,.28);text-decoration:none;font-size:13.5px}
.numbar b{font-size:22px;color:var(--red);flex:none;font-weight:800}
.links{display:grid;gap:8px}
.lk{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--s1);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;font-weight:650;font-size:14px;text-decoration:none}
.lk .e{font-size:18px} .lk svg.i{margin-left:auto;width:17px;height:17px;color:var(--mut)}

/* ===== Emergency ===== */
.call{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r2);background:linear-gradient(135deg,#d93a2b,#ff5b4c);color:#fff;text-decoration:none;box-shadow:0 10px 26px rgba(255,91,76,.3)}
body.night .call{background:#3a0707;color:var(--txt)}
.call .big{font-size:38px;font-weight:850;letter-spacing:-.02em;line-height:1}
.call small{display:block;opacity:.9;font-size:13px;line-height:1.35}
.call .ph{margin-left:auto;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.gest{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);border:1px solid rgba(255,91,76,.22);background:var(--s1);text-align:left;cursor:pointer;min-height:96px}
.gest .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--redbg);color:var(--red)}
.gest b{font-size:14.5px;font-weight:720;line-height:1.25}
.tool{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--s1);cursor:pointer;text-align:left;width:100%}
.tool .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--accbg);color:var(--acc)}
.tool b{display:block;font-size:15px;font-weight:720} .tool small{color:var(--mut);font-size:12.5px}
.sosfs{position:fixed;inset:0;z-index:95;background:#000;display:none;align-items:flex-end;justify-content:center;padding-bottom:calc(40px + var(--safe-b))}
.sosfs.on{display:flex} .sosfs.flash{background:#fff}
.sosfs button{background:rgba(120,120,120,.35);color:#fff;border:0;border-radius:999px;padding:14px 26px;font-weight:750;font-size:15px}

/* ===== Flore ===== */
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%}
details.fl{border-radius:var(--r);border:1px solid var(--line);background:var(--s1);border-left:4px solid var(--sc);overflow:hidden}
details.fl summary{display:flex;gap:12px;align-items:center;padding:10px 12px 10px 10px;cursor:pointer;list-style:none}
details.fl summary::-webkit-details-marker{display:none}
details.fl .pic{width:66px;flex:none;border-radius:12px;background:var(--s2)} details.fl .pic svg{display:block;width:100%}
details.fl h4{margin:2px 0 0;font-size:15px;font-weight:700} details.fl i{color:var(--mut);font-size:12.5px}
details.fl .chev{margin-left:auto;color:var(--mut);transition:transform .2s} details.fl[open] .chev{transform:rotate(90deg)}
.stag{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sc)}
.fbody{padding:0 14px 14px;font-size:14px} .fbody p{margin:9px 0;color:var(--txt2)} .fbody p b{color:var(--txt)}
.fbody .conf{background:var(--redbg);border-radius:11px;padding:9px 11px}

/* ===== Settings & sheets ===== */
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)} .setrow:first-of-type{border-top:0}
.setrow>div{flex:1} .setrow b{display:block;font-size:15px;font-weight:650} .setrow small{color:var(--mut);font-size:12.5px}
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + var(--safe-b));border-top:1px solid var(--line2);animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.onb-logo{width:64px;height:64px;margin-bottom:10px}
.vp{display:flex;gap:12px;align-items:flex-start;margin:14px 0} .vp .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--accbg);color:var(--acc)}
.vp b{display:block;font-size:15px} .vp small{color:var(--mut);font-size:13px;line-height:1.4}


/* ===== Crises ===== */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 12px}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px 14px;border-radius:var(--r2);border:1px solid var(--line);cursor:pointer;text-align:left;min-height:150px}
.big svg.i{width:30px;height:30px;margin-bottom:4px} .big b{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.15} .big small{font-size:12.5px;line-height:1.35;opacity:.85}
.big.now{background:linear-gradient(150deg,#e23d2e,#ff6a4a);color:#fff;border-color:transparent;box-shadow:0 10px 24px rgba(255,91,76,.28)}
.big.prep{background:linear-gradient(150deg,var(--okbg),var(--s1));border-color:rgba(147,196,99,.3)} .big.prep svg.i{color:var(--ok)}
body.night .big.now{background:#3a0707;color:var(--txt)}
.call.slim{padding:12px 14px;border-radius:16px;gap:12px;box-shadow:none} .call.slim svg.i{width:24px;height:24px} .call.slim b{display:block;font-size:15px} .call.slim small{font-size:12px}
.seg.big2 button{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 6px;font-size:14px} .seg.big2 svg.i{width:18px;height:18px}
.seg button.on.red{background:var(--red);color:#fff}
.scen-t.now{border-color:rgba(255,91,76,.22)}
.gemoji{font-size:72px;text-align:center;margin-bottom:18px}


/* ===== Outils de crise ===== */
.crisisbar{display:none;position:sticky;top:calc(61px + var(--safe-t));z-index:25;margin:0;padding:8px 12px;background:linear-gradient(90deg,#c9301f,#ff5b4c);color:#fff;gap:8px;align-items:center}
.crisisbar.on{display:flex} body.incrisis .filters{top:calc(117px + var(--safe-t))} body.night .crisisbar{background:#3a0707;color:var(--txt)}
.cb-main{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;text-align:left;cursor:pointer;min-width:0}
.cb-main b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cb-main small{font-size:12px;opacity:.9}
.cb-ic{font-size:22px} .cb-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border:0;color:inherit;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer}
.cb-btn svg.i{width:16px;height:16px}
.tl{list-style:none;margin:0;padding:0} .tl li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px} .tl li:first-child{border-top:0}
.tl time{flex:none;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;min-width:44px}
.stk{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--kh2)}
.stk b{display:block;font-size:14.5px;font-weight:700} .stk small{display:block;color:var(--mut);font-size:12.5px;line-height:1.35;margin-top:1px}
.stk.ok{border-left-color:var(--ok)} .stk.soon{border-left-color:var(--acc)} .stk.exp{border-left-color:var(--red)}
.stb{font-size:12px;font-weight:750;padding:4px 9px;border-radius:999px;background:var(--s3);color:var(--mut);white-space:nowrap}
.stk.ok .stb{background:var(--okbg);color:var(--ok)} .stk.soon .stb{background:var(--accbg);color:var(--acc)} .stk.exp .stb{background:var(--redbg);color:var(--red)}
.bigcoord{font-size:32px;font-weight:850;letter-spacing:-.01em;line-height:1.25;font-variant-numeric:tabular-nums;margin-bottom:12px}
a.btn{text-decoration:none}
.ice{position:fixed;inset:0;z-index:85;background:#fff;color:#111;display:none;flex-direction:column;padding:calc(14px + var(--safe-t)) 20px calc(20px + var(--safe-b));overflow:auto}
.ice.on{display:flex}
.ice .ib.solid{background:#eee;color:#111;border:0}
.ice-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ice-tag{display:inline-flex;align-items:center;gap:8px;background:#d62b1e;color:#fff;font-weight:800;font-size:13px;padding:8px 12px;border-radius:999px;letter-spacing:.02em}
.ice-tag svg.i{width:18px;height:18px}
.ice .fchip{background:#f1f1f1;border-color:#ddd;color:#333} .ice .fchip.on{background:#111;color:#fff;border-color:#111}
.ice-name{font-size:34px;font-weight:850;letter-spacing:-.02em;line-height:1.1;margin-top:8px} .ice-sub{color:#555;font-size:15px;margin-top:4px}
.ice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 6px}
.ice-grid>div,.ice-row{background:#f4f4f4;border-radius:16px;padding:14px}
.ice small{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#777;margin-bottom:4px}
.ice-grid b{font-size:24px;font-weight:850;color:#d62b1e;line-height:1.2} .ice-row{margin-top:10px} .ice-row b{font-size:18px;font-weight:700}
.ice-call{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:#111;color:#fff;text-decoration:none;font-weight:800;font-size:18px;padding:10px 16px;border-radius:12px}
.ice-call svg.i{width:20px;height:20px}

/* ===== SVG illustration classes ===== */
.l{fill:none;stroke:var(--kh);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lt{fill:none;stroke:var(--kh2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.f{fill:var(--kh)} .f2{fill:var(--kh2)}
.a{fill:none;stroke:var(--acc);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.af{fill:var(--acc)} .af2{fill:var(--acc2)}
.w{fill:none;stroke:var(--water);stroke-width:2.2;stroke-linecap:round} .wf{fill:var(--water);opacity:.55}
.g{stroke:var(--kh2);stroke-width:2;stroke-dasharray:1 5;stroke-linecap:round}
.bgs{fill:var(--s2)}
.st{fill:var(--kh);font:700 11px Impact,"Arial Narrow",sans-serif;letter-spacing:.06em}
.sta{fill:var(--acc);font:700 11px Impact,"Arial Narrow",sans-serif;letter-spacing:.06em}
.k{fill:none;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.kh{fill:none;stroke:var(--s2);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.r1{stroke:var(--kh)} .r2{stroke:var(--acc)}
.pole{fill:var(--kh2);opacity:.45;stroke:var(--kh2);stroke-width:1.5}

/* =====================================================================
   AMÉLIORATIONS DU DESIGN D'ORIGINE (thème survie kaki / orange)
   ===================================================================== */
body{--fd:"HTS Display","Arial Narrow",Impact,sans-serif;--pr:var(--red);--pb:var(--ok);--pri:var(--acc);--pribg:var(--accbg);--onp:#fff;--yel:var(--gold);--sh1:0 1px 0 rgba(0,0,0,.18)}
body.sable{--sh1:0 1px 2px rgba(70,60,30,.08)}
:focus{outline:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 60%,transparent);outline-offset:2px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
::selection{background:var(--accbg)}

/* Marque : lettrage condensé identique sur tous les téléphones */
.brand b{font:700 21px/1 var(--fd);letter-spacing:.07em}
.brand svg{width:32px;height:32px}
.st,.sta{font-family:var(--fd)}

/* Titres un peu plus affirmés */
.h1{letter-spacing:-.03em}
.shd h3{font-size:18px}
.hello .h1{font-size:31px}

/* Icônes de catégories et de crises : pastilles teintées */
.ico.plate{background:color-mix(in srgb,var(--pc) 17%,transparent)!important;color:var(--pc)!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 22%,transparent)}
body.night .ico.plate{background:var(--s2)!important;color:var(--txt)!important}
.scen-t .ico{width:42px;height:42px;border-radius:13px}
.scen-t .ico svg.i{width:22px;height:22px}
.scen-hero .ico{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;flex:none}
.scen-hero .ico svg.i{width:28px;height:28px}
.scen-hero{align-items:center}
.gemoji{display:flex;justify-content:center;margin-bottom:22px}
.gemoji .ico{width:96px;height:96px;border-radius:26px;display:grid;place-items:center}
.gemoji .ico svg.i{width:46px;height:46px}
.lk .e{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--s2);flex:none}
.lk .e svg.i{width:17px;height:17px;margin:0;color:var(--kh)}
.cb-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.18);flex:none}
.cb-ic svg.i{width:20px;height:20px}
.card h4>span>svg.i{width:19px;height:19px;color:var(--acc)}

/* Boutons de meilleure qualité */
.btn{min-height:52px;height:auto;border-radius:14px;line-height:1.2;letter-spacing:.005em;transition:transform .1s,filter .15s,box-shadow .15s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.pri{background:linear-gradient(180deg,var(--acc2),var(--acc) 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -2px 0 rgba(0,0,0,.18),0 8px 20px rgba(255,123,48,.28)}
.btn.pri:hover{filter:brightness(1.05)} .btn.pri:active{box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.btn.red{background:linear-gradient(180deg,#ff6a5a,var(--red) 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 0 rgba(0,0,0,.2),0 8px 20px rgba(255,91,76,.28)}
.btn.sec{box-shadow:inset 0 1px 0 rgba(255,255,255,.04),var(--sh1)}
.btn.sec:hover{border-color:color-mix(in srgb,var(--kh) 40%,transparent)}
body.sable .btn.pri,body.sable .btn.red{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -2px 0 rgba(0,0,0,.15),0 6px 14px rgba(150,60,10,.18)}
body.night .btn.pri,body.night .btn.red{background:var(--acc);box-shadow:none}
.row2 .btn.sec{flex:0 0 auto}
.pill{white-space:nowrap;min-height:38px} .row2:has(.pill){flex-wrap:wrap}
.seg button{white-space:nowrap;min-height:38px}
.seg button.on.blue{background:var(--ok);color:var(--bg)}
.fchip{min-height:36px}
.add{min-height:50px}
.qa,.cat,.scen-t,.gest,.mini,.feature,.hub,.tool,.catrow,.item,.lk,.pn button{transition:transform .1s,border-color .15s,background .15s}
.qa:active,.cat:active,.scen-t:active,.gest:active,.mini:active,.feature:active,.hub:active,.tool:active,.catrow:active,.lk:active{transform:scale(.98)}
.hub:hover,.tool:hover,.catrow:hover,.lk:hover,.scen-t:hover,.gest:hover,.feature:hover,.mini:hover{border-color:var(--line2)}

/* Cases à cocher dessinées */
.mat input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border-radius:7px;border:2px solid var(--line2);background:var(--s1);display:grid;place-items:center;cursor:pointer;transition:.12s}
.mat input:checked{background:var(--ok);border-color:var(--ok)}
.mat input:checked::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.mat input:checked+span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--mut) 60%,transparent)}

/* Appel 112 */
.call.slim::after{content:"112";margin-left:auto;font:700 36px/1 var(--fd);letter-spacing:.02em}
.call.xl{gap:14px;padding:18px 16px}
.call.xl .ph{margin-left:0;flex:none}
.call.xl b{display:block;font-size:18px;font-weight:800}
.call.xl small{margin-top:2px}
.call.xl .num{margin-left:auto;font:700 56px/.9 var(--fd);letter-spacing:.02em}
.numbar b{font-family:var(--fd);font-size:28px}
.kpi b,.wv b,.bigcoord,.ring{font-family:var(--fd);letter-spacing:.01em}
.kpi b{font-size:34px}

/* Feuilles du bas */
.sheet{position:relative;padding-top:28px}
.sheet::before{content:"";position:absolute;top:10px;left:50%;width:40px;height:5px;border-radius:5px;background:var(--line2);transform:translateX(-50%)}

/* ===== Avec ce que j'ai ===== */
details.have{margin:4px 0 12px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);overflow:hidden}
details.have summary{display:flex;align-items:center;gap:12px;padding:12px 13px;cursor:pointer;list-style:none}
details.have summary::-webkit-details-marker{display:none}
details.have summary .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--accbg);color:var(--acc)}
details.have summary b{display:block;font-size:15.5px;font-weight:750} details.have summary small{display:block;color:var(--mut);font-size:13px;margin-top:1px}
details.have .chev{margin-left:auto;color:var(--mut);transition:transform .2s} details.have[open] .chev{transform:rotate(90deg)}
.havebody{padding:0 13px 13px}
.hchips{display:flex;flex-wrap:wrap;gap:7px}
.hchip{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 12px 0 8px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt2);font-size:13.5px;font-weight:650;cursor:pointer;text-align:left;line-height:1.2;transition:.12s}
.hchip i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none}
.hchip i svg.i{width:12px;height:12px;stroke-width:3.2;opacity:0}
.hchip.on{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--txt)}
.hchip.on i{background:var(--ok);border-color:var(--ok);color:var(--bg)} .hchip.on i svg.i{opacity:1}
.hchip.sm{min-height:32px;font-size:13px;padding:0 10px 0 6px;margin:2px 0}
.advice{margin:0 0 12px;padding:14px;border-radius:var(--r);background:linear-gradient(135deg,var(--okbg),var(--s1));border:1px solid rgba(147,196,99,.28)}
.advice h4{margin:0 0 10px;font-size:15.5px;font-weight:750;display:flex;align-items:center;gap:8px} .advice h4 svg.i{color:var(--ok);width:19px;height:19px}
.adv{padding:9px 0;border-top:1px solid var(--line)} .adv:first-of-type{border-top:0;padding-top:0}
.adv>small{display:block;color:var(--ok);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}
.advbtn{display:flex;align-items:center;gap:12px;width:100%;padding:6px;border-radius:14px;border:1px solid var(--line);background:var(--s1);cursor:pointer;text-align:left}
.advbtn .pic{width:78px;flex:none;border-radius:10px;overflow:hidden;background:var(--s2)} .advbtn .pic svg,.advbtn .pic img{display:block;width:100%;aspect-ratio:5/3;object-fit:cover}
.advbtn b{display:block;font-size:14.5px;font-weight:720;line-height:1.25} .advbtn span{font-size:12.5px;color:var(--mut)} .advbtn>svg.i{margin-left:auto;color:var(--mut);width:18px;height:18px;flex:none}
.count svg.i{width:15px;height:15px;vertical-align:-2px;margin-right:4px;color:var(--ok)}
.miss{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;font-weight:650;color:var(--acc);line-height:1.3}
.miss svg.i{width:14px;height:14px;flex:none} .miss.ok{color:var(--ok)}

/* ===== Fiches enrichies ===== */
.why{margin:14px 0 4px;padding:13px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--water)}
.why b{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--water);margin-bottom:5px} .why b svg.i{width:16px;height:16px}
.why p{margin:0;font-size:14.5px;line-height:1.5;color:var(--txt2)}

{id:"noeud-huit",kt:"Arrêt",art:"k_huit",t:"Nœud en huit",en:"Figure-eight knot",diff:1,time:"15 s",
s:"Le nœud d'arrêt de référence : plus gros que le nœud simple, il se défait facilement même après tension.",
ex:{t:"Empêcher une corde de filer dans une poulie ou un anneau",d:"Vous descendez votre sac à dos le long d'une pente raide avec une corde passée autour d'un arbre : un huit à l'extrémité garantit que la corde ne glissera jamais entièrement et que vous ne perdrez pas le sac."},
mat:["Une corde"],
steps:["Faites une boucle en passant l'extrémité libre par-dessus le dormant.","Continuez en passant l'extrémité derrière le dormant.","Ramenez-la vers l'avant et passez-la dans la première boucle, par le dessus.","Serrez : le nœud doit dessiner clairement un « 8 »."],
tips:["Laissez toujours une extrémité libre d'au moins 10 cm après le nœud."],
warn:[]},
{id:"noeud-huit-boucle",kt:"Boucle",art:"k_huitb",t:"Huit en boucle (huit double)",en:"Figure-eight loop",diff:1,time:"30 s",
s:"Une boucle fixe très solide et facile à contrôler visuellement. Le nœud préféré des grimpeurs et des sauveteurs.",
ex:{t:"Suspendre la nourriture hors de portée des animaux",d:"Au bivouac, faites un huit en boucle au bout d'une corde, clippez-y ou attachez-y le sac de nourriture, lancez l'autre extrémité par-dessus une branche à 4 m de haut et hissez. La boucle ne se resserre pas et se défait facilement le lendemain."},
mat:["Une corde"],
steps:["Pliez la corde sur 50 cm pour former une « ganse » (corde doublée).","Avec cette partie doublée, formez une boucle en croisant par-dessus le dormant.","Passez la ganse derrière le dormant doublé.","Ramenez-la vers l'avant et passez-la dans la première boucle.","Ajustez la taille de la boucle finale, puis peignez le nœud : les brins doivent rester parallèles sans se croiser.","Serrez fermement en tirant sur les quatre brins."],
tips:["Pour l'attacher autour d'un objet fermé (arbre, harnais), faites un huit simple, passez l'extrémité autour de l'objet, puis suivez le trajet du huit à l'envers (« huit tressé »)."],
warn:["Un huit mal peigné reste solide mais se bloque fortement : prenez le temps de le ranger."]},
{id:"noeud-chaise",kt:"Boucle",art:"k_chaise",t:"Nœud de chaise",en:"Bowline",diff:2,time:"30 s",
s:"Le « roi des nœuds » : une boucle fixe qui ne se resserre jamais et se défait d'une main, même après forte traction.",
ex:{t:"Hisser une personne hors d'un ravin ou d'un trou d'eau",d:"Lancez la corde à la victime : elle fait (ou vous faites) un nœud de chaise autour de sa poitrine, sous les aisselles. La boucle ne l'étranglera pas en se serrant, contrairement à un nœud coulant, et vous pouvez la tracter en sécurité."},
mat:["Une corde"],
steps:["Faites une petite boucle sur le dormant, partie libre par-dessus : c'est « le terrier ».","Passez l'extrémité libre dans la petite boucle, par en dessous : « le lapin sort du terrier ».","Faites passer l'extrémité derrière le dormant : « il tourne autour de l'arbre ».","Repassez l'extrémité dans la petite boucle, par le dessus : « il rentre dans son terrier ».","Ajustez la grande boucle à la taille voulue.","Serrez en tenant l'extrémité et la boucle d'une main, le dormant de l'autre."],
tips:["Pour faire une boucle autour de votre propre taille, entraînez-vous yeux fermés.","Sécurisez avec un nœud simple sur l'extrémité si le nœud va subir des secousses."],
warn:["Un nœud de chaise peut se desserrer s'il n'est pas sous tension et ballotte longtemps : sécurisez-le.","Pour l'escalade, préférez le huit tressé."]},
{id:"noeud-cabestan",kt:"Attache",art:"k_cabestan",t:"Nœud de cabestan",en:"Clove hitch",diff:1,time:"10 s",
s:"Attache rapide sur un poteau, un arbre ou une perche, réglable tant qu'il n'est pas sous charge.",
ex:{t:"Commencer et finir un brêlage d'abri",d:"Pour fixer la perche faîtière d'un appentis entre deux arbres, démarrez chaque attache par un nœud de cabestan : il se pose en quelques secondes et sert de base au brêlage carré qui maintiendra la structure."},
mat:["Une corde","Un poteau, arbre ou perche"],
steps:["Faites un tour autour du poteau.","Croisez l'extrémité par-dessus la première spire, en diagonale.","Faites un second tour autour du poteau, juste à côté du premier.","Glissez l'extrémité sous ce second tour, entre la corde et le poteau.","Serrez : les deux extrémités sortent par des côtés opposés, sous la diagonale."],
tips:["Sur un piquet dont le haut est libre, on peut le faire en superposant deux boucles et en les enfilant : quelques secondes seulement."],
warn:["Il peut glisser si le poteau tourne ou si la charge varie : ajoutez deux demi-clés pour une attache durable."]},
{id:"noeud-demi-cles",kt:"Attache",art:"k_demicles",t:"Tour mort et deux demi-clés",en:"Round turn & two half hitches",diff:1,time:"20 s",
s:"L'attache la plus fiable sur un anneau, un arbre ou un piquet, qui supporte une forte traction permanente.",
ex:{t:"Amarrer un canot ou attacher un radeau improvisé",d:"Pour empêcher votre embarcation de dériver pendant la nuit, faites un tour mort autour d'un tronc solide de la berge puis deux demi-clés. Le tour mort encaisse la traction du courant, les demi-clés le verrouillent."},
mat:["Une corde","Un point d'ancrage"],
steps:["Faites deux tours complets autour de l'objet (le « tour mort »).","Passez l'extrémité autour du dormant et dans la boucle formée : première demi-clé.","Recommencez dans le même sens : deuxième demi-clé.","Faites glisser les demi-clés contre l'objet et serrez."],
tips:["Le tour mort permet de retenir une charge d'une seule main pendant que vous faites les demi-clés."],
warn:["Si les deux demi-clés ne sont pas dans le même sens, vous obtenez un nœud moins sûr."]},
{id:"noeud-tendeur",kt:"Réglage",art:"k_tendeur",t:"Nœud tendeur",en:"Taut-line hitch",diff:2,time:"30 s",
s:"Une boucle réglable qui coulisse quand on la pousse et bloque sous tension. Indispensable pour les haubans.",
ex:{t:"Retendre une bâche détendue par la pluie",d:"La nuit, la toile mouillée se détend et claque au vent. Grâce au nœud tendeur sur chaque hauban, il suffit de faire coulisser le nœud vers le haut sans rien détacher : la bâche est de nouveau tendue en 10 secondes."},
mat:["Une cordelette","Un piquet ou une sardine"],
steps:["Passez la corde autour du piquet et ramenez l'extrémité le long du dormant.","Enroulez l'extrémité deux fois autour du dormant, en allant vers le piquet (à l'intérieur de la boucle).","Faites un troisième tour autour du dormant, cette fois à l'extérieur des deux premiers (côté opposé au piquet).","Passez l'extrémité sous ce dernier tour et serrez.","Faites glisser le nœud le long du dormant pour régler la tension : il bloque dès qu'on le lâche."],
tips:["Avec une corde très glissante (dyneema), ajoutez un tour supplémentaire à l'intérieur."],
warn:[]},
{id:"noeud-plat",kt:"Ajut",art:"k_plat",t:"Nœud plat",en:"Reef / square knot",diff:1,time:"10 s",
s:"Relie deux extrémités de même diamètre, à plat. Le nœud des bandages.",
ex:{t:"Fermer une écharpe ou un pansement",d:"Pour immobiliser un bras avec un foulard triangulaire, nouez les deux pointes derrière la nuque avec un nœud plat : il reste plat, ne blesse pas et se défait facilement en tirant sur une extrémité pour contrôler la blessure."},
mat:["Deux extrémités de corde, de bande ou de tissu"],
steps:["Croisez l'extrémité droite par-dessus la gauche et passez-la dessous (comme le premier nœud d'un lacet).","Croisez maintenant l'extrémité gauche par-dessus la droite et passez-la dessous.","Retenez : « droite sur gauche, gauche sur droite ».","Vérifiez : chaque extrémité doit ressortir du même côté que son propre dormant, en formant deux boucles imbriquées symétriques.","Serrez en tirant les deux dormants."],
tips:["Si les extrémités ressortent en travers, c'est un « nœud de vache » : il glisse. Recommencez."],
warn:["Ne l'utilisez jamais pour une charge importante ou pour relier deux cordes de sécurité : il peut se défaire."]},
{id:"noeud-ecoute",kt:"Ajut",art:"k_ecoute",t:"Nœud d'écoute",en:"Sheet bend",diff:1,time:"20 s",
s:"Relie deux cordes de diamètres ou de matières différents, là où le nœud plat glisserait.",
ex:{t:"Rallonger une corde trop courte avec ce qu'on a",d:"Votre ligne de faîtage est trop courte d'un mètre ? Reliez la paracorde à une lanière de tissu déchirée ou à une corde végétale avec un nœud d'écoute : la différence d'épaisseur ne pose aucun problème."},
mat:["Deux cordes"],
steps:["Pliez la corde la plus épaisse pour former une ganse (un U).","Passez l'extrémité de la corde fine dans la ganse, par en dessous.","Faites-la passer autour des deux brins de la ganse.","Glissez-la sous elle-même, mais pas dans la ganse.","Serrez en tirant d'un côté la ganse et de l'autre le dormant de la corde fine.","Pour plus de sécurité, faites un deuxième tour avant de passer sous elle-même (nœud d'écoute double)."],
tips:["Les deux extrémités libres doivent se retrouver du même côté du nœud."],
warn:["Il peut se desserrer sans tension : laissez des extrémités longues."]},
{id:"noeud-pecheur",kt:"Ajut",art:"k_pecheur",t:"Nœud de pêcheur double",en:"Double fisherman's knot",diff:2,time:"1 min",
s:"La jonction la plus sûre entre deux cordes, ou pour fermer une cordelette en anneau.",
ex:{t:"Fabriquer un anneau de cordelette pour un Prusik",d:"Avec 1,2 m de cordelette de 5 mm, reliez les deux bouts par un pêcheur double : vous obtenez un anneau qui servira de poignée autobloquante ou d'ancrage autour d'un arbre."},
mat:["Deux cordes ou les deux extrémités d'une même cordelette"],
steps:["Placez les deux extrémités côte à côte, en sens opposés, sur environ 30 cm.","Avec l'extrémité A, faites deux tours autour de la corde B en revenant vers vous.","Passez l'extrémité A dans ces deux tours, puis serrez : premier nœud.","Faites exactement la même chose avec l'extrémité B autour de la corde A.","Tirez sur les deux dormants : les deux nœuds glissent et viennent se bloquer l'un contre l'autre."],
tips:["Vu d'un côté, on doit voir deux « X » ; de l'autre, quatre traits parallèles.","Laissez au moins 5 cm d'extrémité libre."],
warn:["Quasi impossible à défaire après une forte charge : c'est voulu."]},
{id:"noeud-bois",kt:"Attache",art:"k_bois",t:"Nœud de bois",en:"Timber hitch",diff:1,time:"15 s",
s:"S'attache en un instant autour d'un objet cylindrique et se défait tout seul quand on relâche la tension.",
ex:{t:"Traîner une grosse bûche jusqu'au camp",d:"Pour ramener un tronc mort de 3 m pour le feu de la nuit, faites un nœud de bois à une extrémité et une demi-clé un peu plus loin vers l'avant : la bûche se laisse tirer droit sans se mettre en travers."},
mat:["Une corde","Une bûche, un tronc ou une perche"],
steps:["Passez la corde autour de la bûche.","Enroulez l'extrémité une fois autour du dormant.","Torsadez ensuite l'extrémité sur elle-même, autour de la partie qui entoure la bûche, au moins 3 fois.","Tirez sur le dormant : la torsade se coince contre la bûche.","Pour traîner, ajoutez une demi-clé autour de la bûche, plus près de l'avant (nœud de bois et demi-clé)."],
tips:["Il sert aussi à démarrer un brêlage en trépied ou à suspendre un sac."],
warn:["Il ne tient que sous tension : ne l'utilisez pas pour une attache permanente."]},
{id:"noeud-camionneur",kt:"Réglage",art:"k_camion",t:"Nœud de camionneur",en:"Trucker's hitch",diff:3,time:"1 min",
s:"Un palan improvisé qui multiplie votre force de traction pour tendre une corde comme une barre.",
ex:{t:"Tendre une ligne de faîtage parfaitement droite",d:"Pour une bâche qui ne fléchit pas sous la neige, attachez la ligne au premier arbre avec un nœud de chaise, puis au second avec un nœud de camionneur. Vous obtenez une tension impossible à atteindre à la main."},
mat:["Une corde","Deux points d'ancrage"],
steps:["Attachez une extrémité au premier point d'ancrage (nœud de chaise ou cabestan).","À peu près aux deux tiers de la distance, formez sur le dormant une boucle fixe ou coulissante (boucle de lacet).","Passez l'extrémité libre autour du second point d'ancrage.","Ramenez-la et passez-la dans la boucle formée sur le dormant : c'est votre poulie.","Tirez fort sur l'extrémité : la force est démultipliée.","Maintenez la tension en pinçant le croisement, puis bloquez avec deux demi-clés sous la boucle."],
tips:["Un mousqueton dans la boucle réduit les frottements et protège la corde."],
warn:["La force exercée est importante : vérifiez que les points d'ancrage tiennent et ne vous placez pas dans l'axe de la corde."]},
{id:"noeud-prusik",kt:"Réglage",art:"k_prusik",t:"Nœud de Prusik",en:"Prusik hitch",diff:2,time:"30 s",
s:"Un nœud autobloquant : il coulisse librement sur une corde, mais se bloque dès qu'on le charge.",
ex:{t:"Créer une poignée réglable sur la ligne de faîtage",d:"Placez un Prusik de chaque côté de votre ligne de faîtage et attachez-y les coins de la bâche : vous centrez et tendez la toile en faisant glisser les nœuds, sans jamais toucher à la ligne. En montagne, deux Prusik permettent même de remonter le long d'une corde."},
mat:["Corde principale","Anneau de cordelette plus fine (environ 60 % du diamètre de la corde principale)"],
steps:["Placez l'anneau de cordelette derrière la corde principale.","Passez une extrémité de l'anneau autour de la corde et à l'intérieur de l'anneau lui-même.","Recommencez pour obtenir 3 tours bien parallèles (4 si la corde est glissante).","Peignez les tours pour qu'ils soient bien serrés et alignés, sans chevauchement.","Tirez sur la boucle sortante : le nœud doit se bloquer net.","Pour le faire glisser, poussez sur le corps du nœud, pas sur la boucle."],
tips:["Une cordelette trop proche du diamètre de la corde principale ne bloquera pas."],
warn:["Ne l'utilisez pas comme seul système de sécurité pour l'escalade sans formation."]},
{id:"brelage-carre",kt:"Brêlage",art:"k_brecarre",t:"Brêlage carré",en:"Square lashing",diff:2,time:"3 à 5 min",
s:"Assemble deux perches à angle droit de façon rigide. La base de toute construction de camp.",
ex:{t:"Construire un lit surélevé ou un séchoir à viande",d:"Pour dormir hors du sol humide, fixez deux traverses sur quatre piquets avec des brêlages carrés, puis posez des perches dessus. La même technique sert à monter le cadre du séchoir à viande de l'onglet Conservation."},
mat:["Corde de 2 à 4 m","Deux perches"],
steps:["Croisez les deux perches : la verticale derrière, l'horizontale devant.","Faites un nœud de cabestan sur la perche verticale, juste sous l'horizontale.","Faites passer la corde par-dessus l'horizontale, derrière la verticale, sous l'horizontale, derrière la verticale : c'est un tour.","Faites 3 à 4 tours en serrant fort, en plaçant chaque tour à l'intérieur du précédent sur une perche et à l'extérieur sur l'autre.","Faites 2 à 3 tours de serrage (« frappages ») entre les deux perches, autour des tours déjà faits.","Terminez par un nœud de cabestan sur la perche horizontale."],
tips:["Serrez à chaque tour : un brêlage lâche ne se rattrape pas à la fin.","Mouiller une corde végétale avant de brêler la resserre en séchant."],
warn:[]},
{id:"brelage-trepied",kt:"Brêlage",art:"k_trepied",t:"Brêlage en trépied",en:"Tripod lashing",diff:2,time:"5 min",
s:"Assemble trois perches qui s'écartent pour former un support stable et autoportant.",
ex:{t:"Suspendre une marmite au-dessus du feu",d:"Trois perches de 1,8 m brêlées en trépied au-dessus du foyer : suspendez la gamelle à une corde ou une chaîne sous le brêlage pour faire bouillir l'eau. Le même trépied, en plus grand, devient la structure du fumoir tipi."},
mat:["Corde de 3 à 4 m","Trois perches de même longueur"],
steps:["Posez les trois perches côte à côte au sol, celle du milieu dans l'autre sens.","Faites un nœud de cabestan sur une perche extérieure, à 30 cm du sommet.","Tissez la corde en huit entre les trois perches (dessus, dessous, dessus…), 6 à 8 fois, sans trop serrer.","Faites 2 tours de frappage entre chaque paire de perches.","Terminez par un nœud de cabestan sur la perche extérieure opposée.","Redressez la structure et écartez les pieds : le brêlage se tend tout seul."],
tips:["Plus les tours sont lâches, plus les pieds peuvent s'écarter largement."],
warn:["Vérifiez la stabilité avant de suspendre une charge au-dessus du feu."]},
{id:"noeud-palomar",kt:"Pêche",art:"k_palomar",t:"Nœud Palomar",en:"Palomar knot",diff:1,time:"30 s",
s:"Le nœud le plus solide pour attacher un hameçon à un fil de pêche fin et glissant.",
ex:{t:"Monter les hameçons d'une ligne de fond",d:"Sur chaque bas de ligne de votre ligne dormante, attachez l'hameçon avec un Palomar : il conserve presque toute la résistance du fil et ne glisse pas, même avec du fil nylon fin."},
mat:["Fil de pêche","Hameçon"],
steps:["Doublez 15 cm de fil pour former une boucle.","Passez cette boucle dans l'œillet de l'hameçon.","Faites un nœud simple lâche avec le fil doublé, l'hameçon pendant en dessous.","Passez la boucle par-dessus l'hameçon entier.","Humidifiez le nœud avec de la salive et serrez en tirant sur les deux brins.","Coupez l'excédent à 3 mm."],
tips:["Toujours humidifier un nœud en nylon avant de serrer : la chaleur de friction affaiblit le fil."],
warn:["Attention à la pointe de l'hameçon en passant la boucle par-dessus."]},
{id:"noeud-coulant",kt:"Boucle",art:"k_coulant",t:"Nœud coulant",en:"Running noose",diff:1,time:"15 s",
s:"Une boucle qui se resserre quand on tire. La base du collet et des fermetures de sac.",
ex:{t:"Armer un collet ou fermer un sac de couchage improvisé",d:"Le nœud coulant est le cœur du collet de l'onglet Pièges : la boucle se resserre au passage de l'animal. Au camp, il permet aussi de fermer rapidement un sac à provisions suspendu."},
mat:["Une cordelette ou un fil"],
steps:["Faites une boucle à l'extrémité de la corde.","Avec l'extrémité libre, faites un nœud simple autour du dormant.","Serrez ce nœud simple : il doit pouvoir coulisser le long du dormant.","Ajustez la taille de la boucle en faisant glisser le nœud."],
tips:["Pour un collet en fil métallique, on remplace le nœud par un petit œillet torsadé à travers lequel passe le fil."],
warn:["Ne le placez JAMAIS autour du cou ou d'un membre d'une personne : utilisez le nœud de chaise pour toute boucle autour du corps."]}
];
