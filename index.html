CRAFTS.push(
/* PRIORITÉS */
{id:"gerer-stress",cat:"priorites",art:"m_stress",t:"Gérer la peur et la panique",diff:1,time:"2 à 5 min",
s:"La panique tue autant que le froid. Les techniques de respiration utilisées par les militaires pour reprendre le contrôle.",
mat:["Rien"],
steps:["Reconnaissez les signes : cœur qui s'emballe, respiration courte, pensées en boucle, envie de fuir ou de courir.","RESPIRATION CARRÉE : inspirez par le nez 4 secondes, bloquez 4 secondes, expirez 4 secondes, bloquez 4 secondes. Répétez 4 à 6 cycles.","Nommez à voix haute 5 choses que vous voyez, 4 que vous entendez, 3 que vous touchez : cela ramène l'attention au présent.","Fixez-vous une seule petite tâche concrète (ramasser du bois, vérifier l'équipement) et accomplissez-la.","Buvez un peu et mangez quelque chose de sucré si possible.","Établissez une routine : horaires de repas, de corvée de bois, de signalisation. La routine combat le sentiment d'impuissance.","En groupe, parlez calmement, répartissez les rôles et valorisez chaque réussite."],
tips:["La volonté de vivre est citée par tous les manuels militaires comme le premier facteur de survie.","Pensez à ceux qui vous attendent : c'est une motivation puissante."],
warn:["Ne prenez aucune décision importante (quitter un abri, partir de nuit) en pleine panique."]},
{id:"plan-sortie",cat:"priorites",art:"m_plan",t:"Prévenir avant de partir",diff:1,time:"10 min",
s:"La mesure qui sauve le plus de vies en randonnée : quelqu'un sait où vous êtes et quand donner l'alerte.",
mat:["Papier ou message","Téléphone chargé","Batterie externe"],
steps:["Écrivez votre itinéraire précis : point de départ, parcours, variantes possibles, lieu de bivouac.","Indiquez l'heure de retour prévue ET l'heure limite à partir de laquelle prévenir les secours.","Donnez la description du groupe, des vêtements (couleurs), du véhicule et de sa plaque.","Envoyez ces informations à une personne fiable qui ne participe pas à la sortie.","Laissez éventuellement un mot visible sur le tableau de bord de la voiture.","Prévenez votre contact à votre retour, sans faute.","Si vous changez d'itinéraire, prévenez-le si possible."],
tips:["Consultez la météo et l'heure du coucher du soleil avant de partir.","Mettez le téléphone en mode économie d'énergie et coupez les applications inutiles."],
warn:["Une fois perdu, restez sur place : les secours chercheront d'abord sur l'itinéraire annoncé."]},
{id:"rester-chaud",cat:"priorites",art:"m_cold",t:"Rester au chaud : la règle C.O.L.D.",diff:1,time:"Réflexe",
s:"Le principe militaire pour garder la chaleur du corps en climat froid, avec les vêtements que l'on porte.",
mat:["Vêtements en couches","Bonnet, gants","Vêtements de rechange secs"],
steps:["C – Clean (propre) : des vêtements sales et gras perdent leur pouvoir isolant.","O – Overheating (éviter de surchauffer) : retirez une couche AVANT de transpirer pendant l'effort ; la sueur mouille l'isolation et refroidit ensuite.","L – Loose and Layered (amples et en couches) : plusieurs couches fines piègent l'air chaud ; des vêtements serrés coupent la circulation.","D – Dry (sec) : séchez chaussettes et gants près du feu ou contre le corps la nuit.","Couvrez la tête, le cou et les mains : ces zones perdent beaucoup de chaleur.","Isolez-vous du sol : asseyez-vous sur votre sac, des branches ou des feuilles.","Mangez et buvez régulièrement : le corps a besoin d'énergie pour produire de la chaleur."],
tips:["Laine et synthétique isolent même humides, le coton non.","La nuit, faites quelques exercices avant de dormir pour entrer chaud dans le couchage."],
warn:["Frissons incontrôlables et maladresse sont les premiers signes d'hypothermie : agissez immédiatement."]},

/* ABRIS */
{id:"lit-sureleve",cat:"abris",art:"m_lit",t:"Lit surélevé",diff:2,time:"1 à 2 h",
s:"Dormir hors du sol froid, humide ou infesté d'insectes. Indispensable en terrain marécageux.",
mat:["4 piquets fourchus ou 4 arbres proches","2 longues perches latérales","Nombreuses perches courtes","Cordage (brêlage)","Branchages, feuilles, herbe sèche"],
steps:["Plantez quatre piquets fourchus en rectangle (environ 2 m x 0,8 m), fourches à 30–50 cm de hauteur.","Posez les deux longues perches dans les fourches, dans le sens de la longueur.","Fixez-les par des brêlages carrés si les fourches ne suffisent pas.","Disposez des perches courtes en travers, serrées les unes contre les autres.","Recouvrez d'une épaisse couche de branches souples, de feuilles ou d'herbe sèche.","Testez la solidité avant de vous coucher, puis installez votre abri (bâche) au-dessus."],
tips:["Variante rapide : un simple matelas de 30 cm de branches de conifère pointe vers le bas isole déjà bien du sol.","Combinez avec un appentis et un feu réflecteur pour une nuit confortable."],
warn:["Vérifiez que les perches ne sont ni pourries ni fendues."]},
{id:"abri-naturel",cat:"abris",art:"m_roche",t:"Utiliser un abri naturel",diff:1,time:"15 à 60 min",
s:"Surplomb rocheux, arbre tombé, creux de terrain : gagner du temps et de l'énergie avant la nuit.",
mat:["Branchages pour fermer les côtés","Feuilles pour la litière"],
steps:["Cherchez un surplomb rocheux, un gros arbre tombé, les branches basses d'un conifère, un creux sec.","Inspectez soigneusement : traces d'animaux, nids, guêpes, serpents, odeur.","Vérifiez la stabilité : pas de roches fissurées au-dessus, pas de branches mortes suspendues.","Fermez les côtés exposés au vent avec des branchages et des débris.","Installez une litière isolante épaisse.","Faites éventuellement un petit feu à l'entrée, jamais au fond d'une grotte."],
tips:["Sous un grand sapin, la neige s'accumule moins près du tronc : un abri tout fait par temps de neige."],
warn:["Grottes : risque d'éboulement, de crue soudaine et d'accumulation de fumée. Ne vous enfoncez jamais à l'intérieur.","Évitez les lits de rivières et le pied des pentes instables."]},
{id:"choisir-camp",cat:"abris",art:"m_camp",t:"Choisir l'emplacement du camp",diff:1,time:"15 min",
s:"Un bon emplacement fait la moitié de l'abri. Les critères des manuels militaires, dont la règle B.L.I.S.S.",
mat:["Observation"],
steps:["Commencez à chercher au moins 2 heures avant la nuit.","Choisissez un sol plat, sec, légèrement surélevé, avec un drainage naturel.","Restez proche de l'eau (accès) mais à au moins 60 m d'un cours d'eau (crues, insectes, air froid, bruit).","Évitez fonds de vallée (air froid et humide), crêtes (vent, foudre) et pieds de pentes (chutes de pierres).","Vérifiez l'absence d'arbres morts et de branches cassées au-dessus de vous.","Assurez-vous d'avoir du bois mort et des matériaux à portée.","Si vous voulez être discret, appliquez B.L.I.S.S. : se fondre dans le décor (Blend), silhouette basse (Low), forme irrégulière (Irregular), petit (Small), lieu isolé (Secluded).","Si vous voulez être retrouvé, faites l'inverse : proximité d'une clairière, couleurs vives, signaux au sol."],
tips:["Orientez l'ouverture de l'abri dos au vent dominant, vers le soleil levant si possible."],
warn:["Ne campez jamais dans un lit de ruisseau asséché ou une ravine."]},
{id:"nuit-voiture",cat:"abris",art:"m_voiture",t:"Bloqué en voiture par la neige",diff:1,time:"Plusieurs heures",
s:"Coincé dans une tempête de neige ou un embouteillage géant : rester dans son véhicule en sécurité.",
mat:["Couvertures ou sac de couchage","Eau et nourriture","Lampe, batterie externe","Pelle pliante","Tissu de couleur vive"],
steps:["Restez dans le véhicule : il vous protège et il est plus facile à repérer qu'une personne à pied.","Appelez le 112 et indiquez votre position (borne kilométrique, sortie, coordonnées GPS).","Dégagez régulièrement la neige autour du pot d'échappement.","Faites tourner le moteur environ 10 minutes par heure pour vous réchauffer, avec une vitre très légèrement entrouverte du côté opposé au vent.","Attachez un tissu de couleur vive à l'antenne ou à la portière ; allumez le plafonnier quand le moteur tourne.","Couvrez-vous, serrez-vous les uns contre les autres, bougez bras et jambes régulièrement.","Buvez et mangez un peu ; ne mangez pas de neige sans la faire fondre."],
tips:["Gardez en permanence dans le coffre : couverture, eau, barres, lampe, gants, pelle, câbles de démarrage.","Ne laissez jamais le réservoir descendre sous le quart en hiver."],
warn:["Un pot d'échappement bouché par la neige fait entrer du monoxyde de carbone mortel dans l'habitacle.","Ne quittez la voiture que si l'aide est visible et à moins de 100 m."]},

/* FEU */
{id:"feu-pluie",cat:"feu",art:"m_pluie",t:"Allumer un feu sous la pluie",diff:2,time:"30 à 60 min",
s:"Le bois est mouillé, il pleut : les techniques pour trouver du sec et protéger la flamme.",
mat:["Couteau","Bâche ou abri naturel","Écorce de bouleau, résine","Amadou de réserve (coton vaseliné)"],
steps:["Installez la zone de feu à l'abri : sous une bâche tendue haut, sous un gros conifère ou un surplomb.","Collectez les brindilles mortes encore accrochées à la base des conifères : elles sont protégées de la pluie.","Prélevez de l'écorce de bouleau et du bois résineux (souche de pin riche en résine, « bois gras ») : ils brûlent même humides.","Fendez les branches mortes de la grosseur du poignet : le cœur est sec. Taillez des bâtons à plumes avec ce bois intérieur.","Construisez une plateforme de bâtons secs pour isoler le feu du sol détrempé.","Allumez avec votre meilleur amadou, puis ajoutez beaucoup de petit bois très fin avant de monter en taille.","Faites sécher le bois suivant autour du feu, en cercle, avant de l'ajouter."],
tips:["Gardez toujours un amadou de réserve dans un sachet étanche, réservé aux urgences.","La résine de pin s'enflamme comme de la cire et prolonge la flamme d'allumage."],
warn:["N'utilisez jamais d'essence pour démarrer un feu : risque d'explosion et de brûlures graves."]},
{id:"allumages-urgence",cat:"feu",art:"m_loupe",t:"Allumages d'urgence : loupe, pile, paille de fer",diff:2,time:"5 à 15 min",
s:"Sans briquet ni allumettes : utiliser le soleil ou une pile pour produire une braise.",
mat:["Loupe, verre de lunettes de presbyte, bouteille d'eau transparente ou sac plastique rempli d'eau","Ou pile (9 V idéalement) et paille de fer très fine","Amadou très fin et sec, de couleur sombre"],
steps:["SOLEIL : par temps ensoleillé, tenez la lentille entre le soleil et l'amadou.","Rapprochez ou éloignez-la jusqu'à obtenir le point lumineux le plus petit et le plus intense.","Gardez-le immobile ; l'amadou fume puis rougeoie : soufflez doucement et transférez-le dans le nid.","Une bouteille transparente pleine d'eau ou un sac plastique rempli d'eau et bien rond peuvent servir de lentille.","PILE : étirez un tampon de paille de fer fine (grade 0000) pour l'aérer.","Frottez les deux bornes de la pile 9 V contre la paille de fer : elle s'embrase instantanément.","Avec une pile ronde, reliez ses deux pôles à travers un brin de paille de fer.","Posez immédiatement la paille incandescente sur un nid d'amadou et soufflez."],
tips:["Noircir l'amadou avec du charbon augmente l'absorption de la chaleur du soleil.","La paille de fer s'enflamme même mouillée après avoir été essorée."],
warn:["Ne transportez jamais la paille de fer avec la pile dans la même poche : risque d'inflammation spontanée."]},
{id:"feu-etoile",cat:"feu",art:"m_etoile",t:"Feu longue durée (feu en étoile)",diff:1,time:"15 min",
s:"Un feu qui tient toute la nuit avec peu de surveillance et qui économise le bois.",
mat:["5 à 6 grosses bûches","Feu de base allumé"],
steps:["Allumez un feu classique et laissez-le former un bon lit de braises.","Disposez 5 ou 6 grosses bûches en étoile, leurs extrémités se rejoignant au centre des braises.","Seules les extrémités brûlent : le feu reste petit et régulier.","Pour l'augmenter, poussez les bûches vers le centre ; pour le réduire, écartez-les.","Avant de dormir, poussez-les légèrement : le feu durera plusieurs heures.","Variante : la bûche suédoise. Une grosse bûche debout, fendue en 4 jusqu'aux 2/3, allumée au centre : elle brûle 1 à 3 heures et sert de réchaud."],
tips:["Un feu en étoile entre deux personnes allongées tête-bêche permet de chauffer les deux côtés."],
warn:["Dégagez une zone large autour du feu avant de dormir et gardez de l'eau ou de la terre à portée."]},
{id:"transporter-braise",cat:"feu",art:"m_braise",t:"Transporter le feu",diff:2,time:"Préparation 15 min",
s:"Conserver une braise vivante pour rallumer un feu au prochain camp, comme les peuples nomades.",
mat:["Amadouvier (champignon des arbres) ou bois pourri sec (« punk wood »)","Mousse ou herbe sèche","Récipient : boîte métallique percée, écorce, corne"],
steps:["Récoltez un amadouvier (champignon en sabot sur les bouleaux et hêtres morts) ou un morceau de bois pourri très sec.","Placez une braise contre le champignon ou le bois jusqu'à ce qu'il rougeoie.","Enveloppez-le dans de la mousse ou de l'herbe sèche, sans l'étouffer.","Placez l'ensemble dans une boîte percée de quelques trous ou un rouleau d'écorce.","Vérifiez régulièrement la braise et soufflez légèrement si elle faiblit.","Au camp suivant, posez la braise dans un nid d'amadou et soufflez jusqu'à la flamme."],
tips:["Un amadouvier peut couver plusieurs heures.","Le tissu carbonisé (char cloth) préparé à l'avance prend aussi la moindre étincelle."],
warn:["Ne transportez jamais une braise dans une poche ou un sac contenant des matières inflammables."]},

/* EAU */
{id:"eau-maison",cat:"eau",art:"m_urbain",t:"Trouver de l'eau dans sa maison",diff:1,time:"15 à 30 min",
s:"En cas de coupure du réseau, une maison contient souvent plus de 100 litres d'eau utilisables.",
mat:["Récipients propres","Tuyau ou seau","Pastilles ou moyen de faire bouillir"],
steps:["BALLON D'EAU CHAUDE : coupez son alimentation électrique ou gaz, fermez l'arrivée d'eau froide et laissez refroidir.","Ouvrez un robinet d'eau chaude à l'étage pour laisser entrer l'air, puis vidangez le ballon par la vanne de purge en bas.","Laissez reposer les dépôts éventuels et purifiez l'eau avant de la boire.","Conduites : ouvrez le robinet le plus haut de la maison puis récupérez l'eau au robinet le plus bas.","Réservoir de chasse d'eau (pas la cuvette) : utilisable après purification, sauf s'il contient des pastilles nettoyantes.","Glaçons du congélateur, conserves de légumes (le jus), eau de pluie récupérée.","Dès l'annonce d'une coupure, remplissez baignoire, casseroles et bouteilles."],
tips:["Repérez dès aujourd'hui la vanne de purge de votre ballon et notez-la dans votre fiche d'urgence."],
warn:["N'utilisez jamais l'eau des radiateurs, du chauffage central, des piscines traitées ou des aquariums pour boire."]},
{id:"dessaler",cat:"eau",art:"m_dessal",t:"Dessaler l'eau de mer",diff:2,time:"1 à 3 h",
s:"La distillation est la seule méthode improvisée pour rendre l'eau de mer buvable.",
mat:["Récipient métallique","Couvercle, bâche ou tissu","Récipient de collecte","Feu ou soleil intense","Tuyau (facultatif)"],
steps:["Faites bouillir l'eau de mer dans un récipient : le sel reste au fond, seule la vapeur s'échappe.","Captez la vapeur : couvercle incliné vers un récipient, ou tissu propre tendu au-dessus de la casserole.","Récupérez les gouttes de condensation qui coulent du couvercle, ou essorez régulièrement le tissu dans un récipient.","Avec un tuyau partant d'un couvercle étanche, la vapeur se condense dans le tuyau refroidi (passé dans de l'eau froide ou du sable mouillé).","Sans feu : l'alambic solaire fonctionne aussi avec de l'eau de mer versée dans le trou.","Goûtez : l'eau obtenue ne doit pas avoir de goût salé."],
tips:["Le sel restant au fond peut être récupéré pour conserver la viande et le poisson."],
warn:["Ne buvez JAMAIS d'eau de mer, même mélangée : elle accélère la déshydratation et peut tuer.","Le rendement est faible : prévoyez beaucoup de combustible."]},
{id:"deshydratation",cat:"eau",art:"m_deshyd",t:"Reconnaître et traiter la déshydratation",diff:1,time:"Surveillance continue",
s:"Perdre 2 % de son eau diminue déjà les performances ; au-delà, confusion et malaise surviennent.",
mat:["Eau potable","Sucre et sel (solution de réhydratation)"],
steps:["Surveillez la couleur de l'urine : jaune clair = correct, foncée = boire, très foncée ou absence d'urine = urgence.","Autres signes : soif, bouche sèche, maux de tête, fatigue, vertiges, crampes, confusion.","Buvez par petites gorgées régulières plutôt que de grandes quantités d'un coup.","SOLUTION DE RÉHYDRATATION (recette de l'OMS) : 1 litre d'eau potable + 6 cuillères à café rases de sucre + 1/2 cuillère à café rase de sel.","Mettez la personne à l'ombre, au repos, et rafraîchissez-la.","En cas de diarrhée ou de vomissements, donnez la solution par petites quantités très fréquentes."],
tips:["Rationnez la transpiration, pas l'eau : reposez-vous aux heures chaudes, travaillez à la fraîche.","Le café et l'alcool augmentent la perte d'eau."],
warn:["Confusion, absence d'urine, pouls rapide chez un enfant ou une personne âgée : appelez les secours (112)."]},
{id:"stocker-eau",cat:"eau",art:"m_stock",t:"Stocker l'eau à long terme",diff:1,time:"30 min",
s:"Constituer et entretenir une réserve d'eau sûre à la maison.",
mat:["Bouteilles d'eau du commerce","Bidons alimentaires (5–20 L)","Javel non parfumée","Étiquettes et marqueur"],
steps:["Le plus simple : bouteilles d'eau du commerce, à consommer avant la date indiquée.","Pour l'eau du robinet : utilisez des bidons de qualité alimentaire, nettoyés et rincés.","Remplissez-les à ras bord directement au robinet, fermez hermétiquement.","Étiquetez avec la date de remplissage.","Stockez dans un endroit frais, sombre, loin des produits chimiques, de l'essence et des sources de chaleur.","Renouvelez l'eau du robinet stockée tous les 6 mois.","Utilisez vos réserves régulièrement (premier entré, premier sorti) et remplacez-les aussitôt."],
tips:["Plusieurs petits contenants valent mieux qu'un seul gros : plus faciles à transporter et moins de pertes en cas de fuite.","Utilisez le calculateur de réserves de l'onglet Préparer pour connaître la quantité adaptée à votre foyer."],
warn:["N'utilisez jamais d'anciens bidons de lait (impossibles à nettoyer parfaitement) ni de contenants ayant contenu des produits chimiques."]},

/* NOURRITURE */
{id:"plantes-comestibles",cat:"nourriture",art:"m_comest",t:"10 plantes sauvages comestibles d'Europe",diff:2,time:"Apprentissage",
s:"Les plantes faciles à reconnaître et répandues, à apprendre AVANT d'en avoir besoin.",
mat:["Guide botanique illustré","Sac ou panier","Gants (orties)"],
steps:["ORTIE : jeunes pousses (4 à 6 feuilles du haut), toujours cuites ou ébouillantées. Très riche en protéines et en fer.","PISSENLIT : feuilles en salade, fleurs crues, racines grillées. Toute la plante est comestible.","PLANTAIN (majeur et lancéolé) : jeunes feuilles crues ou cuites. Ses feuilles écrasées soulagent aussi les piqûres.","MÛRES ET FRAMBOISES SAUVAGES : faciles à identifier, à consommer bien mûres.","CHÂTAIGNES : bogue très piquante à nombreuses épines fines. À cuire. À ne pas confondre avec le marron d'Inde (toxique).","NOISETTES : riches en graisses et en énergie, à l'automne.","GLANDS : riches en calories mais amers ; décortiqués, concassés et trempés dans plusieurs eaux (souvent bouillantes) jusqu'à disparition de l'amertume, puis grillés.","CYNORHODONS (fruits de l'églantier) : très riches en vitamine C ; retirez les graines et leurs poils irritants.","TRÈFLE : fleurs et jeunes feuilles, de préférence cuites.","AIL DES OURS : forte odeur d'ail ; à ne cueillir que si vous êtes absolument certain de l'identification."],
tips:["Cueillez loin des routes, des champs traités et des zones de déjections animales.","Lavez soigneusement et cuisez en cas de doute (parasites comme l'échinococcose)."],
warn:["L'ail des ours se confond avec le muguet et le colchique, MORTELS. L'odeur reste sur les doigts et peut tromper.","Ne mangez jamais une plante identifiée à 90 % : il faut 100 %."]},
{id:"plantes-mortelles",cat:"nourriture",art:"m_mortel",t:"Plantes et champignons mortels à connaître",diff:1,time:"Apprentissage",
s:"Connaître les plantes à ne jamais toucher est aussi important que connaître celles qui se mangent.",
mat:["Guide botanique illustré"],
steps:["CIGUË (grande ciguë, ciguë aquatique) : ombellifère à fleurs blanches en ombrelle, tige tachée de pourpre, odeur de souris. Mortelle. Évitez toutes les plantes en ombrelle blanche.","ŒNANTHE SAFRANÉE : bord des eaux, racines en tubercules ; parmi les plantes les plus toxiques d'Europe.","IF : arbuste à aiguilles plates et fruits rouges ; aiguilles et graines mortelles.","DIGITALE : grandes fleurs en clochettes pourpres ; toxique pour le cœur.","MUGUET et COLCHIQUE : se confondent avec l'ail des ours ; mortels.","BELLADONE : baies noires brillantes ; très toxique.","LAURIER-ROSE : toutes les parties, y compris la fumée et le bois utilisé pour les broches.","ACONIT : fleurs bleu-violet en casque ; toxique même au toucher prolongé.","AMANITE PHALLOÏDE : champignon responsable de la majorité des décès ; symptômes retardés de 6 à 24 h."],
tips:["Règles générales de prudence : évitez sève laiteuse, plantes en ombrelle, baies blanches ou jaunes, odeur d'amande amère.","En cas d'ingestion suspecte : Centre Antipoisons 070 245 245 (Belgique) ou 112."],
warn:["Ne mangez aucun champignon sauvage en situation de survie : l'apport calorique est faible et le risque mortel."]},
{id:"marmite-norvegienne",cat:"nourriture",art:"m_norv",t:"Cuisson passive (marmite norvégienne)",diff:1,time:"10 min + 1 à 3 h",
s:"Cuire riz, légumineuses ou ragoûts en économisant jusqu'à 70 % de combustible. Idéal en cas de pénurie de gaz.",
mat:["Casserole avec couvercle","Caisse, glacière ou panier","Isolants : couvertures, coussins, sac de couchage, paille, journaux"],
steps:["Portez le plat à ébullition et laissez bouillir quelques minutes (5 min pour le riz, 10–15 min pour les légumineuses préalablement trempées).","Préparez la caisse : tapissez le fond et les côtés d'une épaisse couche d'isolant.","Placez rapidement la casserole fermée au centre, sans soulever le couvercle.","Recouvrez entièrement d'isolant, fermez la caisse.","Laissez cuire : 1 h pour le riz, 2 à 3 h pour les légumineuses et ragoûts.","Si la cuisson n'est pas terminée, remettez à bouillir quelques minutes et replacez dans la caisse."],
tips:["Un sac de couchage enroulé autour d'une casserole fonctionne très bien.","Plus la casserole est pleine, mieux elle garde la chaleur."],
warn:["Les plats contenant de la viande doivent rester au-dessus de 60 °C : refaites bouillir avant de servir si la cuisson a duré longtemps."]},
{id:"rationner",cat:"nourriture",art:"m_ration",t:"Rationner eau et nourriture",diff:1,time:"Planification",
s:"Faire durer ses réserves sans mettre sa santé en danger.",
mat:["Inventaire des réserves","Papier et crayon"],
steps:["Faites l'inventaire de toutes les réserves d'eau et de nourriture du groupe.","Estimez la durée probable avant les secours ou le rétablissement des services.","Divisez la nourriture en rations quotidiennes, en gardant une petite réserve de secours.","Ne rationnez pas l'eau en dessous de vos besoins : buvez ce dont vous avez besoin et réduisez plutôt la transpiration (repos, ombre).","Si l'eau est très limitée, mangez peu, privilégiez les glucides (biscuits, céréales) et évitez les aliments salés et riches en protéines qui augmentent la soif.","Mangez d'abord les aliments périssables (frigo), puis le congélateur, puis les conserves.","Réduisez les efforts inutiles pour diminuer les besoins."],
tips:["Partager équitablement et en toute transparence évite les tensions dans un groupe.","Enfants, femmes enceintes et malades doivent être prioritaires."],
warn:["Ne réduisez jamais drastiquement l'eau d'un enfant ou d'une personne âgée : ils se déshydratent plus vite."]},

/* CONSERVATION */
{id:"frigo-desert",cat:"conservation",art:"m_zeer",t:"Frigo sans électricité (pot-in-pot)",diff:1,time:"30 min",
s:"Le « zeer » : deux pots de terre et du sable humide refroidissent les aliments par évaporation.",
mat:["2 pots en terre cuite non vernissée (un grand, un plus petit)","Sable","Eau","Tissu humide"],
steps:["Bouchez le trou du fond des pots (argile, bouchon, tissu).","Versez une couche de sable au fond du grand pot.","Placez le petit pot à l'intérieur, centré.","Remplissez l'espace entre les deux pots de sable.","Arrosez le sable jusqu'à saturation.","Placez les aliments dans le petit pot et couvrez d'un tissu humide.","Installez l'ensemble à l'ombre, dans un endroit sec et aéré ; arrosez le sable une à deux fois par jour."],
tips:["Fonctionne d'autant mieux que l'air est chaud et sec.","Idéal pour légumes et fruits, qui se gardent plusieurs jours de plus."],
warn:["Ne remplace pas un réfrigérateur pour la viande, le poisson ou les produits laitiers."]},
{id:"secher-fruits",cat:"conservation",art:"m_fruits",t:"Sécher fruits et légumes",diff:1,time:"1 à 4 jours",
s:"Pommes, champignons de culture, tomates, herbes : se conservent des mois une fois séchés.",
mat:["Couteau","Claie : grille, cadre de bois avec moustiquaire, fil tendu","Tissu fin contre les insectes","Citron (facultatif)"],
steps:["Lavez et coupez en tranches fines et régulières (5 mm environ).","Trempez les pommes et poires dans de l'eau citronnée pour limiter le brunissement.","Disposez les tranches sur la claie sans qu'elles se touchent.","Placez au soleil, dans un endroit aéré, couvert d'un tissu fin contre les insectes. Rentrez la nuit (humidité).","Retournez les tranches une fois par jour.","Alternative : au-dessus d'un feu (pas de flammes), dans un four à très basse température porte entrouverte.","Les fruits sont prêts quand ils sont souples et sans humidité au cœur ; les légumes, quand ils sont cassants.","Stockez dans des bocaux ou sachets fermés, au sec."],
tips:["Les herbes aromatiques se sèchent simplement en bouquets, tête en bas, à l'ombre."],
warn:["Toute trace de moisissure : jetez le lot entier."]},
{id:"bocaux",cat:"conservation",art:"m_bocal",t:"Conserves en bocaux",diff:2,time:"2 à 3 h",
s:"Stériliser des aliments en bocaux pour les conserver plus d'un an. Avec des règles de sécurité strictes.",
mat:["Bocaux en verre avec joints neufs","Grande marmite","Torchon","Pince","Pour les aliments peu acides : autocuiseur-stérilisateur"],
steps:["Lavez et ébouillantez bocaux et couvercles ; utilisez toujours des joints neufs.","Remplissez avec les aliments préparés en laissant 1 à 2 cm de vide en haut.","Essuyez le bord, fermez hermétiquement.","Placez les bocaux dans la marmite sur un torchon, recouverts d'eau d'au moins 3 cm.","ALIMENTS ACIDES (fruits, confitures, tomates avec un peu de jus de citron) : stérilisez à ébullition selon une recette fiable (souvent 20 à 60 minutes).","ALIMENTS PEU ACIDES (légumes, viande, poisson) : uniquement avec un stérilisateur sous pression atteignant 116 à 121 °C.","Laissez refroidir, vérifiez que le couvercle est bien aspiré (ne bouge plus), étiquetez avec la date.","Stockez au frais, à l'abri de la lumière."],
tips:["Suivez des temps de stérilisation issus d'une source fiable, adaptés à la taille des bocaux."],
warn:["Risque de botulisme, maladie souvent mortelle, avec les légumes et viandes mal stérilisés.","Couvercle bombé, liquide trouble, bulles, odeur anormale : jetez sans goûter."]},

/* PIÈGES & CHASSE */
{id:"traces",cat:"pieges",art:"m_traces",t:"Lire les traces et indices",diff:2,time:"Observation",
s:"Savoir quels animaux sont présents, où ils passent et à quel moment, avant de poser le moindre piège.",
mat:["Yeux et patience","Bâton pour mesurer"],
steps:["Cherchez les coulées : petits sentiers tassés dans l'herbe, passages sous les clôtures, trouées dans les haies.","Observez les empreintes dans la boue, le sable et la neige, surtout près de l'eau.","LAPIN / LIÈVRE : deux grandes empreintes postérieures côte à côte, devant deux petites antérieures l'une derrière l'autre.","CHEVREUIL, CERF : sabot fendu en forme de cœur ; SANGLIER : sabot plus arrondi avec les ergots souvent visibles.","RENARD : empreintes ovales alignées en ligne presque droite.","Indices : crottes (fraîches = brillantes et humides), poils accrochés, écorces rongées, terre retournée (sanglier).","Repérez les zones de nourriture, d'eau et de repos : les animaux circulent entre elles à l'aube et au crépuscule."],
tips:["Une empreinte aux bords nets et humides est récente ; une empreinte effritée ou remplie de débris est ancienne."],
warn:["Le sanglier peut être dangereux, surtout une laie avec ses petits : éloignez-vous calmement."]},
{id:"paiute",cat:"pieges",art:"m_paiute",t:"Assommoir Paiute",diff:3,time:"30 à 45 min",
s:"Variante de l'assommoir plus sensible que le « figure 4 », adaptée aux petits rongeurs.",
mat:["Pierre plate lourde","Bâton vertical (≈ 20 cm)","Levier (≈ 25 cm)","Cordelette de 10 cm","Petit bâton-clé (≈ 5 cm)","Baguette d'appât fine et longue"],
steps:["Taillez une encoche au sommet du bâton vertical pour qu'il supporte le levier.","Attachez la cordelette à une extrémité du levier et le petit bâton-clé à l'autre bout de la cordelette.","Posez la pierre inclinée, son bord reposant sur l'extrémité libre du levier, lui-même posé en équilibre sur le bâton vertical.","Enroulez la cordelette une demi-fois autour du bâton vertical.","Coincez le bâton-clé entre le bâton vertical et l'extrémité de la baguette d'appât, l'autre extrémité de la baguette appuyée sous le bord de la pierre.","Au moindre contact sur la baguette appâtée, le bâton-clé se libère et la pierre tombe."],
tips:["Plus sensible que le figure 4 : idéal pour les souris et petits rongeurs."],
warn:["Gardez toujours les mains hors de la zone de chute pendant l'armement.","Réservé aux situations de survie : le piégeage est réglementé."]},
{id:"petites-proies",cat:"pieges",art:"m_proies",t:"Escargots, écrevisses et petites proies",diff:1,time:"Variable",
s:"Des protéines faciles à ramasser à la main, sans piège ni arme.",
mat:["Seau ou sac","Lampe (de nuit)","Feu pour la cuisson"],
steps:["ESCARGOTS : ramassez-les par temps humide ou après la pluie, tôt le matin.","Faites-les jeûner 5 à 7 jours dans un récipient aéré pour qu'ils évacuent les plantes toxiques éventuellement consommées.","Ébouillantez-les plusieurs minutes, retirez-les de la coquille et cuisez-les à nouveau.","ÉCREVISSES : sous les pierres des ruisseaux, de nuit à la lampe ; attrapez-les par l'arrière du corps.","Cuisez-les entières à l'eau bouillante jusqu'à ce qu'elles deviennent rouges.","VERS DE TERRE et LARVES : voir la fiche Insectes comestibles."],
tips:["Une nasse en bouteille appâtée avec un morceau de viande ou de poisson attire les écrevisses."],
warn:["Ne consommez jamais d'escargots, coquillages ou écrevisses crus : risques de parasites graves.","Plusieurs espèces sont protégées (écrevisses indigènes, grenouilles) : vérifiez la réglementation hors situation de survie."]},

/* PÊCHE */
{id:"vider-poisson",cat:"peche",art:"m_poisson",t:"Vider et préparer un poisson",diff:1,time:"5 à 10 min",
s:"Préparer le poisson rapidement après la prise, pour éviter qu'il ne s'abîme.",
mat:["Couteau aiguisé","Eau propre","Bâton ou pierre plate"],
steps:["Assommez le poisson d'un coup sec sur la tête dès la capture.","Vérifiez sa fraîcheur : ouïes rouges, yeux brillants, chair ferme, pas d'odeur forte.","Écaillez en grattant de la queue vers la tête avec le dos du couteau (inutile pour la truite).","Incisez le ventre de l'orifice anal jusqu'aux ouïes, sans enfoncer la lame trop profondément.","Retirez les viscères avec les doigts, puis grattez la ligne sombre (le sang) le long de l'arête centrale.","Rincez à l'eau propre.","Cuisez entier embroché, en papillote, sur une pierre chaude, ou ouvert à plat près du feu."],
tips:["Les petits poissons (moins de 5 cm) peuvent être cuits entiers sans être vidés.","Les viscères servent d'appât pour la pêche suivante ou les écrevisses."],
warn:["Ne mangez pas de poisson cru ou insuffisamment cuit en eau douce : risque de parasites.","Évitez les poissons à l'aspect anormal, à l'odeur suspecte, ou pêchés près de rejets industriels."]},
{id:"lire-riviere",cat:"peche",art:"m_riviere",t:"Lire la rivière : où sont les poissons",diff:1,time:"Observation",
s:"Les poissons ne sont pas n'importe où : ils cherchent abri, nourriture et économie d'énergie.",
mat:["Observation","Lunettes de soleil polarisées (idéal)"],
steps:["Derrière les obstacles (rochers, troncs) : le poisson se repose dans le contre-courant en attendant la nourriture.","Dans les fosses profondes et les zones plus calmes, surtout par forte chaleur.","Le long des berges creusées et sous la végétation qui surplombe l'eau (ombre et insectes).","À la limite entre courant rapide et eau calme (veine d'eau).","À l'entrée et à la sortie des rapides, très oxygénées.","Aux confluences de deux cours d'eau.","Moments idéaux : aube et crépuscule, avant un orage, par temps couvert."],
tips:["Approchez sans bruit et sans projeter votre ombre sur l'eau.","Observez les gobages (ronds à la surface) : ils trahissent des poissons qui se nourrissent."],
warn:["Ne marchez pas dans un courant rapide au-dessus du genou : risque d'être emporté."]},
{id:"filet-maillant",cat:"peche",art:"m_filet",t:"Filet maillant improvisé",diff:3,time:"2 à 4 h",
s:"Un filet tendu qui piège les poissons par les ouïes. Technique décrite dans les manuels de survie militaires.",
mat:["Cordelette : brins intérieurs de paracorde, fil de pêche, fibres","2 piquets","Flotteurs (bois sec, bouteilles)","Lests (pierres)"],
steps:["Tendez une cordelette maîtresse entre deux arbres à hauteur de travail.","Attachez des brins verticaux espacés régulièrement le long de la cordelette maîtresse.","Nouez chaque brin à son voisin avec un nœud simple pour former des mailles en losange.","Taille des mailles : 2,5 à 4 cm pour des poissons moyens.","Fixez une ligne de flotteurs en haut et une ligne de lests en bas.","Tendez le filet dans l'eau entre deux piquets, légèrement en biais par rapport au courant, dans une zone calme.","Relevez-le plusieurs fois par jour."],
tips:["Les 7 brins internes d'une paracorde de 15 m fournissent une grande longueur de fil pour le filet."],
warn:["Strictement interdit en temps normal : réservé aux situations de survie.","Retirez-le impérativement en partant : il continuerait à piéger poissons et oiseaux."]},

/* OUTILS */
{id:"aiguiser",cat:"outils",art:"m_aiguiser",t:"Aiguiser un couteau sur une pierre",diff:1,time:"10 à 20 min",
s:"Un couteau émoussé est dangereux et épuisant. Comment le réaffûter, même avec une pierre de rivière.",
mat:["Pierre à aiguiser, ou galet de rivière à grain fin et plat","Eau","Ceinture en cuir (facultatif)"],
steps:["Mouillez la pierre (ou huilez-la selon le type).","Posez la lame à environ 20° de la pierre : environ l'épaisseur de deux pièces de monnaie sous le dos de la lame.","Poussez la lame comme si vous vouliez couper une fine tranche de la pierre, du talon à la pointe.","Faites le même nombre de passages sur chaque face.","Passez votre pouce perpendiculairement au fil (sans glisser le long) : un léger « morfil » doit se former.","Terminez sur un grain plus fin puis par quelques passages alternés très légers.","Affilez sur une ceinture en cuir, dos de la lame vers l'avant."],
tips:["Gardez un angle constant : c'est plus important que la pression.","Le fond non émaillé d'une tasse en céramique sert aussi de pierre fine."],
warn:["Coupez toujours en éloignant la lame de votre corps."]},
{id:"batonnage",cat:"outils",art:"m_baton",t:"Fendre du bois sans hache (bâtonnage)",diff:2,time:"10 min",
s:"Fendre du bois avec un couteau et un bâton pour accéder au bois sec du cœur.",
mat:["Couteau solide à lame fixe (soie pleine)","Bâton de frappe en bois dur","Bûches de 5 à 10 cm de diamètre"],
steps:["Posez la bûche verticalement sur une surface stable (souche, gros rondin), jamais sur le sol mou.","Placez la lame au centre du sommet de la bûche, perpendiculaire aux fibres, la pointe dépassant de l'autre côté.","Frappez le dos de la lame avec le bâton, par coups secs et contrôlés.","Quand la lame est enfoncée, frappez la pointe qui dépasse pour la faire descendre à plat.","Continuez jusqu'à ce que la bûche se fende.","Refendez les moitiés pour obtenir du petit bois et des bâtons à plumes."],
tips:["Choisissez des bûches sans nœuds : elles fendent beaucoup plus facilement."],
warn:["Jamais avec un couteau pliant : il peut se refermer ou casser.","Gardez les jambes hors de la trajectoire de la lame."]},
{id:"colle-resine",cat:"outils",art:"m_resine",t:"Colle de résine de pin",diff:2,time:"30 min",
s:"Une colle et un mastic d'étanchéité fabriqués avec de la résine et du charbon.",
mat:["Résine de pin, d'épicéa ou de sapin","Charbon de bois broyé finement","Récipient métallique ou pierre creuse","Bâton"],
steps:["Récoltez la résine durcie qui suinte des blessures des conifères.","Faites-la fondre doucement près des braises, sans flamme directe.","Ajoutez environ 1 part de poudre de charbon pour 3 parts de résine ; mélangez.","Facultatif : ajoutez quelques fibres végétales hachées pour la rendre moins cassante.","Enroulez le mélange chaud autour d'un bâton pour le stocker.","Pour l'utiliser, réchauffez le bâton et appliquez la colle sur les pièces à assembler."],
tips:["Usages : fixer une pointe ou une lame sur un manche, étanchéifier un récipient, réparer une bâche ou une chaussure."],
warn:["La résine est très inflammable : ne la chauffez jamais directement au-dessus des flammes."]},
{id:"lampe-graisse",cat:"outils",art:"m_lampe",t:"Lampe à huile ou à graisse",diff:1,time:"10 min",
s:"Une lumière durable avec de la graisse ou de l'huile de cuisine, en pleine nature comme en cas de panne.",
mat:["Récipient non inflammable : coquillage, boîte de conserve, pierre creuse, bol","Huile végétale ou graisse animale fondue","Mèche : bande de coton, ficelle, mousse sèche"],
steps:["Préparez une mèche en coton torsadé de quelques centimètres.","Remplissez le récipient d'huile ou de graisse fondue.","Trempez entièrement la mèche, puis laissez dépasser 1 cm à l'air libre.","Maintenez-la avec un petit support (morceau de fil de fer, rondelle percée, petit bâton fendu).","Allumez l'extrémité de la mèche.","Recoupez ou remontez la mèche pour obtenir une petite flamme sans fumée."],
tips:["Une orange coupée en deux avec la tige centrale comme mèche, remplie d'huile, fait une lampe originale.","Une bougie dans un bocal est plus sûre à l'intérieur."],
warn:["Ne laissez jamais une flamme sans surveillance et éloignez-la des tissus et rideaux."]},

/* ORIENTATION */
{id:"carte-boussole",cat:"orientation",art:"m_carte",t:"Carte et boussole : prendre un azimut",diff:2,time:"10 min",
s:"La compétence de base de la navigation militaire : suivre une direction précise sans GPS.",
mat:["Carte topographique (1:25 000 idéal)","Boussole à plaquette"],
steps:["Orientez la carte : posez la boussole dessus, faites tourner la carte jusqu'à ce que le nord de la carte coïncide avec l'aiguille.","Placez le bord de la plaquette entre votre position et votre destination, flèche de direction vers la destination.","Tournez le cadran jusqu'à ce que ses lignes nord-sud soient parallèles aux lignes nord de la carte.","Lisez l'azimut (en degrés) au repère de lecture.","Tenez la boussole à plat devant vous, tournez sur vous-même jusqu'à ce que l'aiguille aimantée soit dans la flèche du cadran.","La flèche de direction indique votre route : visez un repère lointain dans cette direction et marchez jusqu'à lui.","Répétez avec un nouveau repère."],
tips:["En Europe de l'Ouest, la déclinaison magnétique est faible (quelques degrés) : elle peut souvent être négligée sur de courtes distances.","Éloignez la boussole des objets métalliques et des téléphones."],
warn:["Entraînez-vous sur un terrain connu avant de vous fier à cette technique."]},
{id:"tenir-cap",cat:"orientation",art:"m_cap",t:"Marcher droit et compter ses pas",diff:1,time:"Entraînement",
s:"Sans repère, l'être humain tourne en rond. Les méthodes pour garder une direction et estimer la distance.",
mat:["Boussole ou direction connue","Petits cailloux ou nœuds sur une cordelette"],
steps:["Choisissez un repère lointain dans votre direction (arbre, rocher) et marchez jusqu'à lui ; recommencez.","En forêt dense, alignez deux repères l'un derrière l'autre pour garder l'axe.","Étalonnez votre pas : comptez combien de doubles pas il vous faut pour 100 m sur terrain plat (souvent 60 à 65).","Tous les 100 m, transférez un caillou d'une poche à l'autre ou faites un nœud sur une cordelette.","Corrigez : en montée, en terrain difficile ou de nuit, le pas raccourcit.","Visée décalée : pour rejoindre un point sur une route ou une rivière, visez volontairement un peu à côté ; vous saurez de quel côté tourner en l'atteignant."],
tips:["Laissez des marques discrètes (branches cassées, cairns) pour pouvoir revenir sur vos pas."],
warn:["Par mauvaise visibilité, restez sur place plutôt que de marcher au hasard."]},
{id:"indices-naturels",cat:"orientation",art:"m_indices",t:"Indices naturels (et leurs limites)",diff:1,time:"Observation",
s:"Mousse, fourmilières, arbres, églises : ce qui fonctionne, et ce qui est un mythe.",
mat:["Observation"],
steps:["MOUSSE : elle pousse là où c'est humide et ombragé, pas forcément au nord. Indice peu fiable seul.","ARBRES ISOLÉS (hémisphère nord) : branches souvent plus fournies côté sud, plus ensoleillé.","VENT DOMINANT : en Belgique et en France, il vient souvent de l'ouest ou du sud-ouest ; les arbres exposés penchent vers l'est.","NEIGE : elle fond plus vite sur les pentes exposées au sud.","ÉGLISES ANCIENNES : le chœur est traditionnellement orienté vers l'est (pas toujours exactement).","ANTENNES SATELLITE en Europe : elles pointent généralement vers le sud ou le sud-est.","Combinez toujours plusieurs indices et confirmez avec le soleil ou les étoiles."],
tips:["Le soleil se lève à l'est et se couche à l'ouest ; à midi solaire, il est plein sud dans l'hémisphère nord."],
warn:["Aucun indice naturel n'est fiable à lui seul : ne prenez jamais de décision importante sur un seul indice."]},
{id:"temps-avant-nuit",cat:"orientation",art:"m_doigts",t:"Estimer le temps avant la nuit",diff:1,time:"30 secondes",
s:"Savoir combien de temps il reste avant le coucher du soleil pour décider : continuer ou construire un abri.",
mat:["Votre main"],
steps:["Tendez le bras devant vous, main à plat, doigts serrés et horizontaux.","Placez le petit doigt sur la ligne d'horizon.","Comptez combien de doigts séparent l'horizon du bas du soleil, en empilant les mains si nécessaire.","Chaque doigt représente environ 15 minutes ; une main (4 doigts) environ 1 heure.","Retirez une marge : en forêt ou en montagne, l'obscurité arrive plus tôt que le coucher réel.","S'il reste moins de 2 heures, arrêtez-vous et préparez le bivouac."],
tips:["La précision varie avec la latitude et la saison, mais l'estimation suffit pour décider."],
warn:["Ne regardez jamais le soleil directement : visez à côté."]},

/* PREMIERS SECOURS */
{id:"pls",cat:"secours",art:"m_pls",t:"Position latérale de sécurité (PLS)",diff:1,time:"1 min",
s:"Pour une personne inconsciente qui respire : garder les voies respiratoires libres.",
mat:["Rien"],
steps:["Vérifiez la conscience (parlez fort, touchez les épaules) et la respiration (regardez, écoutez, sentez pendant 10 secondes).","Si elle respire normalement : appelez le 112.","Placez le bras le plus proche de vous à angle droit, paume vers le haut.","Posez le dos de l'autre main contre sa joue, de votre côté, et maintenez-la.","Relevez le genou opposé, pied au sol.","Tirez sur ce genou pour faire rouler la personne vers vous, sur le côté.","Ajustez la jambe du dessus à angle droit et basculez légèrement la tête en arrière, bouche vers le sol.","Surveillez la respiration en continu ; couvrez la personne."],
tips:["Si la personne arrête de respirer normalement : remettez-la sur le dos et commencez la réanimation (RCP)."],
warn:["En cas de traumatisme important (chute, accident), ne la bougez que si elle risque de s'étouffer ou si elle est en danger."]},
{id:"rcp",cat:"secours",art:"m_rcp",t:"Réanimation cardio-pulmonaire (RCP)",diff:2,time:"Jusqu'à l'arrivée des secours",
s:"Une personne inconsciente qui ne respire pas normalement : chaque minute sans massage réduit ses chances de survie.",
mat:["Défibrillateur automatique (DAE) si disponible"],
steps:["Sécurisez la zone ; vérifiez la conscience et la respiration (10 secondes maximum).","Pas de respiration normale : appelez le 112 (mettez le haut-parleur) et faites chercher un défibrillateur.","Placez la personne sur le dos, sur une surface dure.","Mains l'une sur l'autre au centre de la poitrine, bras tendus, épaules à la verticale.","Comprimez fort : 5 à 6 cm de profondeur, à un rythme de 100 à 120 par minute (rythme de « Stayin' Alive »), en laissant la poitrine remonter.","Si vous êtes formé : 30 compressions puis 2 insufflations. Sinon, faites des compressions en continu.","Dès que le DAE arrive : allumez-le et suivez ses instructions vocales.","Ne vous arrêtez pas jusqu'à l'arrivée des secours ou la reprise d'une respiration normale ; relayez-vous toutes les 2 minutes si possible."],
tips:["Il vaut mieux masser sans être sûr que ne rien faire : la RCP ne peut pas aggraver un arrêt cardiaque.","Le régulateur du 112 peut vous guider au téléphone."],
warn:["Suivez une formation de premiers secours : rien ne remplace la pratique sur mannequin."]},
{id:"etouffement",cat:"secours",art:"m_heimlich",t:"Étouffement (claques dans le dos, Heimlich)",diff:1,time:"Immédiat",
s:"Un corps étranger bloque les voies respiratoires : agir en quelques secondes.",
mat:["Rien"],
steps:["Si la personne tousse efficacement : encouragez-la à tousser, n'intervenez pas.","Si elle ne peut plus parler, tousser ou respirer : penchez-la en avant.","Donnez jusqu'à 5 claques vigoureuses entre les omoplates avec le talon de la main.","Si c'est inefficace : placez-vous derrière elle, poing fermé entre le nombril et le bas du sternum, l'autre main par-dessus.","Tirez fermement vers vous et vers le haut : jusqu'à 5 compressions abdominales (manœuvre de Heimlich).","Alternez 5 claques et 5 compressions jusqu'à la désobstruction.","Si elle perd connaissance : allongez-la, appelez le 112 et commencez la RCP."],
tips:["Toute personne ayant subi des compressions abdominales doit être examinée par un médecin."],
warn:["NOURRISSON (moins d'1 an) : pas de compressions abdominales. Allongez-le à plat ventre sur votre avant-bras, tête plus basse : 5 claques dans le dos, puis 5 compressions sur le thorax avec deux doigts."]},
{id:"plaies",cat:"secours",art:"m_plaie",t:"Nettoyer et panser une plaie",diff:1,time:"10 à 15 min",
s:"En milieu isolé, l'infection d'une simple coupure peut devenir grave. Le nettoyage est la clé.",
mat:["Eau potable ou bouillie refroidie (en grande quantité)","Savon","Désinfectant","Compresses ou tissu propre","Bande ou ruban adhésif"],
steps:["Lavez-vous les mains ou portez des gants.","Arrêtez d'abord le saignement par compression.","Rincez abondamment la plaie à l'eau potable : c'est l'étape la plus importante. Utilisez un sac percé ou une seringue pour créer un jet.","Retirez les débris visibles (terre, échardes) avec une pince propre.","Nettoyez le pourtour au savon, appliquez un désinfectant si disponible.","Couvrez d'une compresse propre, maintenez avec une bande sans serrer.","Changez le pansement chaque jour ou s'il est mouillé ou sale."],
tips:["Signes d'infection : rougeur qui s'étend, chaleur, gonflement, pus, douleur croissante, fièvre.","Vérifiez que votre vaccin antitétanique est à jour (rappel tous les 10 ans chez l'adulte)."],
warn:["En milieu isolé, ne refermez pas une plaie profonde ou sale (risque d'infection grave) : laissez-la ouverte, couverte, et consultez au plus vite.","Plaie profonde, morsure, saignement qui ne s'arrête pas : secours médicaux."]},
{id:"morsures",cat:"secours",art:"m_morsure",t:"Tiques, vipères et piqûres",diff:1,time:"Immédiat",
s:"Les rencontres les plus fréquentes en pleine nature en Europe et les bons réflexes.",
mat:["Tire-tique","Désinfectant","Stylo pour noter la date","Auto-injecteur d'adrénaline (si allergie connue)"],
steps:["TIQUE : retirez-la au plus vite avec un tire-tique en tournant, sans l'écraser ni utiliser d'éther ou d'alcool avant.","Désinfectez, notez la date et l'endroit de la morsure.","Surveillez pendant un mois : une plaque rouge qui s'étend autour de la morsure (érythème migrant) ou de la fièvre nécessitent un médecin (maladie de Lyme).","VIPÈRE : calmez la personne, allongez-la et immobilisez le membre mordu.","Retirez bagues, montres et bracelets avant le gonflement ; appelez le 112.","PIQÛRE DE GUÊPE ou D'ABEILLE : retirez le dard en grattant avec un ongle ou une carte ; appliquez du froid."],
tips:["Inspectez tout le corps après chaque sortie en nature, surtout les plis (aisselles, aine, derrière les genoux, cuir chevelu des enfants)."],
warn:["Vipère : pas de garrot, pas d'incision, pas d'aspiration, pas d'alcool.","Gonflement du visage, difficulté à respirer ou malaise après une piqûre : choc allergique, appelez le 112 et utilisez l'auto-injecteur s'il y en a un."]},
{id:"gelures",cat:"secours",art:"m_gelure",t:"Gelures",diff:2,time:"30 min et plus",
s:"Les extrémités gèlent par grand froid : doigts, orteils, nez, oreilles.",
mat:["Eau tiède (37–39 °C)","Thermomètre ou coude pour tester","Compresses stériles, vêtements secs"],
steps:["Reconnaissez les signes : peau blanche ou grisâtre, cireuse, dure, insensible ; picotements puis perte de sensation.","Mettez la personne à l'abri et traitez d'abord une éventuelle hypothermie.","Retirez bagues et vêtements serrés.","Ne réchauffez que s'il n'y a aucun risque de regel ensuite : regeler une zone dégelée aggrave fortement les lésions.","Plongez la zone dans de l'eau à 37–39 °C (agréable au coude) pendant 15 à 30 minutes, jusqu'à ce que la peau redevienne souple et colorée.","Séchez délicatement, séparez les doigts par des compresses, couvrez sans serrer.","Ne percez pas les cloques ; consultez un médecin rapidement."],
tips:["Gelure superficielle : réchauffez la zone contre le corps (main sous l'aisselle, pieds contre le ventre d'un compagnon)."],
warn:["Ne frottez jamais avec de la neige ou les mains, n'approchez pas du feu directement (la zone insensible brûle sans douleur).","Évitez de marcher sur des pieds dégelés."]},

/* SIGNALISATION */
{id:"sifflet",cat:"signal",art:"m_sifflet",t:"Signaux sonores et sifflet",diff:1,time:"Immédiat",
s:"Un sifflet porte beaucoup plus loin que la voix, sans épuiser la personne.",
mat:["Sifflet (sans bille de préférence)","À défaut : deux pierres, casserole, klaxon"],
steps:["Signal de détresse international : 3 coups de sifflet, puis une pause, puis 3 coups, et ainsi de suite.","Signal de détresse en montagne (convention alpine) : 6 coups par minute (un toutes les 10 secondes), puis une minute de pause, et on recommence.","Réponse des secours : 3 signaux par minute, puis une minute de pause.","Sifflez à intervalles réguliers, surtout quand vous entendez des voix, des moteurs ou des chiens.","La nuit et par brouillard, le son est souvent plus efficace que la lumière."],
tips:["Attachez un sifflet à la fermeture éclair de la veste de chaque enfant et apprenez-leur le signal.","Un sifflet sans bille fonctionne même mouillé ou gelé."],
warn:["Ne criez pas pendant des heures : vous vous épuiserez et perdrez votre voix rapidement."]},
{id:"morse",cat:"signal",art:"m_morse",t:"SOS en morse avec une lumière",diff:1,time:"Immédiat",
s:"La nuit, une lampe ou un écran de téléphone se voient à plusieurs kilomètres.",
mat:["Lampe torche, frontale, écran de téléphone, phares de voiture, miroir (le jour)"],
steps:["Mémorisez SOS : trois signaux courts, trois longs, trois courts (··· ——— ···).","Un signal court dure environ 1 seconde, un signal long environ 3 secondes.","Laissez 1 seconde entre les signaux d'une même lettre et 3 secondes entre les lettres.","Après chaque SOS, faites une pause d'environ 7 secondes, puis recommencez.","Visez la direction d'où peuvent venir les secours : vallée, route, mer, hélicoptère.","Économisez la batterie : signalez surtout quand vous entendez ou voyez des secours."],
tips:["Le même rythme fonctionne au sifflet, en tapant sur un tuyau ou avec un klaxon."],
warn:["N'utilisez jamais SOS sans réelle détresse : c'est un signal d'urgence vitale."]},
{id:"signaux-corps",cat:"signal",art:"m_corps",t:"Signaux corporels et accueil d'un hélicoptère",diff:1,time:"Immédiat",
s:"Communiquer avec un hélicoptère sans radio, puis l'accueillir en sécurité.",
mat:["Vêtement de couleur vive","Zone dégagée"],
steps:["OUI / J'AI BESOIN D'AIDE : les deux bras levés en Y.","NON / PAS BESOIN D'AIDE : un bras levé en diagonale, l'autre baissé en diagonale (forme d'un N).","Placez-vous dans une zone dégagée, bien visible depuis le ciel, et restez immobile une fois repéré.","Préparez une zone d'atterrissage plate, sans câbles, arbres ni objets pouvant s'envoler (bâches, sacs, vêtements).","Tenez-vous dos au vent, bras en Y, pour indiquer la zone au pilote.","Protégez vos yeux du souffle des pales ; ne bougez plus quand l'appareil approche.","N'approchez jamais avant le signal de l'équipage, toujours par l'avant et dans le champ de vision du pilote."],
tips:["Le souffle d'un hélicoptère est très violent : fixez ou rangez tout ce qui peut s'envoler."],
warn:["Ne passez JAMAIS à l'arrière d'un hélicoptère (rotor de queue presque invisible) et ne remontez pas vers lui depuis le côté amont d'une pente."]}
);

{id:"noeud-papillon",cat:"noeuds",kt:"Boucle",art:"k_papillon",t:"Nœud papillon (boucle au milieu)",en:"Alpine butterfly loop",diff:2,time:"30 s",
s:"Une boucle fixe formée au milieu d'une corde, sans avoir accès aux extrémités, qui supporte des tractions dans tous les sens.",
ex:{t:"Créer un point d'accroche sur une ligne de faîtage",d:"Votre ligne de faîtage est déjà tendue entre deux arbres et vous voulez y suspendre une lampe ou une gourde au centre : un nœud papillon crée une boucle solide au milieu sans rien détacher. En montagne, il sert à s'encorder au milieu d'une corde."},
mat:["Une corde"],
steps:["Enroulez la corde trois fois autour de votre main, en laissant les tours côte à côte.","Prenez le tour du milieu et faites-le passer par-dessus le tour le plus proche du bout des doigts.","Saisissez ce même tour et passez-le sous les deux autres tours, vers votre poignet.","Retirez la main en tenant la boucle formée.","Tirez sur les deux extrémités pour serrer : la boucle doit être nette et stable.","Autre méthode : faites une torsion double pour former un « 8 », rabattez la boucle supérieure et passez-la dans la boucle inférieure."],
tips:["Il permet aussi d'isoler une partie abîmée d'une corde : la zone endommagée se retrouve dans la boucle."],
warn:[]},
{id:"noeud-alouette",cat:"noeuds",kt:"Attache",art:"k_alouette",t:"Tête d'alouette",en:"Girth hitch / cow hitch",diff:1,time:"5 s",
s:"Le moyen le plus rapide de fixer une boucle ou un anneau de corde autour d'un objet.",
ex:{t:"Accrocher son sac ou sa gourde à une branche",d:"Avec un anneau de cordelette, faites une tête d'alouette autour d'une branche ou d'une sangle de sac : en deux secondes, vous pouvez suspendre gourde, lampe ou sac à nourriture, et le retirer aussi vite."},
mat:["Un anneau de corde, une sangle ou une corde pliée en deux"],
steps:["Passez la boucle (ou la corde pliée en deux) autour de l'objet.","Faites passer les deux brins (ou le reste de l'anneau) à l'intérieur de la boucle.","Tirez pour serrer contre l'objet."],
tips:["Sur un objet dont une extrémité est libre, on peut former deux boucles et les enfiler directement."],
warn:["Ce nœud peut glisser sous une charge latérale : ne l'utilisez pas pour une charge de sécurité."]},
{id:"brelage-diagonal",cat:"noeuds",kt:"Brêlage",art:"k_brediag",t:"Brêlage en diagonale",en:"Diagonal lashing",diff:2,time:"3 à 5 min",
s:"Assemble deux perches qui se croisent sans se toucher ou qui ont tendance à s'écarter, comme les croisillons de renfort.",
ex:{t:"Rigidifier la structure d'un abri ou d'un séchoir",d:"Votre cadre de séchoir à viande se déforme en parallélogramme : ajoutez une perche en diagonale et fixez-la aux montants par des brêlages en diagonale. La structure devient rigide, même chargée."},
mat:["Corde de 2 à 3 m","Deux perches croisées"],

tips:["Le nœud de bois de départ rapproche les perches même si elles ne se touchaient pas."],
warn:[]}
