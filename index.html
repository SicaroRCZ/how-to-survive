const ENR={
/* ---------- PRIORITÉS ---------- */
"regle-des-3":{why:"Le corps humain ne meurt pas de tout à la même vitesse : l'asphyxie tue en minutes, le froid en heures, la soif en jours, la faim en semaines. Traiter les menaces dans cet ordre, c'est utiliser son énergie là où elle sauve vraiment.",err:["Partir chercher à manger alors que la nuit tombe et qu'on n'a pas d'abri.","S'épuiser à construire un abri parfait en plein soleil sans boire."],ok:"Vous savez dire, à chaque instant, quelle est votre menace numéro 1 et ce que vous faites pour la traiter.",alt:[],req:[]},
"stop":{why:"Sous le stress, le cerveau pousse à agir vite et mal. S'arrêter volontairement remet la réflexion aux commandes : la plupart des situations s'aggravent parce qu'on a continué à marcher.",err:["Faire « juste encore un bout » pour retrouver le chemin : on s'éloigne de la zone où les secours chercheront.","Oublier de faire l'inventaire : on se croit démuni alors qu'on porte de quoi faire un abri et un signal."],ok:"Vous êtes assis, calme, vous avez un plan simple en 3 étapes et vous savez ce que contient chaque poche.",alt:[],req:[]},
"kit-survie":{why:"En situation réelle, on n'a que ce qu'on porte sur soi. Un petit kit transforme les techniques difficiles (feu par friction, eau sans récipient) en gestes simples.",err:["Faire un kit si gros qu'on finit par le laisser à la maison.","Ne jamais l'ouvrir : piles vides, briquet sec, pansements périmés le jour où on en a besoin."],ok:"Le kit tient dans une poche, vous savez utiliser chaque objet et il a été vérifié il y a moins de 6 mois.",alt:["Pas de boîte métallique : une gourde inox simple paroi sert aussi de récipient pour bouillir l'eau.","Budget serré : briquet, couverture de survie, sifflet et sacs poubelle coûtent quelques euros et couvrent l'essentiel."],req:[]},
"gerer-stress":{why:"Expirer lentement active le système nerveux qui calme le cœur. Occuper ses mains et ses sens coupe la boucle des pensées catastrophes.",err:["Se dire « calme-toi » sans rien faire de concret : la panique revient.","Prendre une décision irréversible (partir de nuit, sauter, traverser) pendant le pic d'angoisse."],ok:"Votre respiration est redevenue lente, vous arrivez à parler calmement et à faire une tâche simple jusqu'au bout.",alt:[],req:[]},
"plan-sortie":{why:"Les secours commencent par chercher là où vous aviez dit aller. Sans plan laissé à quelqu'un, l'alerte est donnée tard et la zone de recherche est immense.",err:["Donner une heure de retour mais pas d'heure limite : votre contact hésite et attend trop.","Changer d'itinéraire en route sans prévenir."],ok:"Quelqu'un de fiable connaît votre parcours, votre heure de retour et l'heure à laquelle appeler le 112 s'il n'a pas de nouvelles.",alt:["Pas de réseau prévu : laissez aussi le plan sur papier dans la voiture, bien visible."],req:[]},
"rester-chaud":{why:"Le corps perd sa chaleur par le vent, l'humidité et le contact avec le sol. Rester sec et isolé coûte beaucoup moins d'énergie que de se réchauffer après coup.",err:["Garder sa veste pendant l'effort et la tremper de sueur, puis avoir froid à l'arrêt.","S'asseoir directement sur une pierre ou la neige."],ok:"Vous ne transpirez pas en marchant, vous n'avez pas de frissons à l'arrêt et vos extrémités restent tièdes.",alt:["Pas de bonnet : un t-shirt, un bandana ou une chaussette de rechange autour de la tête.","Pas de couche isolante : bourrez vos vêtements de feuilles mortes sèches ou de papier journal."],req:[]},
/* ---------- ABRIS ---------- */
"appentis":{why:"Un seul pan incliné coupe le vent et la pluie, et un feu devant l'ouverture renvoie sa chaleur sur vous grâce au mur réflecteur.",err:["Ouvrir l'abri face au vent : la fumée et la pluie entrent.","Couverture trop fine : on voit le ciel à travers, la pluie passe."],ok:"Assis dedans, vous ne sentez plus le vent et vous ne voyez pas le jour à travers le toit.",alt:["Pas de cordage : posez la faîtière dans deux fourches d'arbres ou coincez-la entre deux branches.","Avec une bâche, le toit est fait en 10 minutes : tendez-la en pente sur la faîtière."],req:[]},
"hutte-debris":{why:"Les feuilles sèches emprisonnent de l'air immobile, comme le duvet d'un sac de couchage. Un petit volume intérieur se réchauffe avec la seule chaleur du corps.",err:["Faire la hutte trop grande : impossible à chauffer.","S'arrêter à 20 cm de feuilles : il en faut 60 cm à 1 m pour une nuit froide."],ok:"Couché dedans, vous touchez presque les parois et vous sentez la chaleur revenir au bout de 15 à 30 minutes.",alt:["Pas assez de feuilles : herbes sèches, fougères, aiguilles de pin ou mousse sèche font aussi l'affaire.","Pas de souche : posez la faîtière sur votre sac à dos ou sur un tas de pierres."],req:[]},
"abri-bache":{why:"Une bâche est imperméable : elle remplace des heures de collecte de branches. En A, la pluie ruisselle des deux côtés.",err:["Bâche à plat : l'eau s'accumule au milieu et la fait céder.","Ligne de faîtage molle : le tissu claque et laisse passer le vent."],ok:"La bâche est bien tendue, sans poche d'eau, et le côté exposé au vent descend jusqu'au sol.",alt:["Pas de corde : lacets, ceinture, bandes de tissu, ou posez la bâche sur une perche faîtière.","Pas de piquets : des pierres lourdes ou des bouts de bois coincés sous des racines tiennent les coins."],req:["bache"]},
"abri-neige":{why:"La neige contient beaucoup d'air : c'est un isolant. À l'intérieur, la température reste autour de 0 °C même s'il fait −20 °C dehors, et l'air froid s'écoule par l'entrée basse.",err:["Oublier le trou d'aération : l'air devient vicié.","Transpirer en creusant : on se retrouve mouillé dans le froid."],ok:"À l'intérieur, vous n'êtes plus exposé au vent, le plafond ne goutte pas et le trou d'aération reste ouvert.",alt:["Pas de pelle : creusez avec un ski, une planche, une casserole ou les mains gantées.","Pas assez de neige : utilisez un abri naturel ou une hutte de débris."],req:["neige"]},
"lit-sureleve":{why:"Le sol humide aspire la chaleur du corps bien plus vite que l'air. 30 cm d'air et de branches en dessous coupent ce contact.",err:["Perches trop fines : le lit casse au milieu de la nuit.","Ne rien mettre sur les perches : elles rentrent dans le dos et laissent passer le froid."],ok:"Vous pouvez vous allonger sans que le lit plie et vous ne sentez plus le froid du sol.",alt:["Pas de cordage : choisissez des fourches bien profondes ou entaillez les piquets.","Pas le temps : faites juste un matelas de 30 cm de branches de sapin."],req:[]},
"abri-naturel":{why:"La nature a déjà fait le gros du travail : il suffit de fermer, isoler et sécuriser l'endroit, en économisant l'énergie.",err:["S'installer sous un rocher fissuré ou une branche morte.","Faire le feu au fond d'une grotte : fumée et monoxyde de carbone."],ok:"L'endroit est stable, sec, fermé au vent et vous êtes isolé du sol.",alt:[],req:[]},
"choisir-camp":{why:"Le froid, l'eau et les chutes d'objets suivent la pente du terrain : choisir le bon endroit évite la moitié des problèmes de la nuit.",err:["Camper au fond d'un vallon : air froid, humidité, crue possible.","Chercher l'emplacement à la tombée de la nuit."],ok:"Sol plat et sec, rien de mort au-dessus de vous, eau et bois à moins de 10 minutes.",alt:[],req:[]},
"nuit-voiture":{why:"Une voiture est un abri contre le vent, visible de loin. Le danger principal vient du pot d'échappement bouché, pas du froid.",err:["Laisser tourner le moteur en continu : gaspillage de carburant et risque de monoxyde de carbone.","Partir à pied dans la tempête."],ok:"Le pot est dégagé, une vitre est légèrement ouverte quand le moteur tourne, et les secours connaissent votre position.",alt:["Pas de couverture : tapis de sol, housses de siège, journaux sous les vêtements.","Pas de batterie externe : rechargez le téléphone quand le moteur tourne et mettez-le en mode économie."],req:["vehicule"]},
/* ---------- FEU ---------- */
"feu-tipi":{why:"Le feu monte : en cône, chaque couche de bois sèche et chauffe la suivante. Le petit bois prend vite, il enflamme le moyen, qui enflamme le gros.",err:["Allumer avant d'avoir tout préparé : la flamme meurt pendant qu'on cherche du bois.","Mettre trop vite du gros bois : le feu s'étouffe."],ok:"Les flammes montent seules, le bois de la taille du pouce brûle et un lit de braises se forme.",alt:["Pas de briquet : utilisez un ferrocérium, une loupe, une pile ou la friction (voir les autres fiches).","Pas d'amadou sec : grattez l'écorce de bouleau, faites des copeaux fins dans le cœur d'une branche morte."],req:[["briquet","ferro","loupe","pile"]]},
"feu-archet":{why:"Le frottement rapide du foret chauffe la poussière de bois jusqu'à plus de 400 °C : elle forme une petite braise qui peut enflammer l'amadou.",err:["Bois humide ou trop dur : ça crisse, ça brille, mais aucune braise.","S'arrêter dès la première fumée : il faut continuer jusqu'à une fumée épaisse."],ok:"Une petite boule de poussière noire continue à fumer toute seule quand vous arrêtez l'archet.",alt:["Pas de corde : lacet, ceinture fine, bande de t-shirt torsadée.","Pas de couteau : c'est très difficile ; cherchez plutôt une autre méthode (loupe, pile)."],req:["couteau",["corde"]]},
"ferro":{why:"Le ferrocérium est un alliage qui s'effrite en particules brûlant à près de 3 000 °C. Il marche mouillé, en altitude et dans le froid.",err:["Pousser le grattoir vers l'amadou et disperser le nid.","Viser un amadou trop épais : les étincelles rebondissent sans l'allumer."],ok:"L'amadou s'enflamme en 1 à 5 grattages et vous pouvez glisser la flamme sous le petit bois.",alt:["Pas de grattoir : le dos d'un couteau à arête vive, une lame de scie ou un bout de verre.","Pas de coton vaseliné : écorce de bouleau grattée en poudre, duvet de massette, mouchoir en papier sec."],req:["ferro"]},
"dakota":{why:"Le tunnel crée un appel d'air : l'oxygène arrive par le bas, le feu brûle plus chaud et plus complètement, donc avec moins de fumée et moins de bois.",err:["Tunnel trop étroit : pas assez d'air.","Creuser dans un sol gorgé d'eau : le trou se remplit."],ok:"Le feu ronfle, presque sans fumée, et une gamelle posée dessus chauffe vite.",alt:["Pas de pelle : creusez avec un bâton pointu et les mains."],req:[]},
"feu-pluie":{why:"Sous la pluie, seul l'extérieur du bois est mouillé. Le cœur des branches mortes et le bois résineux restent secs et brûlent.",err:["Allumer à découvert sans protection au-dessus.","Utiliser le bois tombé au sol, gorgé d'eau."],ok:"Le feu tient seul malgré la pluie et le bois suivant sèche autour.",alt:["Pas de bâche : allumez sous un grand conifère ou un surplomb rocheux.","Pas de couteau : cassez les branches mortes en deux pour atteindre le cœur sec."],req:[["briquet","ferro"]]},
"allumages-urgence":{why:"Une lentille concentre la chaleur du soleil en un point. Une pile fait passer un courant fort dans les fils très fins de la paille de fer, qui chauffent jusqu'à brûler.",err:["Lentille mal réglée : le point lumineux doit être le plus petit possible.","Paille de fer trop grosse : seule la paille « 0000 » très fine marche bien."],ok:"L'amadou rougeoie et fume tout seul ; vous le transférez dans le nid.",alt:["Pas de loupe : verre de lunettes de presbyte, fond de bouteille, sac plastique rempli d'eau.","Pas de pile 9 V : deux piles AA bout à bout reliées par un brin de paille de fer."],req:[["loupe","pile","bouteille"]]},
"feu-etoile":{why:"Seules les extrémités des bûches sont dans les braises : elles se consument lentement. On règle la puissance en poussant ou en écartant les bûches.",err:["Bûches trop fines : elles brûlent en une heure.","Laisser une bûche dépasser vers l'abri ou les affaires."],ok:"Le feu reste petit et régulier pendant des heures sans être rechargé.",alt:[],req:[]},
"transporter-braise":{why:"Certains champignons et bois pourris secs couvent très lentement, comme une mèche : ils gardent une braise vivante pendant des heures.",err:["Enfermer la braise sans air : elle s'éteint.","La serrer trop près de matières sèches dans le sac."],ok:"Après plusieurs heures de marche, la braise rougeoie encore quand vous soufflez dessus.",alt:["Pas d'amadouvier : tissu de coton carbonisé (char cloth) dans une boîte."],req:[]},
/* ---------- EAU ---------- */
"trouver-eau":{why:"L'eau suit la pente et la végétation suit l'eau. Animaux, insectes et plantes vertes indiquent souvent une source proche.",err:["Chercher en hauteur parce qu'on y voit loin.","Boire l'eau trouvée sans la purifier."],ok:"Vous avez une source régulière et un moyen de la purifier.",alt:["Pas de récipient : sac plastique, bâche creusée dans le sol, préservatif (contient 1 à 2 litres), grande feuille repliée."],req:[]},
"filtre":{why:"Chaque couche retient des particules de plus en plus petites ; le charbon de bois accroche aussi une partie des odeurs et des goûts.",err:["Croire l'eau filtrée potable.","Mettre de la cendre à la place du charbon : elle rend l'eau basique et imbuvable."],ok:"L'eau qui sort est claire, sans dépôt ; elle est prête à être purifiée.",alt:["Pas de bouteille : une chaussette ou une jambe de pantalon suspendue remplie des mêmes couches.","Pas de sable : plusieurs épaisseurs de tissu fin."],req:[]},
"purifier-eau":{why:"La chaleur, le chlore ou les ultraviolets du soleil tuent bactéries, virus et parasites. Filtrer avant rend ces méthodes plus efficaces.",err:["Couper le feu dès les premières bulles : il faut un vrai bouillon.","Boire l'eau traitée à la Javel avant les 30 minutes d'attente."],ok:"Eau bouillie franchement, ou légère odeur de chlore après 30 minutes, ou 6 heures de plein soleil en bouteille transparente.",alt:["Pas de casserole : bouteille plastique pleine d'eau sur les braises, ou pierres chauffées plongées dans un trou tapissé de bâche.","Pas de feu ni de produit : méthode solaire SODIS avec des bouteilles transparentes."],req:[["recipient","pastilles","bouteille"]]},
"alambic":{why:"Le soleil chauffe le sol humide et les plantes ; la vapeur se condense sur le plastique plus frais et coule vers le point bas.",err:["Plastique qui touche le bord du trou : l'eau retombe dans la terre.","Ouvrir l'alambic pour boire : on perd toute l'humidité accumulée."],ok:"Des gouttes se forment sous le plastique et tombent dans le récipient.",alt:["Pas de grand plastique : faites des sacs de transpiration sur des branches feuillues."],req:["plastique"]},
"eau-maison":{why:"Le ballon d'eau chaude et les tuyaux gardent l'eau du réseau même après la coupure : c'est souvent la plus grande réserve de la maison.",err:["Vider le ballon sans couper le chauffage : la résistance grille.","Oublier d'ouvrir un robinet en haut : l'eau ne s'écoule pas."],ok:"Vous avez rempli plusieurs récipients propres et marqué l'eau à purifier.",alt:[],req:[]},
"dessaler":{why:"En bouillant, l'eau s'évapore mais le sel reste au fond. En récupérant la vapeur refroidie, on obtient de l'eau douce.",err:["Laisser retomber les gouttes du couvercle dans la casserole.","Sous-estimer le combustible : il faut beaucoup de feu pour peu d'eau."],ok:"L'eau récupérée n'a aucun goût salé.",alt:["Pas de feu : alambic solaire avec l'eau de mer versée dans le trou."],req:["recipient"]},
"deshydratation":{why:"Le sucre aide l'intestin à absorber le sel, et le sel aide à retenir l'eau : la solution de réhydratation hydrate mieux que l'eau seule.",err:["Attendre d'avoir très soif pour boire.","Mettre trop de sel : la solution aggrave la déshydratation."],ok:"Les urines redeviennent jaune clair et les maux de tête disparaissent.",alt:["Pas de sucre : du miel, de la confiture ou un jus de fruit dilué.","Pas de cuillère : une poignée de sucre et une pincée de sel (trois doigts) par litre, la solution doit avoir le goût des larmes, pas plus salé."],req:[]},
"stocker-eau":{why:"L'eau se garde bien si elle est propre, à l'abri de la lumière et de la chaleur, dans un contenant prévu pour l'alimentation.",err:["Stocker près de l'essence ou des produits ménagers : le plastique laisse passer les odeurs.","Oublier de faire tourner les réserves."],ok:"Chaque bidon est daté, rangé au frais et vous connaissez la date du prochain renouvellement.",alt:[],req:[]},
};

Object.assign(ENR,{
/* ---------- NOURRITURE ---------- */
"test-comestibilite":{why:"Chaque étape expose le corps à une dose un peu plus grande, en commençant par la peau puis la bouche. Une réaction précoce permet d'arrêter avant d'avoir avalé une quantité dangereuse.",err:["Tester plusieurs plantes ou plusieurs parties en même temps : impossible de savoir laquelle rend malade.","Raccourcir les temps d'attente parce qu'on a faim."],ok:"Après le test complet, la même partie préparée de la même façon n'a provoqué aucun symptôme en 8 heures.",alt:["Toujours préférable : se limiter aux plantes que l'on connaît avec certitude (voir la fiche des 10 plantes comestibles et le guide Plantes, champignons & poissons)."],req:[]},
"insectes":{why:"Les insectes contiennent autant de protéines que la viande, sont partout et ne demandent ni piège ni arme. La cuisson élimine les parasites.",err:["Les manger crus.","Ramasser des insectes colorés ou poilus, souvent toxiques."],ok:"Vous avez une poignée d'insectes bien grillés, croustillants, sans tête ni pattes.",alt:["Pas de feu : faites-les sécher au soleil sur une pierre chaude avant de les broyer."],req:[]},
"cuisson-pierre":{why:"Les braises et les pierres chaudes diffusent une chaleur régulière qui cuit sans brûler, contrairement aux flammes.",err:["Cuire sur les flammes : extérieur carbonisé, intérieur cru.","Utiliser une pierre de rivière qui éclate en chauffant."],ok:"La viande est cuite à cœur (jus clair) et l'extérieur doré, pas noir.",alt:["Pas de pierre plate : broche en bois vert ou papillote de feuilles enterrée dans les braises."],req:[]},
"four-terre":{why:"Les pierres chauffées pendant des heures stockent beaucoup d'énergie. Sous la terre, la vapeur des feuilles humides cuit lentement et uniformément.",err:["Pierres pas assez chauffées : la cuisson s'arrête à mi-chemin.","Couche de feuilles trop fine : la nourriture brûle au contact des pierres."],ok:"À l'ouverture, la vapeur s'échappe et la viande se détache facilement de l'os.",alt:["Pas de pelle : creusez avec un bâton pointu ; une fosse moins profonde marche pour de petites pièces."],req:[]},
"bannock":{why:"Une pâte simple de farine et d'eau cuite près des braises donne un pain dense et nourrissant, sans four ni levain.",err:["Pâte trop épaisse sur le bâton : l'intérieur reste cru.","Cuire dans les flammes au lieu de la chaleur des braises."],ok:"La croûte est dorée et sonne creux quand on la tapote.",alt:["Pas de levure : la pâte sera plus plate mais tout aussi comestible.","Pas de bâton : galette sur pierre chaude ou dans une poêle."],req:["farine"]},
"plantes-comestibles":{why:"Ces dix plantes sont communes en Europe et ont peu de sosies dangereux, à part l'ail des ours : les apprendre à l'avance permet de manger sans risque.",err:["Cueillir le long des routes ou des champs traités.","Se fier à une seule caractéristique (la couleur des fleurs par exemple)."],ok:"Vous reconnaissez chaque plante à coup sûr, à plusieurs saisons, sans regarder le guide.",alt:["Pour plus d'espèces et leurs sosies : ouvrez le guide Plantes, champignons & poissons."],req:[]},
"plantes-mortelles":{why:"Quelques espèces seulement causent la plupart des intoxications graves. Les reconnaître élimine l'essentiel du risque.",err:["Penser qu'une plante mangée par les animaux est sans danger pour l'humain.","Croire qu'une cuisson détruit toutes les toxines."],ok:"Vous savez nommer et reconnaître chacune de ces plantes et leurs sosies comestibles.",alt:[],req:[]},
"marmite-norvegienne":{why:"Une fois l'eau à ébullition, il suffit de garder la chaleur : l'isolant fait le travail du feu. On économise jusqu'à 70 % de combustible.",err:["Soulever le couvercle pour vérifier : on perd la chaleur.","Isolant trop mince sur le dessus."],ok:"Après le temps indiqué, le plat est cuit et encore très chaud.",alt:["Pas de caisse : enroulez la casserole dans un sac de couchage ou des couvertures, sur un coussin."],req:["recipient"]},
"rationner":{why:"Le corps tient des semaines avec peu de nourriture mais quelques jours seulement sans eau. Ce qu'on rationne d'abord, c'est l'effort et la transpiration.",err:["Rationner l'eau alors qu'on en a encore.","Manger des aliments salés quand l'eau manque."],ok:"Chaque personne sait ce qu'elle reçoit par jour et la réserve couvre la durée prévue.",alt:[],req:[]},
/* ---------- CONSERVATION ---------- */
"secher-viande":{why:"Les bactéries ont besoin d'eau pour se développer. En séchant la viande en fines lanières, on retire cette eau avant qu'elles n'aient le temps de proliférer.",err:["Lanières trop épaisses : l'extérieur sèche, l'intérieur pourrit.","Laisser du gras : il rancit et gâche le lot."],ok:"La lanière est foncée, sèche au toucher, et se fissure quand on la plie sans casser net.",alt:["Pas de sel : séchez plus fin et ajoutez de la fumée.","Pas de soleil : séchez au-dessus d'un feu doux qui fume."],req:["couteau"]},
"fumer":{why:"La fumée sèche la surface, dépose des composés qui gênent les bactéries et éloigne les insectes.",err:["Laisser monter des flammes : la viande cuit et brûle au lieu de fumer.","Utiliser du bois résineux qui donne un goût amer."],ok:"La surface est sèche et brillante, l'intérieur ne suinte plus.",alt:["Pas de bâche : couvrez le tipi de branchages verts et d'écorce."],req:["couteau"]},
"saler":{why:"Le sel attire l'eau hors de la viande et rend le milieu trop salé pour la plupart des bactéries.",err:["Pas assez de sel dans les replis : la viande s'abîme de l'intérieur.","Récipient métallique : le sel le ronge."],ok:"La viande est ferme, sèche au toucher, sans odeur aigre.",alt:["Pas de sel : séchage et fumage.","Au bord de la mer : faites évaporer l'eau de mer pour obtenir du sel."],req:["sel"]},
"pemmican":{why:"La viande séchée apporte les protéines, la graisse l'énergie, et la graisse enrobe la poudre en la protégeant de l'air.",err:["Viande pas assez sèche.","Graisse surchauffée ou mal filtrée qui rancit."],ok:"Les galettes sont dures au frais, sans odeur de rance.",alt:[],req:[]},
"frigo-desert":{why:"L'eau qui s'évapore du sable emporte la chaleur, comme la sueur sur la peau. Le pot intérieur peut perdre plus de 10 °C.",err:["Pots vernissés : l'eau ne traverse pas.","Placer le frigo au soleil ou dans un endroit humide sans air."],ok:"Le pot intérieur est nettement plus frais au toucher que l'air ambiant.",alt:["Pas de pots en terre : un panier entouré d'un tissu humide en permanence, avec une partie qui trempe dans l'eau."],req:[]},
"secher-fruits":{why:"Sans eau, les moisissures et les bactéries ne se développent plus. Les tranches fines sèchent avant de s'abîmer.",err:["Tranches trop épaisses.","Laisser dehors la nuit : la rosée réhumidifie tout."],ok:"Les fruits sont souples comme du cuir, sans humidité à cœur ; les légumes cassent net.",alt:["Pas de claie : enfilez les tranches sur un fil et suspendez-les en guirlande."],req:["couteau"]},
"bocaux":{why:"La chaleur tue les microbes et le vide créé en refroidissant empêche l'air d'entrer. Les aliments peu acides demandent plus de 116 °C pour tuer la bactérie du botulisme.",err:["Stériliser des légumes ou de la viande dans une simple marmite.","Réutiliser de vieux joints."],ok:"Le couvercle est aspiré et ne bouge plus, le contenu est limpide.",alt:["Pas d'autocuiseur : limitez-vous aux fruits, confitures et tomates acidifiées, ou séchez les légumes."],req:["bocaux"]},
});

Object.assign(ENR,{
/* ---------- PIÈGES & CHASSE ---------- */
"collet":{why:"Les petits animaux empruntent toujours les mêmes passages. Une boucle placée à la bonne hauteur se resserre quand l'animal avance et tire.",err:["Boucle trop grande ou trop haute : l'animal passe à travers ou dessous.","Toucher et piétiner toute la coulée : l'odeur humaine fait fuir le gibier."],ok:"La boucle reste ouverte toute seule, à 4 doigts du sol, au milieu d'une coulée fréquentée, et l'ancrage résiste quand vous tirez fort.",alt:["Pas de fil métallique : cordelette, brins de paracorde, fil de pêche tressé, fibres d'ortie ou de tilleul (moins efficace, l'animal peut ronger)."],req:[["filfer","corde"]]},
"collet-ressort":{why:"La perche courbée stocke de l'énergie : au déclenchement, elle soulève la prise hors d'atteinte des prédateurs.",err:["Déclencheur trop dur : l'animal s'échappe avant qu'il se libère.","Perche pas assez souple ou trop courte."],ok:"Une légère traction sur la boucle suffit à libérer la clenche et la perche se redresse d'un coup.",alt:["Pas de jeune arbre : une pierre lourde suspendue au-dessus d'une branche sert de contrepoids."],req:["couteau",["filfer","corde"]]},
"figure-4":{why:"Trois bâtons forment un équilibre fragile qui retient le poids. Le moindre mouvement sur le bâton appâté casse cet équilibre et le poids tombe.",err:["Encoches imprécises : le piège ne tient pas armé ou ne se déclenche pas.","Pierre trop légère."],ok:"Le piège tient armé seul, et une petite pichenette sur l'appât fait tomber la pierre.",alt:["Pas de couteau : utilisez plutôt l'assommoir Paiute avec une cordelette, plus simple à tailler, ou un collet."],req:["couteau"]},
"lance":{why:"Un bois droit taillé en pointe et durci au feu suffit à pêcher ou à se défendre. Les pointes multiples augmentent la surface de frappe.",err:["Carboniser la pointe : elle devient cassante.","Viser là où l'on voit le poisson, sans tenir compte de la réfraction."],ok:"La pointe est brune, dure, et pénètre facilement un morceau de bois tendre.",alt:["Pas de couteau : frottez la pointe sur une pierre rugueuse ou utilisez un éclat de pierre taillée."],req:["couteau"]},
"preparer-gibier":{why:"Les viscères se décomposent très vite et contaminent la viande. Vider rapidement et proprement garde la viande saine.",err:["Percer l'intestin ou la vessie : la viande est souillée.","Préparer l'animal près du point d'eau ou de l'abri : attire les prédateurs et pollue l'eau."],ok:"La viande est propre, sans contact avec le contenu de l'intestin, et le foie est sain.",alt:["Pas de couteau : un éclat de silex ou de verre coupe la peau et la chair."],req:[["couteau"]]},
"traces":{why:"Chaque animal laisse des signes réguliers : empreintes, crottes, coulées. Les lire permet de poser les pièges au bon endroit plutôt qu'au hasard.",err:["Poser des pièges sans avoir trouvé de coulée active.","Confondre une vieille trace avec une récente."],ok:"Vous savez quels animaux passent, par où et à quelle heure.",alt:[],req:[]},
"paiute":{why:"La petite cordelette et le bâton-clé forment un déclencheur très sensible, qui réagit à un animal très léger.",err:["Baguette d'appât trop épaisse : elle ne glisse pas.","Pierre posée trop à plat : elle ne tombe pas assez vite."],ok:"Le piège tient armé, et un souffle sur la baguette suffit à le déclencher.",alt:["Pas de cordelette : fibres d'ortie torsadées, lacet, fil de couture."],req:["couteau",["corde","filfer"]]},
"petites-proies":{why:"Escargots, écrevisses et larves ne fuient presque pas : on les ramasse à la main pour très peu d'énergie.",err:["Les manger sans jeûne préalable (escargots) ou mal cuits.","Pêcher des écrevisses dans une eau polluée."],ok:"Vous avez rempli un récipient en quelques dizaines de minutes et tout est cuit à cœur.",alt:["Pas de lampe : cherchez les écrevisses de jour en soulevant les pierres, à contre-courant."],req:[]},
/* ---------- PÊCHE ---------- */
"hamecons":{why:"Le poisson avale l'appât d'un coup. Un hameçon en J accroche la bouche ; un bâtonnet pointu des deux côtés se met en travers dans la gorge.",err:["Hameçon trop gros pour les poissons présents.","Fil mal attaché qui se défait à la première touche."],ok:"L'hameçon résiste quand vous tirez fort sur le fil et l'appât le cache entièrement.",alt:["Pas de métal : épines d'aubépine, os de volaille, bois dur.","Pas de fil de pêche : fil dentaire, brins de paracorde, fil de couture, fibres torsadées."],req:[]},
"ligne-fond":{why:"Plusieurs hameçons pêchent jour et nuit sans vous : vous multipliez vos chances en faisant autre chose.",err:["Hameçons trop proches qui s'emmêlent.","Oublier de relever la ligne : les prises sont mangées ou se décrochent."],ok:"La ligne reste en place, tendue, et vous la relevez au moins matin et soir.",alt:["Pas d'hameçons : hameçons gorge en bois (voir fiche Hameçons improvisés)."],req:[["peche","corde"]]},
"nasse":{why:"L'entonnoir guide le poisson vers l'intérieur ; une fois dedans, il cherche la sortie le long des parois et ne retrouve pas l'étroit goulot.",err:["Entonnoir trop large : les poissons ressortent.","Poser la nasse en plein courant fort."],ok:"La nasse reste au fond, appâtée, et des petits poissons ou écrevisses s'y retrouvent après quelques heures.",alt:["Pas de bouteille : branches souples tressées, ou barrage de pierres en V."],req:[]},
"vider-poisson":{why:"Les viscères et le sang s'abîment en premier. Vider vite garde la chair ferme et saine.",err:["Percer trop profond et toucher les intestins.","Laisser le poisson au soleil avant de le préparer."],ok:"Le ventre est propre, la ligne de sang grattée, la chair blanche et ferme.",alt:["Pas de couteau : un éclat de pierre ou de verre, ou cuisez les petits poissons entiers."],req:[]},
"lire-riviere":{why:"Un poisson dépense le moins d'énergie possible : il se cache dans le calme, près du courant qui lui apporte la nourriture.",err:["Pêcher en plein courant rapide.","Projeter son ombre sur l'eau en approchant."],ok:"Vous pouvez désigner 3 endroits précis où des poissons ont des chances de se tenir.",alt:[],req:[]},
"filet-maillant":{why:"Le poisson passe la tête dans la maille mais pas le corps ; en reculant, ses ouïes s'accrochent.",err:["Mailles trop grandes ou trop petites pour les poissons présents.","Filet trop tendu : les poissons rebondissent dessus."],ok:"Le filet tient droit dans l'eau, flotteurs en haut et lests en bas.",alt:["Pas de fil : moustiquaire ou vieux rideau tendu en travers d'un petit ruisseau."],req:[["corde","peche","filet"]]},
/* ---------- OUTILS ---------- */
"cordage":{why:"Une fibre seule casse facilement. Torsadées dans un sens puis croisées dans l'autre, les fibres se bloquent mutuellement : la corde ne se défait pas et devient très solide.",err:["Ajouter les nouvelles fibres au même endroit sur les deux brins : point faible.","Fibres trop sèches qui cassent en tordant."],ok:"La corde ne se détord pas quand on la lâche et tient votre poids tirée à deux mains.",alt:["Fibres possibles : ortie, tilleul, saule, ronce écorcée, racines d'épicéa, herbes longues, sac plastique découpé en bandes."],req:[]},
"lame-pierre":{why:"Certaines pierres (silex, obsidienne) se cassent en formant des bords plus fins qu'un rasoir.",err:["Frapper à plat : la pierre se brise au lieu de détacher un éclat.","Travailler sans protéger ses yeux."],ok:"L'éclat coupe facilement une corde ou une lanière de cuir.",alt:["Pas de silex : un tesson de bouteille ou un morceau de céramique."],req:[]},
"recipient-ecorce":{why:"L'eau à l'intérieur absorbe la chaleur et empêche l'écorce de dépasser 100 °C : elle ne brûle pas sous la ligne d'eau.",err:["Poser le récipient sur des flammes : le bord brûle.","Écorce trop sèche qui casse au pliage."],ok:"Le récipient tient l'eau sans fuir et chauffe sur les braises.",alt:["Pas de bouleau : écorce de tilleul ou de cerisier, bâche, feuille d'aluminium."],req:[]},
"aiguiser":{why:"La pierre retire du métal des deux côtés du tranchant jusqu'à ce qu'ils se rejoignent en une arête fine.",err:["Changer d'angle à chaque passage : le fil s'arrondit.","Appuyer trop fort."],ok:"La lame tranche une feuille de papier proprement, sans la déchirer.",alt:["Pas de pierre à aiguiser : galet plat à grain fin, dessous d'une tasse, bord de vitre de voiture."],req:["couteau"]},
"batonnage":{why:"Le bois se fend facilement dans le sens des fibres. Le couteau joue le rôle de coin, le bâton celui du marteau.",err:["Bâtonner avec un couteau pliant ou une lame fine.","Choisir une bûche pleine de nœuds."],ok:"La bûche est ouverte et le cœur sec est accessible.",alt:["Pas de couteau solide : coins de bois dur enfoncés à coups de pierre."],req:["couteau"]},
"colle-resine":{why:"La résine fondue colle en refroidissant ; le charbon la rend moins cassante et plus solide.",err:["Chauffer la résine sur la flamme : elle prend feu.","Oublier le charbon : la colle casse au premier choc."],ok:"Une fois froide, la colle est dure, sombre et ne colle plus aux doigts.",alt:[],req:[]},
"lampe-graisse":{why:"La mèche aspire l'huile par capillarité ; seule l'huile qui monte dans la mèche brûle, pas celle du récipient.",err:["Mèche trop longue : grande flamme qui fume.","Récipient inflammable ou instable."],ok:"Une petite flamme stable, sans fumée, qui dure des heures.",alt:["Pas de coton : mousse sèche, papier roulé, ficelle de jute."],req:[["briquet","ferro"]]},
});

Object.assign(ENR,{
/* ---------- ORIENTATION ---------- */
"baton-ombre":{why:"Le soleil se déplace d'est en ouest : l'ombre du bâton se déplace donc d'ouest en est. Deux positions de l'ombre suffisent à tracer l'axe.",err:["Bâton penché ou sol en pente.","Ne pas attendre assez longtemps entre les deux marques."],ok:"Les deux cailloux sont nettement séparés et la ligne qui les relie est droite.",alt:["Pas de bâton : un piquet de tente, une branche, ou même votre propre ombre avec une pierre."],req:[]},
"etoile-polaire":{why:"L'Étoile polaire est presque exactement au-dessus du pôle Nord : toutes les autres étoiles tournent autour d'elle pendant la nuit, elle reste fixe.",err:["Confondre la Polaire avec l'étoile la plus brillante du ciel.","Compter trop peu d'écartements depuis la Grande Ourse."],ok:"Vous retrouvez la même étoile une heure plus tard, au même endroit, alors que les autres ont tourné.",alt:[],req:[]},
"montre":{why:"La petite aiguille fait deux tours par jour, le soleil un seul : la moitié de l'angle entre la petite aiguille et 12 h corrige ce décalage et pointe vers le sud.",err:["Oublier de corriger l'heure d'été.","S'en servir autour de midi, quand la méthode est la moins précise."],ok:"La direction trouvée correspond grosso modo à celle de la méthode du bâton et de l'ombre.",alt:["Montre digitale : dessinez un cadran au sol avec l'heure affichée."],req:[]},
"carte-boussole":{why:"L'aiguille aimantée indique toujours le nord magnétique : en réglant le cadran sur l'angle lu sur la carte, on transforme cette direction fixe en cap à suivre.",err:["Lire la boussole près d'un téléphone, d'une voiture ou d'une clôture métallique.","Viser un repère proche et le perdre de vue."],ok:"Vous arrivez au repère visé et pouvez dire où vous êtes sur la carte.",alt:["Pas de boussole : orientez la carte avec le soleil, les étoiles ou la méthode du bâton.","Pas de carte : tracez un croquis de mémoire avec les grands repères (routes, rivières, villages)."],req:[["boussole","carte"]]},
"tenir-cap":{why:"Sans repère, on dévie toujours du même côté (jambe plus forte). Viser des repères successifs corrige cette dérive en permanence.",err:["Marcher en regardant ses pieds.","Oublier de corriger la longueur du pas en montée."],ok:"Vous atteignez le point visé avec moins de 10 % d'erreur sur la distance estimée.",alt:[],req:[]},
"indices-naturels":{why:"Soleil, vent et humidité laissent des traces sur la nature, mais beaucoup d'autres facteurs interviennent : chaque indice seul peut tromper.",err:["Se fier uniquement à la mousse.","Ignorer le soleil quand il est visible."],ok:"Au moins trois indices différents pointent dans la même direction.",alt:[],req:[]},
"temps-avant-nuit":{why:"Le soleil descend d'environ un doigt tendu tous les quarts d'heure : la main devient une horloge.",err:["Oublier qu'en forêt ou en vallée, il fait sombre bien avant le coucher.","Regarder le soleil en face."],ok:"Vous savez si vous avez le temps d'atteindre votre but ou s'il faut monter le bivouac maintenant.",alt:[],req:[]},
/* ---------- SIGNALISATION ---------- */
"signaux-sol":{why:"Vu d'avion, une personne est un point invisible. Des formes géométriques immenses et contrastées n'existent pas dans la nature : elles attirent immédiatement l'œil.",err:["Faire des lettres trop petites (moins de 3 m).","Choisir des matériaux de la même couleur que le sol."],ok:"Depuis un point en hauteur, vous lisez clairement le signal à 100 m.",alt:["Pas de matériaux colorés : creusez des tranchées (l'ombre dessine les lettres) ou piétinez la neige ou l'herbe haute."],req:[]},
"miroir":{why:"Un miroir renvoie la lumière du soleil : le reflet est visible à des dizaines de kilomètres, bien plus qu'un vêtement coloré.",err:["Flasher au hasard sans viser.","Arrêter de balayer l'horizon parce qu'on ne voit personne."],ok:"Vous voyez la tache de lumière passer précisément sur la cible à travers votre V de doigts.",alt:["Pas de miroir : CD, écran de téléphone, couvercle de boîte, couverture de survie, boucle de ceinture."],req:[["miroir"]]},
"feux-signal":{why:"Trois feux en triangle ne sont pas un feu de camp ordinaire : c'est le signal de détresse international. La fumée contraste avec le fond.",err:["Attendre d'entendre l'avion pour commencer à préparer les foyers.","Fumée blanche sur fond de neige : invisible."],ok:"Vos trois foyers sont prêts, protégés de la pluie, et s'allument en quelques secondes.",alt:[],req:[["briquet","ferro"]]},
"sifflet":{why:"Le son aigu d'un sifflet porte jusqu'à un kilomètre et demande peu d'effort, contrairement aux cris.",err:["Crier jusqu'à perdre la voix.","Siffler n'importe comment au lieu du signal codé."],ok:"Vous savez faire le signal de détresse et vous l'utilisez à intervalles réguliers.",alt:["Pas de sifflet : taper deux pierres, une casserole avec un bâton, un klaxon, ou siffler avec deux doigts."],req:[]},
"morse":{why:"La lumière en pleine obscurité se voit de très loin, et le rythme SOS est reconnu partout dans le monde.",err:["Clignoter trop vite : les signaux longs et courts se confondent.","Vider la batterie en signalant sans arrêt."],ok:"Vous savez produire ··· ——— ··· de façon régulière, avec les pauses.",alt:["Pas de lampe : écran de téléphone, phares de voiture, feu masqué et découvert avec une couverture."],req:[["lampe","vehicule"]]},
"signaux-corps":{why:"Le pilote ne vous entend pas. Les positions de bras normalisées permettent un dialogue simple, et une zone bien préparée évite les accidents à l'atterrissage.",err:["Agiter les bras dans tous les sens : le pilote peut comprendre qu'il n'y a pas d'urgence.","Courir vers l'hélicoptère."],ok:"Le pilote fait un signe (battement d'ailes, changement de cap) et la zone est dégagée de tout objet léger.",alt:[],req:[]},
/* ---------- PREMIERS SECOURS ---------- */
"hemorragie":{why:"Le sang ne coagule que si l'écoulement ralentit. La compression écrase le vaisseau contre l'os ; le garrot arrête totalement le flux vers le membre.",err:["Relâcher la pression pour regarder la plaie.","Garrot trop fin ou pas assez serré : le saignement continue ou empire."],ok:"Le saignement est arrêté, la victime est couverte, l'heure du garrot est notée et les secours sont prévenus.",alt:["Pas de garrot : bande de tissu large (cravate, foulard, manche) et un bâton solide.","Pas de compresses : t-shirt propre, serviette, tout tissu."],req:[]},
"attelle":{why:"Bloquer les articulations de part et d'autre empêche les morceaux d'os de bouger : c'est ce mouvement qui fait mal et abîme les vaisseaux et les nerfs.",err:["Attelle trop courte qui ne bloque qu'une articulation.","Serrer directement sur la fracture."],ok:"Le membre ne bouge plus, la douleur diminue et les doigts ou orteils restent roses et chauds.",alt:["Pas de bâtons : carton épais, magazine roulé, tapis de sol, ou attachez la jambe blessée à la jambe saine."],req:[]},
"hypothermie":{why:"Le corps perd la chaleur par le sol, le vent et l'humidité. On arrête d'abord ces pertes, puis on apporte de la chaleur au tronc, là où sont les organes vitaux.",err:["Frictionner les membres ou donner de l'alcool.","Laisser la personne assise sur le sol froid."],ok:"La personne frissonne à nouveau, parle plus clairement et se réchauffe progressivement.",alt:["Pas de sac de couchage : plusieurs couches de vêtements, feuilles sèches, couverture de survie, contact peau à peau.","Pas de bouillotte : bouteille remplie d'eau chaude enveloppée dans une chaussette."],req:[]},
"brulures":{why:"La peau continue à cuire après la brûlure. L'eau tempérée arrête ce processus et diminue la douleur et la profondeur de la lésion.",err:["Mettre de la glace directement ou de l'eau glacée.","Arrêter le refroidissement après 2 minutes parce que ça fait moins mal."],ok:"La zone a été refroidie 20 minutes, couverte sans serrer, et vous savez si elle nécessite un médecin.",alt:["Pas de pansement non adhésif : film alimentaire, sac plastique propre, tissu propre humidifié."],req:[]},
"pls":{why:"Sur le côté, la langue ne bloque plus la gorge et les vomissements éventuels s'écoulent par la bouche au lieu d'étouffer la victime.",err:["Mettre en PLS une personne qui ne respire pas : il faut masser.","Oublier de surveiller la respiration ensuite."],ok:"La personne est stable sur le côté, bouche vers le sol, et vous la voyez respirer.",alt:[],req:[]},
"rcp":{why:"Les compressions font circuler le sang et l'oxygène vers le cerveau quand le cœur s'est arrêté. Le défibrillateur peut relancer un rythme normal.",err:["Compressions trop douces ou trop lentes.","S'arrêter pour vérifier le pouls."],ok:"Vous comprimez fort et vite sans interruption jusqu'à l'arrivée des secours ou du défibrillateur.",alt:["Pas de défibrillateur : continuez les compressions seules, c'est ce qui compte le plus."],req:[]},
"etouffement":{why:"Les claques dans le dos et les compressions abdominales créent une poussée d'air brutale qui expulse l'objet coincé.",err:["Taper dans le dos d'une personne qui tousse encore efficacement.","Mettre les doigts dans la gorge à l'aveugle."],ok:"L'objet est expulsé et la personne respire et parle à nouveau.",alt:[],req:[]},
"plaies":{why:"Ce sont la terre et les bactéries restées dans la plaie qui causent l'infection. Rincer abondamment est plus important que le désinfectant.",err:["Fermer une plaie sale.","Rincer avec trop peu d'eau."],ok:"La plaie est propre, sans débris, couverte, et vous la surveillez chaque jour.",alt:["Pas d'eau potable : eau bouillie refroidie.","Pas de désinfectant : un rinçage abondant à l'eau propre et au savon suffit souvent."],req:[]},
"morsures":{why:"Plus une tique reste accrochée, plus le risque de transmission augmente : la retirer vite est le geste clé. Pour une vipère, l'immobilité ralentit la diffusion du venin.",err:["Mettre de l'éther ou de l'alcool sur la tique : elle régurgite.","Inciser ou aspirer une morsure de vipère."],ok:"La tique est retirée entière, la date est notée ; ou la victime de vipère est allongée, calme, membre immobilisé, secours prévenus.",alt:["Pas de tire-tique : pince fine, ou boucle de fil fin passée sous la tête et tirée doucement."],req:[]},
"gelures":{why:"Les tissus gelés contiennent des cristaux de glace : on les réchauffe doucement et une seule fois, car un nouveau gel les détruit.",err:["Frotter avec de la neige.","Réchauffer alors qu'on va devoir repartir dans le froid."],ok:"La peau redevient souple, rose et sensible après le bain tiède.",alt:["Pas d'eau tiède : contact peau à peau (aisselle, ventre d'un compagnon)."],req:[]},
});

Object.assign(ENR,{
/* ---------- SOINS SANS SECOURS ---------- */
"bilan-blesse":{why:"Certaines blessures tuent en minutes (respiration, hémorragie), d'autres en heures ou en jours. Un examen dans un ordre fixe garantit de ne pas soigner une cheville pendant qu'une hémorragie continue.",err:["Se précipiter sur la blessure la plus visible au lieu de vérifier d'abord la respiration et les saignements.","Ne rien noter : impossible de voir si l'état s'aggrave."],ok:"Vous avez vérifié danger, conscience, respiration, saignements, puis le corps entier, et noté l'heure de chaque observation.",alt:["Pas de gants : un sac plastique sur chaque main."],req:[]},
"evacuer-attendre":{why:"La plupart des blessures peuvent attendre les secours ; certains signes montrent au contraire que le temps joue contre la victime.",err:["Attendre « de voir comment ça évolue » quand un signe d'alarme est présent.","Laisser une victime seule sans eau, sans chaleur et sans moyen de signaler."],ok:"Vous savez dire en une phrase pourquoi vous attendez ou pourquoi vous évacuez.",alt:[],req:[]},
"trousse-soins":{why:"Une trousse pensée pour l'autonomie couvre les problèmes les plus fréquents (plaies, douleur, diarrhée, allergies) quand la pharmacie est inaccessible.",err:["Garder des médicaments périmés ou dont personne ne connaît la dose.","Oublier les traitements chroniques du foyer."],ok:"Tout est rangé, daté, et chaque adulte du foyer sait où est la trousse et comment utiliser chaque élément.",alt:[],req:[]},
"entorse":{why:"Le froid et la compression limitent le gonflement ; le repos évite d'aggraver la déchirure des ligaments.",err:["Masser ou chauffer l'articulation les premiers jours.","Bander trop serré : les orteils deviennent froids ou bleus."],ok:"Le gonflement n'augmente plus et les orteils restent roses, chauds et sensibles.",alt:["Pas de bande élastique : t-shirt découpé en bandes, foulard.","Pas de glace : eau de ruisseau froide dans un sac, ou linge mouillé au vent."],req:[]},
"fermer-plaie":{why:"Des bords rapprochés cicatrisent plus vite et laissent une cicatrice plus fine ; mais une plaie fermée sale enferme les bactéries.",err:["Fermer une plaie sale, profonde ou une morsure.","Coller les strips sur une peau humide : ils se décollent."],ok:"Les bords se touchent sans se chevaucher, la plaie ne saigne plus et ne rougit pas les jours suivants.",alt:["Pas de strips : papillons découpés dans du ruban adhésif.","Doute sur la propreté : ne fermez pas, couvrez simplement."],req:[]},
"fracture-ouverte":{why:"L'os sorti fait une porte d'entrée aux bactéries jusqu'au cœur de l'os : la priorité est d'arrêter le saignement, de couvrir proprement et de ne plus bouger le membre.",err:["Appuyer sur l'os pour arrêter le sang.","Essayer de remettre l'os dans la plaie."],ok:"Le saignement est contrôlé, la plaie est couverte, le membre immobilisé et l'évacuation en route.",alt:[],req:[]},
"luxation":{why:"Une articulation déboîtée comprime nerfs et vaisseaux. Immobiliser dans la position de confort limite les dégâts jusqu'à la réduction par un professionnel.",err:["Tirer sur le membre pour « remettre en place ».","Forcer la victime à garder une position qui lui fait mal."],ok:"Le membre est soutenu, la douleur est supportable, et les doigts restent roses et sensibles.",alt:["Pas d'écharpe : retournez le bas du t-shirt de la victime sur son bras et épinglez-le, ou utilisez une veste."],req:[]},
"ampoules":{why:"Une ampoule naît d'un frottement répété. Couvrir la peau au premier échauffement coupe ce frottement avant que la peau ne se décolle.",err:["Continuer à marcher avec un « point chaud ».","Arracher la peau de l'ampoule."],ok:"Vous pouvez marcher sans douleur vive et la zone ne rougit pas autour.",alt:["Pas de pansement spécial : ruban adhésif lisse (duct tape) posé sans plis."],req:[]},
"saignement-nez":{why:"La plupart des saignements viennent de petits vaisseaux à l'avant du nez : les comprimer 10 minutes laisse le temps au caillot de se former.",err:["Pencher la tête en arrière.","Relâcher la pression toutes les 30 secondes pour vérifier."],ok:"Après 10 minutes de pression continue, le nez ne saigne plus.",alt:[],req:[]},
"etat-choc":{why:"En cas de choc, le corps manque de sang pour les organes. Arrêter la perte, garder au chaud et allonger aide le sang à aller vers le cerveau et le cœur.",err:["Faire boire la victime.","La laisser sur le sol froid sans isolant."],ok:"La victime est allongée, isolée du sol, couverte, la cause traitée, et vous la surveillez sans arrêt.",alt:[],req:[]},
"trauma-tete":{why:"Un saignement à l'intérieur du crâne peut grossir lentement : les signes apparaissent parfois des heures après un choc qui semblait bénin.",err:["Laisser la personne dormir toute la nuit sans la réveiller.","La laisser reprendre l'effort tout de suite."],ok:"Vous avez une fiche de surveillance avec l'heure et l'état à chaque contrôle, et aucun signe d'alarme.",alt:["Pas de lampe : vérifiez les pupilles en couvrant puis découvrant les yeux à la lumière du jour."],req:[]},
"diarrhee":{why:"La diarrhée tue par la perte d'eau et de sels, pas par l'infection elle-même. La solution sucrée-salée compense ces pertes.",err:["Arrêter de boire parce qu'on vomit.","Boire de l'eau non purifiée et recontaminer tout le groupe."],ok:"Les urines restent claires et la personne garde ce qu'elle boit.",alt:["Pas de sucre : miel, jus de fruit dilué, eau de riz salée.","Pas de cuillère : une poignée de sucre et une pincée de sel (trois doigts) par litre."],req:[]},
"fievre":{why:"La fièvre aide le corps à combattre l'infection. On soulage le confort et on hydrate, mais l'essentiel est de chercher la cause et les signes de gravité.",err:["Couvrir excessivement une personne fiévreuse.","Utiliser de l'eau glacée sur la peau."],ok:"La personne boit, se repose, et vous connaissez sa température et son évolution.",alt:["Pas de thermomètre : touchez le front et la nuque avec le dos de la main, comparez avec une personne en bonne santé."],req:[]},
"mal-de-dents":{why:"Le sel désinfecte, le froid réduit l'inflammation et l'eugénol du clou de girofle endort localement le nerf.",err:["Mettre une bouillotte chaude sur la joue (aggrave un abcès).","Croquer de l'aspirine contre la gencive (brûle la muqueuse)."],ok:"La douleur devient supportable et il n'y a ni fièvre ni gonflement.",alt:["Pas de clou de girofle : rinçages à l'eau salée et froid sur la joue."],req:[]},
"corps-etranger-oeil":{why:"L'eau entraîne la poussière et dilue les produits chimiques ; frotter, au contraire, raye la cornée.",err:["Frotter l'œil.","Rincer 30 secondes seulement après un produit chimique."],ok:"La sensation de corps étranger disparaît et la vue est normale.",alt:["Pas de sérum : eau potable, eau minérale, eau bouillie refroidie."],req:[]},
"cecite-neiges":{why:"Les UV réfléchis par la neige brûlent la surface de l'œil, comme un coup de soleil. Une fente étroite limite la lumière qui entre.",err:["Ne rien porter par temps couvert.","Frotter les yeux douloureux."],ok:"Vos lunettes à fente vous permettent de voir le chemin sans plisser les yeux.",alt:["Pas d'écorce ni de carton : plusieurs couches de ruban adhésif, ou un tissu sombre avec deux petites fentes."],req:[]},
"pied-immersion":{why:"Le froid humide ralentit la circulation dans les pieds pendant des heures, ce qui abîme la peau et les nerfs, même sans gel.",err:["Garder les mêmes chaussettes mouillées plusieurs jours.","Réchauffer les pieds directement au feu."],ok:"Vos pieds sont secs et roses au moins une fois par jour, et vous avez toujours une paire de chaussettes sèches.",alt:["Pas de chaussettes de rechange : séchez la paire unique contre votre ventre la nuit et marchez pieds secs dans un sac plastique."],req:[]},
"coup-de-soleil":{why:"La peau brûlée continue à chauffer et perd de l'eau : la rafraîchir et hydrater la personne limite les dégâts.",err:["Retourner au soleil le lendemain sans couvrir la zone.","Percer les cloques."],ok:"La peau est rafraîchie, la personne boit, et la zone est couverte.",alt:["Pas d'aloe vera : linges humides et frais, crème hydratante neutre."],req:[]},
"coup-de-chaleur":{why:"Au-delà de 40 °C, le cerveau et les organes s'abîment rapidement. Seul un refroidissement rapide et continu arrête ce processus.",err:["Arrêter de refroidir dès que la personne va un peu mieux.","Donner à boire à une personne confuse."],ok:"La personne redevient consciente et cohérente, sa peau est plus fraîche au toucher.",alt:["Pas assez d'eau : éventez en continu une peau humidifiée avec un linge, à l'ombre."],req:[]},
"echardes":{why:"Retirer l'écharde dans l'axe où elle est entrée évite de la casser et de laisser un morceau dans la peau.",err:["Presser fort autour : l'écharde casse.","Utiliser une aiguille sale."],ok:"L'écharde est sortie entière et la zone est désinfectée.",alt:["Pas de pince : ruban adhésif collé puis arraché d'un coup sec pour les petites épines, ou deux ongles."],req:[]},
"morsure-animal":{why:"La salive d'un animal contient beaucoup de bactéries et parfois le virus de la rage. Un lavage long et abondant en élimine une grande partie.",err:["Rincer quelques secondes seulement.","Fermer la plaie avec des strips."],ok:"La plaie a été lavée au savon pendant 15 minutes, couverte, et une consultation est prévue.",alt:["Pas de savon : rinçage à l'eau courante abondante, le plus longtemps possible."],req:[]},
"reaction-allergique":{why:"L'adrénaline resserre les vaisseaux, ouvre les bronches et dégonfle la gorge en quelques minutes : c'est le seul traitement efficace d'une réaction grave.",err:["Attendre que ça passe quand le visage gonfle ou que la respiration devient difficile.","Laisser la personne seule après une amélioration."],ok:"L'adrénaline a été injectée, la respiration s'améliore et les secours sont prévenus.",alt:[],req:[]},
"toux-gorge":{why:"Le sel désinfecte la gorge, le miel enrobe et calme la toux, la vapeur humidifie les voies respiratoires.",err:["Donner du miel à un bébé de moins d'un an.","Faire une inhalation trop chaude."],ok:"La toux est moins fréquente et la personne arrive à dormir.",alt:["Pas de thym : menthe, sauge ou simplement de l'eau chaude avec du miel."],req:[]},
"infection-plaie":{why:"Le pus doit pouvoir sortir ; la chaleur attire le sang et les défenses du corps vers la zone et aide au drainage.",err:["Garder fermée une plaie qui suppure.","Ignorer une traînée rouge qui remonte."],ok:"La rougeur ne dépasse plus le trait de stylo et la douleur diminue.",alt:[],req:[]},
"hygiene-camp":{why:"La plupart des maladies en crise passent de main à bouche : mains sales, eau contaminée, toilettes trop proches de l'eau.",err:["Installer les toilettes en amont du point d'eau.","Partager gobelets et couverts avec une personne malade."],ok:"Toilettes éloignées et en aval, lavage des mains systématique, eau toujours purifiée.",alt:["Pas de savon : cendre fine de bois frottée puis rincée."],req:[]},
"plantes-medicinales":{why:"Certaines plantes contiennent des substances actives (salicine du saule, eugénol du girofle, thymol du thym) qui soulagent de petits maux.",err:["Confondre une plante de soin avec une toxique (achillée et ciguë).","Remplacer un traitement nécessaire par une plante."],ok:"Vous êtes certain de l'identification et vous utilisez la plante pour un mal léger.",alt:[],req:[]},
"douleur-sans-medicament":{why:"La douleur dépend du mouvement de la blessure, du gonflement et de l'état de stress : immobiliser, refroidir et rassurer agissent sur les trois.",err:["Chauffer une blessure récente.","Négliger l'effet du calme et de la présence."],ok:"La personne note sa douleur plus bas qu'avant (sur 10) après les gestes.",alt:[],req:[]},
"hypoglycemie":{why:"Le cerveau fonctionne au sucre : en manque, il se dérègle vite. Du sucre rapide le relance en quelques minutes.",err:["Donner à manger à une personne inconsciente.","Ne donner que du chocolat, trop lent à agir à cause du gras."],ok:"En 15 minutes, la personne redevient lucide, ne tremble plus et peut manger normalement.",alt:["Pas de sucre : miel, confiture, jus de fruit, soda non light, raisins secs."],req:[]},
"douleur-thoracique":{why:"Une crise cardiaque est due à une artère du cœur bouchée. Le repos réduit le travail du cœur et l'aspirine freine la formation du caillot.",err:["Laisser la personne marcher ou porter quelque chose.","Attendre que la douleur passe toute seule."],ok:"La personne est au repos, demi-assise, les secours sont prévenus et vous la surveillez sans quitter son côté.",alt:[],req:[]},
"crampes":{why:"Étirer le muscle en sens inverse de la contraction le force à se relâcher ; l'eau et le sel corrigent souvent la cause.",err:["Continuer l'effort malgré la crampe.","Masser violemment."],ok:"Le muscle se relâche et vous pouvez reprendre doucement.",alt:[],req:[]},
});

Object.assign(ENR,{
/* ---------- NŒUDS ---------- */
"noeud-simple":{why:"La corde fait une boucle sur elle-même et se bloque par frottement : la bosse obtenue ne passe plus dans un trou ou un œillet.",err:["Le faire sur une corde qu'on voudra dénouer après une forte charge.","Le confondre avec un vrai nœud d'arrêt de sécurité (préférez le huit)."],ok:"Le nœud est serré, net, et ne glisse pas à travers l'œillet quand vous tirez.",alt:[],req:["corde"]},
"noeud-huit":{why:"La corde fait un tour de plus que dans le nœud simple : la bosse est plus grosse et la charge se répartit mieux, ce qui le rend facile à défaire.",err:["Faire un nœud simple en croyant faire un huit.","Laisser une extrémité trop courte."],ok:"Vous voyez clairement un 8 dans le nœud et il se défait facilement après avoir été tiré fort.",alt:[],req:["corde"]},
"noeud-huit-boucle":{why:"Le huit doublé crée une boucle qui ne coulisse pas ; ses brins parallèles se vérifient d'un coup d'œil.",err:["Brins croisés au lieu d'être bien parallèles (« mal peigné »).","Extrémité trop courte après le nœud."],ok:"Chaque brin suit son jumeau sans croisement et il reste au moins 10 cm de queue.",alt:[],req:["corde"]},
"noeud-chaise":{why:"La boucle est bloquée par le passage de l'extrémité autour du brin principal : plus on tire, plus le nœud se serre sur lui-même, mais la boucle garde sa taille.",err:["Passer le « lapin » autour de l'arbre dans le mauvais sens : la boucle coulisse.","Le laisser battre sans charge pendant longtemps."],ok:"La boucle garde sa taille quand vous tirez fort et le nœud s'ouvre facilement en « cassant le dos ».",alt:[],req:["corde"]},
"noeud-cabestan":{why:"Deux tours croisés se pincent l'un l'autre sur le support : la traction serre le nœud, mais on peut le régler en le desserrant.",err:["Tours qui ne se croisent pas : le nœud se défait.","Utiliser seul sur un support qui tourne."],ok:"Le nœud tient sous traction et vous pouvez faire glisser la corde à la main pour régler la longueur.",alt:[],req:["corde"]},
"noeud-demi-cles":{why:"Le tour mort prend la plus grosse partie de la charge par frottement ; les demi-clés empêchent seulement l'extrémité de ressortir.",err:["Demi-clés en sens opposés.","Oublier le tour mort : les demi-clés seules glissent."],ok:"Le nœud tient sous traction forte et se défait facilement une fois relâché.",alt:[],req:["corde"]},
"noeud-tendeur":{why:"La boucle coulisse librement quand on la pousse, mais sous tension les tours se coincent et bloquent la corde.",err:["Trop peu de tours : le nœud glisse sous la charge.","Le faire sur une corde trop raide ou trop glissante."],ok:"Vous poussez le nœud pour tendre le hauban et il ne recule pas quand vous lâchez.",alt:[],req:["corde"]},
"noeud-plat":{why:"Les deux boucles s'emboîtent symétriquement et se serrent à plat : idéal pour un bandage qui ne doit pas faire de bosse.",err:["Faire un nœud de vache (les deux demi-nœuds dans le même sens) qui glisse.","S'en servir pour relier deux cordes qui vont porter du poids."],ok:"Le nœud est plat et symétrique, les deux extrémités sortent du même côté.",alt:[],req:[["corde","tissu"]]},
"noeud-ecoute":{why:"La corde fine s'enroule autour de la boucle de la corde épaisse et se coince sur elle-même : elle ne peut pas glisser même si les diamètres sont différents.",err:["Faire la boucle avec la corde fine au lieu de la grosse.","Extrémités sortant de côtés opposés."],ok:"Les deux cordes tiennent sous traction et les extrémités sortent du même côté.",alt:[],req:["corde"]},
"noeud-pecheur":{why:"Chaque corde fait un nœud autour de l'autre ; sous traction, les deux nœuds se rapprochent et se bloquent mutuellement.",err:["Faire les deux nœuds dans un sens différent : ils ne s'emboîtent pas.","Couper les extrémités trop court."],ok:"Les deux nœuds se touchent et forment un ensemble symétrique.",alt:[],req:["corde"]},
"noeud-bois":{why:"La corde s'enroule sur elle-même autour de l'objet : la traction serre les tours, et dès qu'on relâche, tout se libère.",err:["Trop peu de tours : le nœud glisse.","L'utiliser pour une attache permanente."],ok:"Vous traînez une bûche sans que le nœud glisse et il se défait seul quand vous lâchez.",alt:[],req:["corde"]},
"noeud-camionneur":{why:"La boucle sert de poulie : la corde fait un aller-retour, ce qui multiplie à peu près par deux la force de traction.",err:["Boucle qui se resserre et bloque le système.","Se placer dans l'axe de la corde en tirant."],ok:"La corde est tendue comme une barre et ne se détend pas une fois bloquée.",alt:[],req:["corde"]},
"noeud-prusik":{why:"Les tours de cordelette serrent la corde principale dès qu'on tire dessus : le frottement bloque, mais sans charge le nœud coulisse.",err:["Cordelette aussi grosse que la corde principale : ça ne bloque pas.","Trop peu de tours."],ok:"Le nœud glisse à la main et se bloque net quand vous suspendez votre sac dessus.",alt:[],req:["corde"]},
"brelage-carre":{why:"Les tours serrés puis les tours de serrage entre les perches compriment l'ensemble : le frottement empêche les perches de tourner.",err:["Oublier les tours de serrage entre les perches.","Partir d'un nœud qui glisse sur la perche."],ok:"Les deux perches ne bougent plus l'une par rapport à l'autre, même en forçant.",alt:[],req:["corde"]},
"brelage-trepied":{why:"Les perches liées puis écartées se coincent sur les tours de corde : plus on écarte, plus le trépied se bloque.",err:["Serrer trop fort : impossible d'écarter les perches.","Pieds trop rapprochés : le trépied bascule."],ok:"Le trépied tient debout seul et supporte une gamelle pleine sans glisser.",alt:[],req:["corde"]},
"noeud-palomar":{why:"Le fil passe deux fois dans l'œillet de l'hameçon : la charge est partagée entre deux brins, ce qui le rend très résistant même sur fil glissant.",err:["Serrer à sec : le fil chauffe et s'affaiblit (mouillez-le).","Croiser les brins dans l'œillet."],ok:"Le nœud est serré, net, et l'hameçon tient quand vous tirez fort.",alt:[],req:["peche"]},
"noeud-coulant":{why:"L'extrémité passe dans une boucle : quand on tire, la boucle glisse et se referme sur ce qu'elle entoure.",err:["S'en servir autour d'une personne.","Boucle qui coince et ne coulisse pas."],ok:"La boucle glisse facilement et se ferme dès que vous tirez sur le brin.",alt:[],req:["corde"]},
"noeud-papillon":{why:"La boucle est verrouillée par un double croisement : elle supporte des tractions dans trois directions sans coulisser.",err:["Croisements mal faits : la boucle glisse.","Le confondre avec un nœud simple en boucle."],ok:"Vous tirez sur la boucle et les deux brins dans tous les sens sans que le nœud bouge.",alt:[],req:["corde"]},
"noeud-alouette":{why:"Une boucle refermée sur elle-même entoure l'objet : simple et rapide, il tient tant que la traction est droite.",err:["L'utiliser pour une charge de sécurité.","Charge latérale qui le fait glisser."],ok:"La boucle est fixée, serrée, et tient sous une traction dans l'axe.",alt:[],req:["corde"]},
"brelage-diagonal":{why:"Les tours en diagonale rapprochent deux perches qui s'écartent et les maintiennent en croix rigide.",err:["Ne pas commencer par le nœud de bois qui rapproche les perches.","Oublier les tours de serrage."],ok:"Les deux perches se croisent sans jeu et le renfort tient.",alt:[],req:["corde"]},
});

CRAFTS.push(
/* ----- ÉLECTRICITÉ ----- */
{id:"bilan-electrique",cat:"energie",art:"e_bilan",t:"Calculer ses besoins en électricité",diff:1,time:"20 min",
s:"Avant d'acheter une batterie ou un panneau, savoir combien d'énergie il vous faut vraiment pour tenir une coupure.",
mat:["Papier et crayon","Étiquettes des appareils (puissance en W)","Le tableau ci-dessous"],
steps:["Listez seulement les appareils indispensables pendant une coupure : téléphone, lampes, radio, box internet, appareil médical, éventuellement le frigo.","Relevez la puissance de chacun en watts (W) sur son étiquette ou son chargeur. Si seuls les volts (V) et ampères (A) sont indiqués : W = V × A.","Estimez combien d'heures par jour chaque appareil fonctionnera.","Calculez l'énergie : puissance (W) × durée (h) = énergie en wattheures (Wh). Une lampe LED de 5 W allumée 5 h consomme 25 Wh.","Ordres de grandeur : recharge de smartphone 10 à 20 Wh ; radio 1 à 5 Wh par heure ; box internet 10 à 15 W ; ordinateur portable 40 à 60 Wh par charge ; frigo récent 0,5 à 1 kWh par jour (500 à 1 000 Wh).","Additionnez tout : vous obtenez votre besoin quotidien en Wh. Multipliez par le nombre de jours à tenir.","Ajoutez une marge de 30 % pour les pertes (convertisseur, froid, vieillissement des batteries).","Comparez avec vos réserves : capacité d'une batterie (Wh) = tension (V) × capacité (Ah). Une batterie externe de 20 000 mAh à 3,7 V contient environ 74 Wh."],
tips:["Sans frigo, la plupart des foyers tiennent avec 50 à 150 Wh par jour : téléphones, lampes et radio.","Notez le résultat dans votre fiche familiale : vous saurez quoi acheter et quoi couper en premier."],
warn:["Les appareils de chauffage électrique (radiateur, bouilloire, plaque) consomment énormément : 1 000 à 2 000 W. Aucune petite réserve ne peut les alimenter longtemps.","Appareil médical vital (oxygène, respirateur) : signalez-le à votre fournisseur d'électricité et à votre médecin, et prévoyez une solution validée par eux."],
why:"L'énergie se mesure comme l'eau d'un réservoir : la puissance est le débit (W), la durée multiplie ce débit, et le résultat (Wh) dit combien de « litres d'électricité » il vous faut.",err:["Confondre W et Wh : un panneau de 100 W ne fournit pas 100 Wh par heure en hiver.","Oublier les pertes du convertisseur (10 à 20 %)."],ok:"Vous avez un chiffre en Wh par jour et vous savez quels appareils couper en priorité si la réserve baisse.",alt:[],req:[]},
{id:"economiser-telephone",cat:"energie",art:"e_tel",t:"Faire durer la batterie du téléphone",diff:1,time:"5 min",
s:"Votre téléphone est votre lien avec les secours et vos proches. Bien réglé, il tient plusieurs jours au lieu d'un.",
mat:["Téléphone","Batterie externe (facultatif)"],
steps:["Activez le mode économie d'énergie maximal (ou « ultra »).","Baissez la luminosité au minimum lisible et réduisez la mise en veille de l'écran à 30 secondes.","Désactivez Wi-Fi, Bluetooth, localisation et données mobiles quand vous ne vous en servez pas.","Si le réseau est très faible, passez en mode avion et rallumez le réseau seulement 5 minutes toutes les heures : chercher un réseau vide la batterie.","Fermez les applications, coupez les notifications, désactivez la vibration.","Préférez les SMS aux appels et aux applications : ils passent mieux sur un réseau saturé et consomment très peu.","Gardez le téléphone au chaud, contre vous : le froid fait chuter la batterie.","Rechargez dès qu'une occasion se présente (voiture, batterie externe, lieu public équipé)."],
tips:["Un téléphone éteint ne consomme presque rien : convenez avec vos proches d'heures fixes pour l'allumer.","Téléchargez à l'avance les cartes hors ligne de votre région."],
warn:["Gardez toujours une réserve d'au moins 20 % pour un éventuel appel au 112."],
why:"L'écran, la radio qui cherche le réseau et le GPS sont les trois plus gros consommateurs. Les couper multiplie l'autonomie.",err:["Laisser le téléphone chercher un réseau inexistant toute la journée.","Passer son temps sur les réseaux sociaux pendant la coupure."],ok:"Votre batterie perd moins de 10 % en une heure de veille.",alt:["Pas de batterie externe : rechargez dans la voiture moteur tournant, à l'extérieur."],req:[]},
{id:"batterie-voiture",cat:"energie",art:"e_batt",t:"Utiliser une batterie de voiture comme réserve",diff:2,time:"15 min",
s:"Une batterie de voiture chargée contient de quoi recharger des dizaines de téléphones et alimenter des lampes pendant des jours.",
mat:["Batterie 12 V chargée (dans la voiture ou sortie)","Chargeur USB pour prise allume-cigare ou pinces","Convertisseur 12 V → 230 V (petits appareils)","Multimètre (idéal)"],
steps:["Comprenez ce qu'elle contient : une batterie de 60 Ah sous 12 V stocke environ 720 Wh, mais une batterie de démarrage ne doit être vidée qu'à moitié, soit environ 300 Wh utilisables.","Le plus simple : branchez un chargeur USB sur la prise allume-cigare (contact mis en position accessoires si nécessaire) pour recharger téléphones, lampes et radio.","Pour des appareils 230 V de faible puissance (ordinateur portable, box internet), utilisez un convertisseur : jusqu'à environ 150 W sur la prise allume-cigare ; au-delà, il se branche directement sur les bornes avec des pinces.","Branchez d'abord la borne rouge (+), puis la noire (−). Débranchez dans l'ordre inverse.","Surveillez la tension au multimètre, appareils débranchés depuis quelques minutes : 12,6 V = pleine ; 12,2 V = à moitié ; en dessous de 12,0 V, arrêtez pour garder de quoi démarrer.","Rechargez la batterie en faisant tourner le moteur dehors (voir la fiche dédiée) ou avec un panneau solaire et un régulateur."],
tips:["Une batterie à décharge lente (« décharge profonde », camping-car, bateau) supporte bien mieux d'être vidée qu'une batterie de démarrage.","Un booster de démarrage au lithium avec prise USB fait aussi office de batterie externe."],
warn:["Ne court-circuitez jamais les deux bornes : étincelles, brûlures, risque d'explosion.","Une batterie au plomb en charge dégage de l'hydrogène inflammable : ventilez, pas de flamme ni d'étincelle à proximité.","L'acide brûle la peau et les yeux : batterie fissurée ou qui fuit, ne la manipulez pas."],
why:"La batterie stocke l'énergie sous forme chimique et la rend en courant continu 12 V, que les chargeurs USB et convertisseurs transforment pour vos appareils.",err:["Vider complètement la batterie de démarrage : la voiture ne repart plus et la batterie s'abîme.","Brancher un radiateur ou une bouilloire sur un convertisseur : la batterie est vide en quelques minutes."],ok:"Vos appareils se rechargent et la tension reste au-dessus de 12,0 V.",alt:["Pas de convertisseur : utilisez uniquement des appareils rechargeables en USB.","Pas de chargeur allume-cigare : lampe 12 V de camping branchée avec pinces."],req:["batterie",["usb12","convertisseur"]]},
{id:"recharger-voiture",cat:"energie",art:"e_voiture",t:"Recharger ses appareils avec la voiture",diff:1,time:"30 min à 1 h",
s:"Pendant une longue coupure, la voiture devient un générateur : le moteur recharge la batterie et vos appareils.",
mat:["Voiture avec du carburant","Chargeur USB allume-cigare","Convertisseur 12 V → 230 V (facultatif)"],
steps:["Garez la voiture DEHORS, jamais dans un garage même porte ouverte, loin des fenêtres et des entrées d'air.","Vérifiez que le pot d'échappement est dégagé (neige, feuilles, eau).","Démarrez le moteur et laissez-le tourner au ralenti.","Branchez chargeur USB ou convertisseur et rechargez en priorité téléphones, batteries externes et lampes.","Comptez 20 à 30 minutes de moteur par heure de recharge intensive ; un convertisseur de 150 W suffit pour un ordinateur portable.","Coupez le moteur dès que les appareils prioritaires sont chargés pour économiser le carburant.","Restez à proximité ; ne dormez jamais dans une voiture moteur tournant dans un espace clos."],
tips:["Un ralenti consomme environ 0,5 à 1 litre de carburant par heure selon le moteur.","Les voitures hybrides et électriques peuvent souvent alimenter des appareils sans moteur thermique : consultez la notice (fonction prise 230 V ou « V2L »)."],
warn:["Le monoxyde de carbone est invisible et sans odeur : maux de tête, nausées, somnolence = sortez à l'air libre immédiatement et appelez le 112.","Ne laissez jamais d'enfant ou d'animal dans une voiture moteur tournant."],
why:"L'alternateur, entraîné par le moteur, produit du courant qui recharge la batterie et alimente la prise 12 V.",err:["Faire tourner le moteur dans le garage « juste dix minutes ».","Laisser le moteur tourner des heures pour une seule recharge de téléphone."],ok:"Vos appareils prioritaires sont chargés et le moteur a tourné le moins longtemps possible, dehors.",alt:["Pas de chargeur allume-cigare : beaucoup de voitures récentes ont des prises USB intégrées."],req:["vehicule"]},
{id:"kit-solaire",cat:"energie",art:"e_solaire",t:"Monter un petit kit solaire 12 V",diff:2,time:"1 à 2 h",
s:"Un panneau, un régulateur et une batterie : une source d'électricité autonome et silencieuse pour l'éclairage et les recharges.",
mat:["Panneau solaire 12 V (50 à 200 W)","Régulateur de charge solaire (PWM ou MPPT)","Batterie 12 V à décharge lente ou lithium LiFePO4","Câbles de section adaptée et cosses","Fusibles (entre batterie et régulateur)","Chargeur USB 12 V ou convertisseur"],
steps:["Placez le panneau plein sud, sans ombre (même une branche sur une seule cellule fait chuter la production). En Belgique, inclinez-le d'environ 35° ; plus redressé en hiver.","Branchez TOUJOURS le régulateur à la batterie en premier, pour qu'il reconnaisse la tension, puis le panneau, puis les appareils sur la sortie du régulateur.","Placez un fusible sur le câble positif, le plus près possible de la batterie.","Respectez les couleurs : rouge = +, noir = −. Vérifiez au multimètre avant de serrer.","Branchez vos appareils 12 V et chargeurs USB sur la sortie « charge » du régulateur : il coupera automatiquement avant que la batterie soit trop vide.","Pour débrancher : appareils d'abord, puis panneau, puis batterie en dernier.","Nettoyez le panneau (poussière, neige) et surveillez la tension de la batterie chaque jour."],
tips:["En décembre, un panneau produit 5 à 10 fois moins qu'en juin : dimensionnez pour l'hiver ou acceptez de réduire votre consommation.","Un régulateur MPPT tire 10 à 30 % d'énergie en plus d'un panneau qu'un régulateur PWM."],
warn:["Ne branchez jamais un panneau directement sur une batterie sans régulateur : surcharge, gonflement, risque d'incendie.","Un panneau au soleil produit du courant dès qu'il est éclairé : couvrez-le pour travailler sur les câbles.","Les batteries lithium doivent être chargées avec un régulateur réglé pour le lithium et jamais en dessous de 0 °C."],
why:"Le panneau transforme la lumière en courant, le régulateur dose la charge pour protéger la batterie, et la batterie garde l'énergie pour la nuit et les jours gris.",err:["Brancher le panneau avant la batterie sur le régulateur.","Câbles trop fins : ils chauffent et font perdre de l'énergie."],ok:"Le régulateur indique « en charge » au soleil et la tension de la batterie remonte en journée.",alt:["Pas de régulateur ni de batterie : panneau USB pliable qui recharge directement téléphone et batterie externe."],req:["panneau",["regulateur","powerbank"]]},
{id:"station-portable",cat:"energie",art:"e_station",t:"Batterie externe et station électrique portable",diff:1,time:"10 min",
s:"Choisir, entretenir et utiliser au mieux les batteries portables, de la petite batterie USB à la station de plusieurs centaines de Wh.",
mat:["Batterie externe ou station portable","Câbles adaptés","Source de recharge (prise, voiture, panneau)"],
steps:["Lisez la capacité en Wh (ou mAh à 3,7 V) : une batterie de 10 000 mAh recharge environ 2 smartphones, une station de 300 Wh recharge une trentaine de fois un téléphone ou fait tourner un ordinateur portable une demi-journée.","Rechargez-la complètement dès qu'une coupure est annoncée (tempête, alerte).","Pour un stockage long, laissez-la chargée entre 50 et 80 % et rechargez-la tous les 3 mois.","En coupure, utilisez de préférence ses prises USB et 12 V : la prise 230 V gaspille 10 à 20 % en conversion.","Ne dépassez jamais la puissance maximale indiquée (en W) sur la prise 230 V.","Rechargez la station avec un panneau solaire compatible ou la prise 12 V de la voiture moteur tournant."],
tips:["Rangez une petite batterie chargée dans votre sac d'urgence.","Une station avec sortie « pure sinus » convient aux appareils sensibles (appareils médicaux, ordinateurs)."],
warn:["Ne la laissez pas en plein soleil ou dans une voiture surchauffée.","Batterie gonflée, chaude ou qui sent le brûlé : ne l'utilisez plus, placez-la dehors loin de tout ce qui brûle."],
why:"Ces batteries au lithium gardent bien leur charge et fournissent directement les tensions dont les appareils ont besoin, sans bruit ni gaz.",err:["La découvrir vide le jour de la coupure.","Brancher un appareil chauffant (bouilloire, sèche-cheveux) qui dépasse sa puissance."],ok:"Votre batterie est chargée, vous savez combien de recharges de téléphone elle peut faire.",alt:[],req:["powerbank"]},
{id:"groupe-electrogene",cat:"energie",art:"e_groupe",t:"Utiliser un groupe électrogène en sécurité",diff:2,time:"15 min",
s:"Un groupe électrogène peut faire tourner un frigo ou une pompe, mais il tue chaque année par le monoxyde de carbone et l'électrocution.",
mat:["Groupe électrogène","Carburant adapté dans un jerrican homologué","Rallonges électriques extérieures de bonne section","Détecteur de monoxyde de carbone dans la maison"],
steps:["Installez le groupe DEHORS, à l'air libre, à au moins 6 m de toute porte, fenêtre ou prise d'air. Jamais dans la maison, le garage, la cave, une véranda ou un abri fermé.","Protégez-le de la pluie par un toit ouvert sur les côtés, pas par une bâche qui l'enferme.","Branchez les appareils directement sur le groupe avec des rallonges extérieures, en déroulant entièrement les enrouleurs.","Ne dépassez pas sa puissance : additionnez les watts des appareils ; un frigo demande 3 à 5 fois sa puissance au démarrage.","Démarrez le groupe sans charge, puis branchez les appareils un par un, du plus gros au plus petit.","Faites le plein moteur ARRÊTÉ et refroidi, loin de toute flamme.","Faites-le tourner par périodes (par exemple 1 h toutes les 4 h pour un frigo fermé) pour économiser le carburant."],
tips:["Un détecteur de monoxyde de carbone à piles dans la maison coûte peu et sauve des vies.","Notez sur le groupe le type de carburant et le mélange d'huile s'il s'agit d'un moteur 2 temps."],
warn:["NE BRANCHEZ JAMAIS le groupe sur une prise de la maison (câble « mâle-mâle ») : le courant repart dans le réseau, peut électrocuter les techniciens qui réparent la ligne et détruire votre installation. Un raccordement au tableau électrique exige un inverseur de source installé par un électricien.","Maux de tête, vertiges, nausées chez plusieurs personnes : monoxyde de carbone probable. Aérez, sortez tout le monde, appelez le 112 depuis l'extérieur.","Pas de groupe sous la pluie sans protection, ni les mains mouillées."],
why:"Le moteur brûle du carburant pour faire tourner un alternateur ; cette combustion rejette du monoxyde de carbone, un gaz invisible qui empêche le sang de transporter l'oxygène.",err:["Le mettre dans le garage porte ouverte « pour le protéger du vol ».","Le relier à une prise murale."],ok:"Le groupe tourne dehors, loin des ouvertures, les appareils sont branchés par rallonge et le détecteur de CO est en place.",alt:["Pas de groupe : batterie de voiture, station portable ou panneau solaire pour les petits besoins."],req:["groupe"]},
{id:"dynamo-velo",cat:"energie",art:"e_velo",t:"Produire de l'électricité à la force des muscles",diff:2,time:"Variable",
s:"Lampes et radios à manivelle, dynamo de vélo : l'électricité qui ne dépend ni du soleil ni du carburant.",
mat:["Lampe ou radio à manivelle","Vélo équipé d'une dynamo (moyeu de préférence) et d'un chargeur USB pour dynamo"],
