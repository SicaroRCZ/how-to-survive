const S_NOTE="Si un secours est joignable, appelez d'abord le 112. Ces fiches concernent les situations où aucune aide n'est disponible.";
CRAFTS.push(
{id:"bilan-blesse",cat:"soins",art:"s_bilan",t:"Évaluer un blessé (bilan)",diff:2,time:"2 à 5 min",
s:"Avant de soigner, examiner méthodiquement pour traiter d'abord ce qui tue en premier.",
mat:["Lampe","Gants ou sac plastique","Papier et crayon pour noter"],
steps:["D – DANGER : sécurisez la zone pour vous, la victime et les témoins (chute de pierres, eau, feu, circulation).","C – CONSCIENCE : parlez-lui, touchez ses épaules. Répond-elle ? Est-elle orientée (nom, lieu, jour) ?","A – VOIES AÉRIENNES : bouche dégagée ? Si elle est inconsciente, basculez doucement la tête en arrière en relevant le menton.","B – RESPIRATION : regardez, écoutez, sentez pendant 10 secondes. Pas de respiration normale → réanimation (RCP).","C – CIRCULATION : cherchez et arrêtez toute hémorragie importante (compression, garrot si nécessaire).","Examinez ensuite de la tête aux pieds : douleurs, déformations, plaies, gonflements, sensibilité et mouvement des doigts et orteils.","Questionnez : que s'est-il passé ? Allergies ? Médicaments ? Maladies connues ? Dernier repas ?","Notez tout avec l'heure, et refaites le bilan régulièrement pour voir l'évolution."],
tips:["Protégez rapidement le blessé du froid et du sol : l'hypothermie aggrave toutes les blessures.","Rassurez-le en permanence : le calme diminue le stress et la douleur."],
warn:[S_NOTE]},
{id:"evacuer-attendre",cat:"soins",art:"s_evac",t:"Évacuer ou attendre ? Les signes d'alarme",diff:1,time:"Décision",
s:"Savoir reconnaître quand un état devient grave et justifie de tout faire pour rejoindre ou appeler des secours.",
mat:["Fiche de suivi (heures, symptômes)"],
steps:["Troubles de la conscience : confusion, somnolence, comportement anormal, perte de connaissance même brève.","Difficultés respiratoires, douleur dans la poitrine, lèvres bleutées.","Saignement qui ne s'arrête pas, ou signes d'état de choc (pâleur, sueurs froides, pouls rapide).","Fièvre élevée persistante, raideur de la nuque, taches violacées sur la peau.","Plaie infectée avec traînée rouge qui remonte le membre, ou fièvre.","Douleur abdominale intense et persistante, ventre dur, vomissements de sang.","Déshydratation sévère : plus d'urine, confusion, incapacité à boire.","Fracture ouverte, membre froid et pâle sous une blessure, blessure à la tête avec vomissements répétés.","Si l'un de ces signes apparaît : envoyez chercher de l'aide (de préférence à deux), utilisez tous les moyens de signalisation et ne laissez pas la victime seule si possible."],
tips:["Si vous devez partir chercher de l'aide, laissez la victime au chaud, avec de l'eau, une lampe, un sifflet et un mot indiquant l'heure de votre départ.","Notez la position exacte de la victime (repères, coordonnées) avant de partir."],
warn:[S_NOTE]},
{id:"trousse-soins",cat:"soins",art:"s_trousse",t:"Trousse de soins pour l'autonomie",diff:1,time:"1 h de préparation",
s:"La trousse qui permet de tenir plusieurs jours sans médecin, à compléter avec votre pharmacien.",
mat:["Pansements de tailles variées et strips de suture","Compresses stériles, bandes élastiques et bande cohésive","Ruban adhésif médical","Désinfectant (chlorhexidine ou povidone iodée)","Sérum physiologique en unidoses","Pince à épiler, ciseaux, tire-tique, épingles de sûreté","Gants jetables","Couverture de survie","Thermomètre","Antidouleur et antipyrétique (paracétamol)","Anti-inflammatoire (si pas de contre-indication)","Antihistaminique","Sels de réhydratation orale","Antidiarrhéique","Pansements pour ampoules","Crème solaire, stick à lèvres","Traitements personnels pour au moins 7 jours + ordonnances","Écharpe triangulaire, attelle malléable"],
steps:["Rangez tout dans une pochette étanche, de couleur vive, avec des compartiments.","Faites valider les médicaments et leurs doses par votre pharmacien ou médecin, en fonction des membres du foyer (enfants, allergies).","Collez à l'intérieur une fiche avec les doses par âge et les numéros d'urgence.","Vérifiez les dates de péremption tous les 6 mois.","Ajoutez les traitements chroniques (asthme, diabète, cœur, allergies sévères) en quantité suffisante.","Apprenez à utiliser chaque élément avant d'en avoir besoin."],
tips:["Une bande cohésive (qui colle sur elle-même) remplace avantageusement de nombreux bandages.","Le ruban adhésif renforcé (duct tape) sert d'attelle, de strip et de pansement pour ampoules."],
warn:["Ne donnez jamais un médicament sur ordonnance à une autre personne que celle à qui il est prescrit."]},
{id:"entorse",cat:"soins",art:"s_entorse",t:"Entorse (cheville, genou, poignet)",diff:1,time:"48 à 72 h de soins",
s:"La blessure la plus fréquente en randonnée. Bien la traiter évite qu'elle s'aggrave.",
mat:["Eau froide, neige ou compresses froides dans un tissu","Bande élastique ou bande de tissu","Coussin ou sac pour surélever","Bâton de marche"],
steps:["Arrêtez-vous immédiatement : ne « marchez pas dessus pour voir ».","REPOS : ne mettez plus de poids sur l'articulation dans un premier temps.","GLACE (froid) : 15 à 20 minutes toutes les 2 à 3 heures, avec un tissu entre le froid et la peau.","COMPRESSION : bandez de façon ferme mais sans couper la circulation, en commençant loin de l'articulation (les orteils) vers le haut.","ÉLÉVATION : surélevez le membre au-dessus du niveau du cœur dès que possible.","Si vous devez marcher pour vous en sortir : bandez la cheville en huit autour du pied et de la jambe, gardez la chaussure lacée serrée et utilisez un bâton.","Après 48 à 72 h, reprenez progressivement le mouvement sans forcer."],
tips:["Repère : une incapacité à faire 4 pas, une douleur très vive en appuyant sur l'os ou une déformation font suspecter une fracture : immobilisez avec une attelle.","Vérifiez la sensibilité et la couleur des orteils après chaque bandage."],
warn:["Gonflement très important, déformation, membre froid ou bleu : traitez comme une fracture.",S_NOTE]},
{id:"fermer-plaie",cat:"soins",art:"s_suture",t:"Fermer une coupure (strips et ruban)",diff:2,time:"15 à 20 min",
s:"Rapprocher les bords d'une coupure propre et récente pour qu'elle cicatrise mieux, sans aiguille.",
mat:["Eau potable en abondance","Savon, désinfectant","Strips de suture ou ruban adhésif découpé en papillons","Compresses et bande"],
steps:["N'utilisez cette technique que pour une coupure nette, propre, récente (quelques heures) et peu profonde.","Arrêtez le saignement par compression.","Rincez abondamment la plaie à l'eau potable, sous pression (sac percé, seringue), puis nettoyez autour.","Séchez bien la peau autour de la plaie.","Collez le premier strip au milieu de la coupure, perpendiculairement : fixez-le d'un côté, rapprochez les bords sans les chevaucher, fixez de l'autre côté.","Ajoutez des strips espacés de quelques millimètres sur toute la longueur.","Fabriquez des « papillons » avec du ruban adhésif si vous n'avez pas de strips : bande étroite au centre (non collante sur la plaie), larges ailes collantes de chaque côté.","Couvrez d'une compresse ; laissez les strips en place 5 à 10 jours et surveillez l'infection."],
tips:["Une colle cyanoacrylate peut fermer une petite coupure superficielle : appliquée sur les bords rapprochés, jamais à l'intérieur de la plaie."],
warn:["NE FERMEZ PAS : morsures, plaies sales ou anciennes, plaies punctiformes (clou, épine), plaies profondes. Laissez-les ouvertes, rincées et couvertes : les fermer enferme l'infection.","Fièvre, rougeur qui s'étend ou pus : retirez les strips et laissez la plaie s'écouler."]},
{id:"fracture-ouverte",cat:"soins",art:"s_fracture",t:"Fracture ouverte",diff:3,time:"Immédiat",
s:"L'os a percé la peau : risque majeur d'hémorragie et d'infection. Une urgence absolue.",
mat:["Compresses stériles ou tissu propre","Eau potable","Matériel d'attelle","Couverture de survie"],
steps:["Contrôlez le saignement en comprimant AUTOUR de la plaie, jamais directement sur l'os.","Ne tentez pas de remettre l'os en place.","Rincez doucement la plaie à l'eau potable pour retirer les saletés visibles.","Couvrez avec un pansement stérile ou le tissu le plus propre disponible.","Immobilisez le membre dans la position où il se trouve avec une attelle rembourrée, en bloquant les articulations au-dessus et au-dessous.","Vérifiez la circulation sous la blessure (couleur, chaleur, sensibilité) après l'immobilisation.","Traitez ou prévenez l'état de choc et l'hypothermie.","Organisez l'évacuation le plus vite possible : l'infection peut devenir grave en quelques heures."],
tips:["Si le membre n'a plus de pouls ni de couleur et qu'aucun secours n'arrivera avant longtemps, un léger réalignement dans l'axe par traction douce peut être tenté par une personne formée."],
warn:["Urgence vitale : tout doit être fait pour joindre les secours."]},
{id:"luxation",cat:"soins",art:"s_luxation",t:"Luxation (épaule, doigt)",diff:2,time:"Immédiat",
s:"L'articulation est déboîtée : déformation visible, douleur intense, mouvement impossible.",
mat:["Écharpe triangulaire ou tissu","Rembourrage","Froid"],
steps:["Ne tentez pas de remettre l'articulation en place si vous n'êtes pas formé : vous pourriez léser nerfs et vaisseaux.","Immobilisez dans la position la plus confortable pour la victime, souvent celle où elle tient spontanément son membre.","Pour l'épaule : bras le long du corps maintenu par une écharpe, rembourrage entre le bras et le thorax.","Pour un doigt : attelez-le au doigt voisin avec du ruban, en plaçant un peu de tissu entre les deux.","Appliquez du froid (dans un tissu) pour limiter douleur et gonflement.","Vérifiez la circulation et la sensibilité sous la blessure.","Organisez l'évacuation."],
tips:["Plus la réduction par un professionnel est rapide, plus elle est facile : ne tardez pas à rejoindre de l'aide."],
warn:["Membre froid, pâle ou insensible sous la luxation : urgence absolue."]},
{id:"ampoules",cat:"soins",art:"s_ampoule",t:"Ampoules aux pieds",diff:1,time:"10 min",
s:"Une ampoule mal soignée peut immobiliser un marcheur et s'infecter.",
mat:["Ruban adhésif, pansement pour ampoules","Aiguille","Briquet ou désinfectant","Compresse, chaussettes sèches"],
steps:["Au premier échauffement (« point chaud ») : arrêtez-vous et couvrez immédiatement la zone avec du ruban adhésif lisse.","Ampoule petite et peu douloureuse : ne la percez pas, protégez-la avec un pansement en anneau (un trou au centre).","Ampoule grosse et douloureuse : nettoyez la peau, stérilisez une aiguille à la flamme puis laissez refroidir.","Percez le bord de l'ampoule à sa base et videz le liquide en pressant doucement.","Laissez la peau de l'ampoule en place : elle protège la plaie.","Couvrez d'un pansement ou d'une compresse maintenue par du ruban adhésif.","Changez de chaussettes, séchez vos pieds à chaque pause."],
tips:["Prévention : chaussures déjà portées, chaussettes sans coutures, pieds secs, lacage adapté."],
warn:["Liquide trouble, rougeur qui s'étend, chaleur : signes d'infection."]},
{id:"saignement-nez",cat:"soins",art:"s_nez",t:"Saignement de nez",diff:1,time:"10 à 15 min",
s:"Fréquent et généralement bénin, mais souvent mal soigné.",
mat:["Mouchoirs","Froid (facultatif)"],
steps:["Faites asseoir la personne, tête penchée en AVANT (pas en arrière : le sang coulerait dans la gorge).","Demandez-lui de se moucher une fois pour évacuer les caillots.","Comprimez fermement la partie molle du nez entre le pouce et l'index, juste sous l'os.","Maintenez la pression sans relâcher pendant 10 minutes, montre en main.","Si cela saigne encore, recommencez 10 minutes.","Après l'arrêt, évitez de se moucher et les efforts pendant quelques heures."],
tips:["Un linge froid sur la nuque ou l'arête du nez peut aider."],
warn:["Saignement après un choc à la tête, saignement qui dure plus de 20 minutes ou personne sous anticoagulants : avis médical."]},
{id:"etat-choc",cat:"soins",art:"s_choc",t:"État de choc",diff:2,time:"Immédiat",
s:"Le corps n'arrive plus à irriguer les organes, souvent après une hémorragie, une brûlure étendue ou une allergie grave.",
mat:["Couverture de survie, vêtements","Isolant de sol"],
steps:["Reconnaissez les signes : pâleur, sueurs froides, peau froide et moite, pouls rapide et faible, respiration rapide, soif, anxiété, puis confusion.","Traitez la cause : arrêtez toute hémorragie.","Allongez la victime sur le dos, isolée du sol.","Surélevez les jambes d'environ 30 cm, sauf en cas de blessure aux jambes, au bassin, au dos ou à la tête.","Couvrez-la pour éviter le refroidissement, sans la surchauffer.","Ne donnez ni à boire ni à manger (sauf si l'évacuation prendra des jours et qu'elle est parfaitement consciente : petites gorgées).","Rassurez-la, surveillez la conscience et la respiration ; placez-la en PLS si elle perd connaissance en respirant."],
tips:["Si elle a du mal à respirer, laissez-la en position demi-assise."],
warn:["L'état de choc est une urgence vitale : tout doit être fait pour obtenir de l'aide."]},
{id:"trauma-tete",cat:"soins",art:"s_tete",t:"Choc à la tête",diff:2,time:"Surveillance 24 h",
s:"Après une chute ou un coup à la tête, les signes graves peuvent apparaître plusieurs heures plus tard.",
mat:["Froid","Lampe (pupilles)","Fiche de surveillance"],
steps:["Si la personne est inconsciente ou si la chute a été violente, suspectez une atteinte du cou : bougez-la le moins possible.","Appliquez du froid sur la bosse, dans un tissu.","Surveillez pendant au moins 24 heures : conscience, comportement, maux de tête, vomissements.","Vérifiez les pupilles avec une lampe : elles doivent être de même taille et se contracter à la lumière.","La nuit, réveillez-la toutes les 2 à 3 heures pour vérifier qu'elle se réveille normalement et reste cohérente.","Repos complet, pas d'effort ni d'alcool."],
tips:["Notez l'heure de l'accident et chaque observation : c'est précieux pour les secours."],
warn:["SIGNES D'ALARME : perte de connaissance, vomissements répétés, mal de tête qui s'aggrave, confusion, somnolence anormale, pupilles inégales, convulsions, écoulement clair du nez ou des oreilles → évacuation urgente."]},
{id:"diarrhee",cat:"soins",art:"s_diarrhee",t:"Diarrhée et vomissements",diff:1,time:"1 à 3 jours",
s:"La cause la plus fréquente de mise hors d'état en situation de survie. Le danger principal est la déshydratation.",
mat:["Eau purifiée","Sucre et sel","Aliments simples : riz, pain, biscuits secs, banane"],
steps:["Réhydratez avant tout : solution de réhydratation (1 L d'eau potable, 6 cuillères à café rases de sucre, 1/2 cuillère à café rase de sel) ou sels de réhydratation du commerce.","Buvez par petites gorgées fréquentes, surtout en cas de vomissements (une cuillère toutes les 1 à 2 minutes).","Reprenez une alimentation légère dès que possible : riz, pain, carottes cuites, banane, biscuits secs.","Évitez laitages, graisses, alcool, café et aliments sucrés concentrés.","Renforcez l'hygiène : lavage des mains, eau purifiée, nourriture bien cuite, isolement des latrines.","Les remèdes traditionnels cités par les manuels militaires (charbon de bois, infusion d'écorce riche en tanins) ont une efficacité limitée : l'hydratation reste l'essentiel."],
tips:["Surveillez la couleur et la quantité d'urine pour juger de la réhydratation."],
warn:["Sang dans les selles, forte fièvre, plus de 3 jours, ou signes de déshydratation sévère (surtout enfant, bébé ou personne âgée) : cherchez de l'aide médicale."]},
{id:"fievre",cat:"soins",art:"s_fievre",t:"Fièvre",diff:1,time:"Surveillance",
s:"La fièvre est une réaction de défense. Il faut surtout surveiller la personne et la cause.",
mat:["Thermomètre","Eau","Linges humides","Paracétamol (si disponible)"],
steps:["Mesurez la température : la fièvre commence à 38 °C.","Faites boire abondamment : la fièvre fait perdre beaucoup d'eau.","Allégez les vêtements et couvertures, sans laisser la personne avoir froid.","Appliquez des linges tièdes (pas froids) sur le front, la nuque, les bras.","Repos complet.","Si vous en disposez, un antipyrétique (paracétamol) aux doses indiquées sur la notice, selon l'âge et le poids.","Cherchez la cause : plaie infectée, morsure de tique, gorge, urines, diarrhée."],
tips:["Chez l'enfant, observez surtout le comportement : un enfant qui joue malgré la fièvre est rassurant."],
warn:["URGENCE : raideur de la nuque, taches violacées sur la peau qui ne s'effacent pas sous la pression d'un verre, confusion, difficulté à respirer, nourrisson de moins de 3 mois, fièvre de plus de 3 jours."]},
{id:"mal-de-dents",cat:"soins",art:"s_dent",t:"Mal de dents",diff:1,time:"Variable",
s:"Une rage de dents peut rendre fou. Soulager en attendant un dentiste.",
mat:["Eau tiède salée","Clous de girofle","Fil dentaire","Froid"],
steps:["Rincez la bouche à l'eau tiède salée (1 cuillère à café de sel dans un verre), plusieurs fois par jour.","Retirez un éventuel débris alimentaire coincé avec du fil dentaire.","Placez un clou de girofle contre la dent douloureuse ou appliquez une goutte d'huile essentielle de girofle diluée : l'eugénol qu'il contient a un effet anesthésiant local.","Appliquez du froid sur la joue (pas de chaud).","Dormez la tête légèrement surélevée.","Évitez les aliments très froids, chauds ou sucrés et mâchez de l'autre côté.","Dent cassée : protégez les bords tranchants avec de la cire (bougie) ou un chewing-gum sans sucre."],
tips:["Un antidouleur classique (paracétamol, anti-inflammatoire) peut compléter si vous en avez."],
warn:["Joue gonflée, fièvre, difficulté à avaler ou à ouvrir la bouche : abcès potentiellement grave, cherchez une aide médicale."]},
{id:"corps-etranger-oeil",cat:"soins",art:"s_oeil",t:"Poussière ou produit dans l'œil",diff:1,time:"5 à 15 min",
s:"Retirer en sécurité une poussière ou rincer un produit irritant.",
mat:["Eau potable ou sérum physiologique","Coin de tissu propre","Compresse"],
steps:["Ne frottez pas l'œil.","Clignez plusieurs fois et laissez les larmes faire leur travail.","Rincez à l'eau propre, tête penchée sur le côté de l'œil touché, en versant de l'intérieur (côté nez) vers l'extérieur.","Faites passer la paupière supérieure par-dessus la paupière inférieure en la tirant doucement par les cils.","Si la poussière est visible sur le blanc de l'œil, retirez-la délicatement avec le coin d'un tissu propre humide.","PRODUIT CHIMIQUE : rincez immédiatement et abondamment pendant au moins 15 minutes."],
tips:["Lentilles de contact : retirez-les avant de rincer."],
warn:["Objet planté dans l'œil : ne le retirez pas, couvrez les DEUX yeux (pour limiter les mouvements) et évacuez.","Douleur persistante, baisse de la vue : avis médical."]},
{id:"cecite-neiges",cat:"soins",art:"s_neige",t:"Ophtalmie des neiges (et lunettes improvisées)",diff:1,time:"24 à 72 h",
s:"Une brûlure de l'œil par les UV réfléchis par la neige ou l'eau, très douloureuse mais généralement réversible.",
mat:["Écorce, carton ou ruban adhésif","Couteau","Tissu sombre, compresses froides"],
steps:["Signes, souvent 6 à 12 h après l'exposition : sensation de sable dans les yeux, larmoiement, rougeur, douleur à la lumière.","Mettez-vous dans l'obscurité ou couvrez les deux yeux d'un bandeau sombre.","Appliquez des compresses froides sur les paupières fermées.","Ne frottez pas les yeux ; retirez les lentilles.","Repos : la guérison prend généralement 24 à 72 heures.","PRÉVENTION : fabriquez des lunettes à fentes dans de l'écorce, du carton ou plusieurs couches de ruban adhésif : une fente horizontale étroite par œil, maintenue par une cordelette.","Noircissez la peau sous les yeux avec du charbon pour réduire la réverbération."],
tips:["Même par temps couvert, les UV sont intenses en montagne enneigée."],
warn:["Si la vue ne s'améliore pas après 3 jours : avis médical."]},
{id:"pied-immersion",cat:"soins",art:"s_pied",t:"Pied d'immersion (pied de tranchée)",diff:1,time:"Prévention quotidienne",
s:"Des pieds restés mouillés et froids pendant des heures s'abîment gravement, même sans gel.",
mat:["Chaussettes de rechange sèches","Sacs plastiques (barrière)","Feu ou chaleur corporelle pour sécher"],
steps:["Signes : pieds froids, gonflés, pâles ou marbrés, engourdis, puis douloureux en se réchauffant.","Retirez chaussures et chaussettes mouillées dès que possible.","Séchez soigneusement les pieds, entre les orteils compris.","Réchauffez doucement (contre le corps d'un compagnon, couverture), sans feu direct ni massage.","Surélevez les pieds et laissez-les à l'air.","Prévention : changez de chaussettes au moins une fois par jour, séchez la paire mouillée contre votre corps, aérez vos pieds à chaque pause.","Dormez avec des chaussettes sèches, jamais avec des chaussures mouillées."],
tips:["Un sac plastique entre la chaussette sèche et la chaussure mouillée protège temporairement."],
warn:["Ampoules, peau noircie ou douleur intense : lésions graves, évacuation."]},
{id:"coup-de-soleil",cat:"soins",art:"s_soleil",t:"Coup de soleil",diff:1,time:"2 à 5 jours",
s:"Une brûlure du premier ou second degré qui fatigue et déshydrate.",
mat:["Eau fraîche","Ombre","Gel d'aloe vera (si disponible)","Vêtements couvrants"],
steps:["Mettez-vous à l'ombre immédiatement.","Rafraîchissez la peau avec de l'eau fraîche (linges humides, douche) pendant plusieurs minutes.","Buvez abondamment.","Appliquez un gel d'aloe vera ou une crème hydratante apaisante.","Ne percez pas les cloques.","Couvrez la zone avec des vêtements légers et amples pour les jours suivants."],
tips:["Le gel frais de la feuille d'aloe vera (plante d'intérieur courante) est traditionnellement utilisé et apaisant."],
warn:["Cloques étendues, fièvre, frissons, nausées, confusion : coup de chaleur ou brûlure grave, avis médical."]},
{id:"coup-de-chaleur",cat:"soins",art:"s_chaleur",t:"Coup de chaleur",diff:2,time:"Immédiat",
s:"La température du corps dépasse 40 °C : une urgence vitale qui demande un refroidissement immédiat.",
mat:["Eau","Linges, vêtements mouillés","Ombre, éventail, vent"],
steps:["Signes : peau très chaude (sèche ou moite), confusion, comportement anormal, maux de tête, nausées, malaise, convulsions.","Mettez la personne à l'ombre ou au frais, allongée.","Retirez un maximum de vêtements.","REFROIDISSEZ immédiatement : aspergez d'eau et éventez en continu ; placez des linges mouillés ou du froid au cou, aux aisselles et à l'aine.","Si possible, immergez le corps dans de l'eau fraîche (rivière, bassin) en surveillant la tête.","Si elle est consciente et peut avaler : petites gorgées d'eau fraîche.","Continuez jusqu'à amélioration nette de la conscience."],
tips:["L'épuisement par la chaleur (fatigue, sueurs abondantes, vertiges, conscience normale) se traite par le repos au frais et la réhydratation, mais peut évoluer vers le coup de chaleur."],
warn:["Urgence vitale : 112 si possible. Ne donnez rien à boire à une personne confuse ou inconsciente."]},
{id:"echardes",cat:"soins",art:"s_echarde",t:"Échardes, épines et hameçons",diff:1,time:"5 à 15 min",
s:"Retirer un corps étranger de la peau sans provoquer d'infection.",
mat:["Pince à épiler","Aiguille","Flamme ou désinfectant","Eau tiède savonneuse"],
steps:["Lavez la zone et vos mains.","Si l'écharde dépasse : saisissez-la au plus près de la peau avec une pince et tirez dans l'axe d'entrée.","Si elle est sous la peau : stérilisez une aiguille, soulevez doucement la peau au-dessus de l'écharde puis retirez-la à la pince.","Un trempage de 10 minutes dans l'eau tiède ramollit la peau et facilite le retrait.","HAMEÇON : poussez la pointe à travers la peau jusqu'à faire ressortir l'ardillon, coupez-le, puis reculez l'hameçon par son chemin d'entrée.","Désinfectez et couvrez."],
tips:["Le plantain écrasé appliqué en cataplasme est traditionnellement utilisé pour apaiser la zone."],
warn:["Écharde profonde, près de l'œil, sous un ongle ou qui ne sort pas : ne creusez pas, consultez.","Vérifiez votre vaccination antitétanique."]},
{id:"morsure-animal",cat:"soins",art:"s_animal",t:"Morsure d'animal (chien, renard, chauve-souris)",diff:1,time:"15 min + consultation",
s:"Les morsures s'infectent très souvent et peuvent transmettre la rage.",
mat:["Eau et savon en quantité","Désinfectant","Compresses"],
steps:["Lavez immédiatement et abondamment la plaie à l'eau et au savon pendant au moins 15 minutes : c'est la mesure la plus efficace contre la rage.","Rincez, puis désinfectez.","Ne fermez pas la plaie (pas de strips) : couvrez simplement.","Surélevez le membre et surveillez l'infection.","Notez l'animal, son comportement et l'endroit ; si possible, identifiez son propriétaire.","Consultez un médecin le plus vite possible (rage, tétanos, antibiotiques), même plusieurs jours après."],
tips:["En Europe, toute morsure ou griffure de chauve-souris doit être considérée comme à risque."],
warn:["La rage déclarée est mortelle : un traitement préventif rapide après la morsure est indispensable."]},
{id:"reaction-allergique",cat:"soins",art:"s_allergie",t:"Réaction allergique grave",diff:2,time:"Immédiat",
s:"Piqûre, aliment, médicament : l'anaphylaxie peut tuer en quelques minutes.",
mat:["Auto-injecteur d'adrénaline (si prescrit)","Antihistaminique"],
steps:["Réaction légère (démangeaisons, plaques locales) : éloignez l'allergène, donnez un antihistaminique si disponible, surveillez.","Signes graves : gonflement du visage, des lèvres ou de la langue, difficulté à respirer, voix rauque, malaise, vomissements, chute de tension.","Utilisez immédiatement l'auto-injecteur d'adrénaline dans la face externe de la cuisse, à travers les vêtements si nécessaire.","Appelez le 112 dès que possible.","Allongez la personne jambes surélevées ; si elle respire mal, laissez-la assise.","Si aucune amélioration après 5 à 15 minutes, une deuxième injection peut être faite si un second stylo est disponible."],
tips:["Les personnes allergiques connues doivent toujours porter deux auto-injecteurs."],
warn:["Ne laissez jamais seule une personne qui a fait une réaction grave : une seconde réaction peut survenir plusieurs heures après."]},
{id:"toux-gorge",cat:"soins",art:"s_gorge",t:"Toux, rhume et mal de gorge",diff:1,time:"Quelques jours",
s:"Les maux courants qui épuisent en conditions difficiles, et les remèdes simples qui aident.",
mat:["Eau chaude","Miel","Sel","Thym (frais ou séché)"],
steps:["Gargarisez-vous à l'eau tiède salée (1/2 cuillère à café de sel par verre) plusieurs fois par jour.","Buvez des boissons chaudes en quantité.","Miel : une cuillère, seule ou dans de l'eau chaude, apaise la toux.","Infusion de thym : une cuillère de thym pour une tasse d'eau bouillante, 10 minutes d'infusion ; utilisée traditionnellement contre la toux.","Inhalation de vapeur d'eau chaude, tête sous un tissu, pour dégager le nez.","Reposez-vous, restez au chaud et au sec."],
tips:["Dormir la tête légèrement surélevée limite la toux nocturne."],
warn:["Pas de miel avant l'âge de 1 an (risque de botulisme infantile).","Attention aux inhalations avec les enfants : risque de brûlure.","Difficulté à respirer, fièvre élevée, douleur thoracique : avis médical."]},
{id:"infection-plaie",cat:"soins",art:"s_infection",t:"Plaie infectée et abcès",diff:2,time:"Plusieurs jours",
s:"Reconnaître et freiner une infection quand aucun antibiotique n'est disponible.",
mat:["Eau potable chaude","Linges propres","Désinfectant","Compresses"],
steps:["Signes : rougeur, chaleur, gonflement, douleur croissante, pus, parfois fièvre.","Ouvrez la plaie si elle a été refermée (retirez les strips) pour que le pus puisse s'écouler.","Appliquez des compresses chaudes (pas brûlantes) 15 à 20 minutes, 3 à 4 fois par jour : cela favorise le drainage.","Rincez abondamment à l'eau potable à chaque changement de pansement.","Couvrez d'une compresse propre, changez-la au moins une fois par jour.","Surélevez et mettez au repos le membre atteint.","Tracez au stylo le bord de la rougeur pour voir si elle progresse."],
tips:["Hydratation, repos et alimentation aident le corps à lutter contre l'infection."],
warn:["URGENCE : traînée rouge qui remonte le membre, fièvre, frissons, rougeur qui s'étend rapidement. Un traitement antibiotique est nécessaire au plus vite.","Ne pressez jamais un abcès profond ou sur le visage."]},
{id:"hygiene-camp",cat:"soins",art:"s_hygiene",t:"Hygiène au camp : prévenir les maladies",diff:1,time:"Routine quotidienne",
s:"En situation de crise, la plupart des maladies viennent de l'eau et des mains sales.",
mat:["Savon ou cendres","Pelle ou bâton","Eau purifiée"],
steps:["Lavez-vous les mains avant de cuisiner, avant de manger et après être allé aux toilettes. À défaut de savon, frottez avec de la cendre fine puis rincez.","Installez les toilettes à au moins 60 m des points d'eau et du camp, en aval.","Creusez un trou de 15 à 20 cm de profondeur et rebouchez après chaque usage.","Buvez et cuisinez uniquement avec de l'eau purifiée ; lavez la vaisselle à l'eau bouillante.","Jetez ou brûlez les restes de nourriture loin du camp (animaux, insectes).","Lavez-vous régulièrement, au moins le visage, les aisselles, l'entrejambe et les pieds.","Brossez-vous les dents ; à défaut, mâchez une brindille de bois tendre effilochée."],
tips:["Une gourde percée suspendue au-dessus d'une bassine fait un lavabo économe en eau."],
warn:["Une seule personne malade peut contaminer tout un groupe : isolez ses toilettes et ses couverts."]},
{id:"plantes-medicinales",cat:"soins",art:"s_plantes",t:"Plantes de soin d'usage traditionnel",diff:2,time:"Apprentissage",
s:"Quelques plantes courantes en Europe utilisées traditionnellement pour de petits maux. À connaître, avec prudence.",
mat:["Guide botanique","Eau chaude"],
steps:["PLANTAIN : feuille fraîche mâchée ou écrasée appliquée sur une piqûre d'insecte ou d'ortie ; usage traditionnel apaisant.","ACHILLÉE MILLEFEUILLE : feuilles écrasées traditionnellement appliquées sur de petites coupures ; en infusion pour la digestion.","CAMOMILLE : infusion apaisante, pour la digestion et le sommeil.","THYM : infusion contre la toux et les maux de gorge.","MENTHE : infusion pour les nausées et la digestion.","ÉCORCE DE SAULE : contient de la salicine, cousine de l'aspirine ; décoction traditionnelle contre la douleur et la fièvre.","MIEL : appliqué en couche fine sur une petite plaie superficielle, il a des propriétés antibactériennes reconnues (le miel médical est le plus sûr).","CLOU DE GIROFLE : contre le mal de dents (voir la fiche dédiée)."],
tips:["Les plantes ne remplacent pas un traitement en cas de maladie grave ; elles soulagent des maux légers."],
warn:["Identification à 100 % obligatoire : beaucoup de plantes toxiques ressemblent à des plantes de soin (achillée et ciguë, par exemple).","Écorce de saule : à éviter en cas d'allergie à l'aspirine, de traitement anticoagulant, de grossesse et chez l'enfant.","Grossesse, allaitement, enfants, traitements en cours : demandez conseil à un professionnel avant tout usage."]},
{id:"douleur-sans-medicament",cat:"soins",art:"s_douleur",t:"Soulager la douleur sans médicament",diff:1,time:"Variable",
s:"Quand la pharmacie est vide, plusieurs gestes simples réduisent nettement la douleur.",
mat:["Froid ou chaleur","Matériel d'immobilisation","Coussins"],
steps:["IMMOBILISER : une blessure immobilisée fait beaucoup moins mal (attelle, écharpe).","FROID sur une blessure récente (entorse, coup) pendant les premières 48 h, toujours à travers un tissu.","CHALEUR douce pour les douleurs musculaires, les crampes et les courbatures (pas sur une blessure récente).","POSITION : surélevez le membre blessé, trouvez la position la plus confortable.","RESPIRATION : expirations lentes et longues, respiration carrée ; elles diminuent la perception de la douleur.","DISTRACTION ET PRÉSENCE : parler, rassurer, occuper l'esprit."],
tips:["Le stress et la peur augmentent la douleur : rassurer est un vrai soin."],
warn:["Une douleur qui augmente malgré tout doit faire rechercher une complication (infection, fracture, problème interne)."]},
{id:"hypoglycemie",cat:"soins",art:"s_sucre",t:"Malaise et hypoglycémie",diff:1,time:"15 à 30 min",
s:"Manque de sucre dans le sang : fréquent chez les diabétiques et après un gros effort sans manger.",
mat:["Sucre, bonbons, jus de fruit, miel, pâte de fruits"],
steps:["Signes : sueurs, tremblements, pâleur, faim brutale, irritabilité, confusion, comportement inhabituel.","Si la personne est consciente et peut avaler : donnez 15 à 20 g de sucre rapide (environ 3 à 4 morceaux de sucre, un verre de jus de fruit ou une cuillère à soupe de miel).","Faites-la asseoir ou allonger.","Attendez 15 minutes : si pas d'amélioration, redonnez la même quantité.","Une fois rétablie, faites-lui manger un aliment plus consistant (pain, biscuits, fruits secs).","Si elle est diabétique, vérifiez sa glycémie si un lecteur est disponible."],
tips:["En situation de survie, mangez régulièrement de petites quantités plutôt qu'un gros repas."],
warn:["Personne inconsciente : ne donnez RIEN par la bouche, placez-la en PLS et appelez les secours."]},
{id:"douleur-thoracique",cat:"soins",art:"s_coeur",t:"Douleur dans la poitrine",diff:2,time:"Immédiat",
s:"Une douleur thoracique peut annoncer une crise cardiaque. Chaque minute compte.",
mat:["Aspirine (si disponible et pas de contre-indication)"],
steps:["Signes évocateurs : douleur ou serrement au milieu de la poitrine, pouvant irradier dans le bras gauche, la mâchoire ou le dos ; essoufflement, sueurs, nausées, angoisse.","Arrêtez tout effort ; faites asseoir la personne, en position demi-assise.","Appelez le 112 par tous les moyens.","Desserrez les vêtements, rassurez-la.","Si elle n'est pas allergique, ne prend pas d'anticoagulants et n'a pas de contre-indication connue, une aspirine à croquer (150 à 300 mg) est recommandée en premiers secours.","Si elle a un traitement prescrit pour le cœur (spray sous la langue), aidez-la à le prendre.","Surveillez en permanence : en cas de perte de connaissance sans respiration normale, commencez la RCP."],
tips:["Chez les femmes, les personnes âgées et les diabétiques, les signes peuvent être plus discrets : fatigue, nausées, essoufflement."],
warn:["Ne laissez jamais la personne marcher pour aller chercher de l'aide."]},
{id:"crampes",cat:"soins",art:"s_crampe",t:"Crampes musculaires",diff:1,time:"5 min",
s:"Douloureuses mais bénignes, elles signalent souvent fatigue, déshydratation ou froid.",
mat:["Eau","Une pincée de sel"],
steps:["Arrêtez l'effort.","Étirez doucement le muscle concerné : pour le mollet, tirez la pointe du pied vers vous, jambe tendue.","Massez légèrement le muscle.","Buvez de l'eau avec une pincée de sel ou une solution de réhydratation.","Reprenez l'effort progressivement, en mangeant un peu.","Échauffez-vous et hydratez-vous régulièrement pour prévenir."],
tips:["Les crampes nocturnes diminuent souvent avec des étirements doux avant le coucher."],
warn:["Crampe avec gonflement, chaleur et douleur persistante du mollet : possible phlébite, avis médical."]}
);

{id:"pl-arum",k:"p",s:"tox",n:"Arum tacheté (gouet)",lat:"Arum maculatum",q:"Avril à octobre",o:"Sous-bois, haies",i:"Feuilles en fer de flèche, parfois tachées ; inflorescence en cornet ; épi de baies rouges en été.",c:"Oseille, AIL DES OURS (jeunes feuilles).",u:"Brûlures intenses de la bouche et de la gorge, gonflement."},

{id:"po-truite",k:"f",s:"ok",n:"Truite fario",lat:"Salmo trutta fario",q:"Pêche réglementée : ouverture, tailles minimales et quotas selon la région",o:"Eau douce : rivières et ruisseaux frais, clairs et bien oxygénés",i:"Corps fuselé, dos brun-olive, flancs à points noirs et rouges cerclés de clair ; petite nageoire charnue (adipeuse) entre la dorsale et la queue.",c:"Truite arc-en-ciel, ombre et autres salmonidés : tous comestibles.",u:"Excellente chair. Videz immédiatement, cuisez entière sur braises, en papillote ou sur une planche. Toujours cuite à cœur (parasites)."},

{id:"po-sandre",k:"f",s:"ok",n:"Sandre",lat:"Sander lucioperca",q:"Fermé au printemps (frai) dans la plupart des régions",o:"Eau douce : grands cours d'eau, canaux, lacs troubles",i:"Corps allongé gris-vert à bandes sombres diffuses, deux dorsales séparées (la première épineuse), gros yeux vitreux, crocs sur l'avant.",c:"Perche (plus trapue, bandes nettes).",u:"Une des meilleures chairs d'eau douce, peu d'arêtes. Épines dorsales piquantes. Cuire à cœur."},
{id:"po-carpe",k:"f",s:"ok",n:"Carpe commune",lat:"Cyprinus carpio",q:"Toute l'année selon la réglementation locale",o:"Eau douce : étangs, lacs, rivières lentes et canaux",i:"Corps massif bronze-doré, grandes écailles (parfois absentes : carpe miroir ou cuir), 4 barbillons autour de la bouche.",c:"Carassin (sans barbillons), barbeau (museau pointu, rivières vives).",u:"Laissez-la dégorger 1 à 2 jours dans une eau claire pour ôter le goût de vase si possible. Nombreuses arêtes. Les grosses carpes d'eaux polluées accumulent des polluants : préférez les jeunes."},
{id:"po-gardon",k:"f",s:"ok",n:"Gardon et rotengle",lat:"Rutilus rutilus, Scardinius erythrophthalmus",q:"Toute l'année selon la réglementation locale",o:"Eau douce : presque toutes les eaux calmes",i:"Petits poissons argentés (« poissons blancs ») ; œil rouge, nageoires rougeâtres. Très faciles à prendre au pain ou au ver.",c:"Ablette, chevesne, jeunes brèmes : tous comestibles.",u:"Très nombreuses petites arêtes : faites frire les petits entiers bien croustillants, ou cuisez-les en soupe et passez le bouillon. Source de nourriture fiable en eau douce."},

{id:"po-plie",k:"f",s:"ok",n:"Plie (carrelet) et flet",lat:"Pleuronectes platessa, Platichthys flesus",q:"Toute l'année, meilleure hors frai (hiver)",o:"Mer et estuaires : fonds sableux ; le flet remonte en eau saumâtre",i:"Poissons plats couchés sur le flanc, les deux yeux du même côté. Plie : face supérieure brune à taches orange vif.",c:"Sole, limande : comestibles. Attention à la VIVE et à la PASTENAGUE, enfouies dans le même sable.",u:"Comestibles. Cuire entiers à la poêle ou sur braises."},

{id:"po-globe",k:"f",s:"mort",n:"Poissons-globes (dont Lagocephalus)",lat:"Lagocephalus sceleratus et autres Tetraodontidae",q:"En expansion en Méditerranée depuis 2003, observé jusqu'en Espagne et dans le nord de l'Adriatique",o:"Mer : Méditerranée surtout ; rares en Atlantique",i:"Corps en massue qui se gonfle d'eau ou d'air, peau sans écailles. Lagocephalus sceleratus : dos gris argenté semé de petits points sombres, bande argentée sur le flanc, ventre blanc, 4 dents soudées en bec.",c:"Peut être confondu par des pêcheurs avec des poissons comestibles.",u:"MORTEL : contient de la tétrodotoxine, une toxine paralysante que la cuisson ne détruit pas, sans antidote. Consommation interdite dans l'UE. Ne le mangez sous aucune forme. Coupez le fil sans approcher les mains (morsures graves) et signalez la prise. Picotements des lèvres ou engourdissement après un repas de poisson : 112 immédiatement."}
